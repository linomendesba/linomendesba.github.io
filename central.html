<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="img/favicon.ico" type="image/x-icon" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet" />
    <title>DataVirtual | Gerador de Tips</title>
    <meta name="author" content="DataVirtual" />
    <style>
      :root {
        --bg: #0a0f16;
        --surface: #111823;
        --surface-2: #172030;
        --line: #263247;
        --text: #e6edf7;
        --text-dim: #8b9ab0;
        --accent: #1d7cb3;
        --on-accent: #ffffff;
        --success: #17a862;
        --danger: #d92d4b;
        --sans: 'Outfit', -apple-system, 'Segoe UI', sans-serif;
        --mono: 'JetBrains Mono', 'Courier New', monospace;
        --r: 6px;
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }

      html { background: var(--bg); scrollbar-width: thin; scrollbar-color: #2a3750 var(--bg); }

      body {
        font-family: var(--sans);
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        line-height: 1.5;
        overflow-x: hidden;
      }

      /* Header vem do header.html */
      #header { position: relative; z-index: 2; }
      .header-spacer { height: 56px; }

      /* Layout */
      .main-container {
        max-width: 1100px;
        margin: 1.5rem auto 3rem;
        padding: 0 1rem;
      }

      .container {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--r);
        overflow: hidden;
      }

      .section {
        padding: 1.5rem;
        border-bottom: 1px solid var(--line);
      }

      .section:last-child { border-bottom: none; }

      .section h2,
      .dual-section h3 {
        font-size: 1rem;
        font-weight: 600;
        color: var(--text);
        margin-bottom: 1rem;
        text-align: left;
      }

      /* Casas de apostas */
      .casas-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: .75rem;
      }

      .casa-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1rem;
        background: var(--surface-2);
        border: 1px solid var(--line);
        border-radius: var(--r);
        color: var(--text);
        cursor: pointer;
        font-weight: 600;
        font-size: .95rem;
        user-select: none;
        transition: background-color .15s, border-color .15s, color .15s;
      }

      .casa-btn:hover { border-color: #3a4a66; background: #1c273a; }

      .casa-btn.is-selected {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--on-accent);
      }

      /* Ligas / mercado */
      .button-group {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        gap: .75rem;
      }

      .button-group label {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: .75rem;
        background: var(--surface-2);
        border: 1px solid var(--line);
        border-radius: var(--r);
        color: var(--text);
        cursor: pointer;
        font-weight: 500;
        font-size: .9rem;
        user-select: none;
        transition: background-color .15s, border-color .15s, color .15s;
      }

      .button-group label:hover { border-color: #3a4a66; background: #1c273a; }

      .button-group label.is-selected {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--on-accent);
        font-weight: 600;
      }

      /* Minutos */
      #minutos {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(54px, 1fr));
        gap: .5rem;
      }

      #minutos label {
        padding: .6rem .4rem;
        background: var(--surface-2);
        border: 1px solid var(--line);
        border-radius: var(--r);
        text-align: center;
        cursor: pointer;
        font-size: .9rem;
        font-weight: 500;
        font-variant-numeric: tabular-nums;
        user-select: none;
        transition: background-color .15s, border-color .15s, color .15s;
      }

      #minutos label:hover { border-color: #3a4a66; background: #1c273a; }

      #minutos label.is-selected {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--on-accent);
        font-weight: 600;
      }

      .button-group input, #minutos input { display: none; }

      /* Moedas */
      .moedas,
      .moedas-container {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: .75rem;
      }

      .moeda,
      .moedas-container label {
        display: flex;
        align-items: center;
        gap: .65rem;
        padding: .75rem .9rem;
        background: var(--surface-2);
        border: 1px solid var(--line);
        border-radius: var(--r);
        cursor: pointer;
        font-size: .9rem;
        user-select: none;
        transition: background-color .15s, border-color .15s;
      }

      .moeda:hover,
      .moedas-container label:hover { border-color: #3a4a66; background: #1c273a; }

      .moeda.checked,
      .moeda:has(input:checked),
      .moedas-container label:has(input:checked) {
        border-color: var(--accent);
        background: #12293b;
      }

      .moeda input, .moedas-container input {
        width: 16px;
        height: 16px;
        accent-color: var(--accent);
        cursor: pointer;
      }

      /* Resultado Green + texto personalizado */
      .dual-section {
        display: flex;
        gap: 2rem;
        align-items: flex-start;
        flex-wrap: wrap;
      }

      .dual-section > div { flex: 1; min-width: 280px; }

      .side-by-side-group {
        display: flex;
        align-items: flex-end;
        gap: 1rem;
        flex-wrap: wrap;
      }

      .form-group-inline {
        display: flex;
        flex-direction: column;
        gap: .4rem;
      }

      .form-group-inline label {
        font-size: .85rem;
        font-weight: 500;
        color: var(--text-dim);
      }

      .form-group-inline input,
      #texto-personalizado {
        padding: .65rem .75rem;
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: var(--r);
        color: var(--text);
        font-family: var(--sans);
        font-size: .95rem;
        color-scheme: dark;
      }

      .form-group-inline input { width: 150px; }
      #texto-personalizado { width: 100%; }

      input:focus {
        outline: none;
        border-color: var(--accent);
      }

      .form-group {
        display: flex;
        flex-direction: column;
        gap: .75rem;
      }

      /* Saída */
      #output {
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: var(--r);
        padding: 1.25rem;
        min-height: 200px;
        white-space: pre-wrap;
        font-family: var(--mono);
        font-size: .88rem;
        line-height: 1.6;
        color: var(--text);
      }

      /* Botões de ação */
      .action-buttons {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        gap: .75rem;
        margin-top: 1rem;
      }

      .section h2 + .action-buttons { margin-top: 0; }

      .action-buttons button,
      .form-group button {
        font-family: var(--sans);
        font-size: .95rem;
        font-weight: 600;
        padding: .8rem 1rem;
        border-radius: var(--r);
        border: 1px solid transparent;
        cursor: pointer;
        transition: background-color .15s, border-color .15s, filter .15s;
      }

      .btn-primary { background: #1d7cb3; color: #fff; }
      .btn-primary:hover { background: #176591; }

      .btn-secondary { background: var(--surface-2); border-color: var(--line) !important; color: var(--text); }
      .btn-secondary:hover { background: #1c273a; border-color: #3a4a66 !important; }

      .btn-success { background: var(--success); color: #fff; }
      .btn-success:hover { filter: brightness(1.1); }

      .btn-danger { background: var(--danger); color: #fff; }
      .btn-danger:hover { filter: brightness(1.1); }

      .action-buttons button.is-done,
      .form-group button.is-done {
        background: #334766;
        border-color: #334766 !important;
        color: #fff;
      }

      /* Placeholder */
      .placeholder-msg {
        grid-column: 1 / -1;
        color: var(--text-dim);
        font-size: .9rem;
        padding: .5rem 0;
      }

      /* Responsivo */
      @media (max-width: 768px) {
        .main-container { padding: 0 .75rem; margin-top: 1rem; }
        .section { padding: 1rem; }
        .button-group, .moedas, .moedas-container, .action-buttons { grid-template-columns: repeat(2, 1fr); }
        #minutos { grid-template-columns: repeat(auto-fill, minmax(48px, 1fr)); }
        .casas-grid { grid-template-columns: repeat(2, 1fr); }
        .dual-section { gap: 1.25rem; }
        .dual-section > div { min-width: 100%; }
      }

      /* Scrollbar */
      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { background: var(--bg); }
      ::-webkit-scrollbar-thumb { background: #2a3750; border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: #3a4a66; }
    </style>
  </head>

  <body>
    <div id="header"></div>
    <div class="header-spacer"></div>

    <main class="main-container">
      <div class="container">

        <!-- ==========================================
             SEÇÃO: CASA DE APOSTAS
             ========================================== -->
        <section class="section">
          <h2>Selecione a Casa de Apostas</h2>
          <div class="casas-grid" id="casas-grid"></div>
        </section>

        <!-- ==========================================
             SEÇÃO: LIGA
             ========================================== -->
        <section class="section">
          <h2>Selecione a Liga</h2>
          <div class="button-group" id="ligas-container">
            <p class="placeholder-msg">Selecione uma casa de apostas primeiro.</p>
          </div>
        </section>

        <!-- ==========================================
             SEÇÃO: MINUTOS
             ========================================== -->
        <section class="section">
          <h2>Selecione os Minutos</h2>
          <div id="minutos"></div>
        </section>

        <!-- ==========================================
             SEÇÃO: MERCADO
             ========================================== -->
        <section class="section">
          <h2>Selecione o Mercado Principal</h2>
          <div class="button-group" id="mercado-container">
            <label><input type="radio" name="mercado" value="Ambas Marcam" /> Ambas Marcam</label>
            <label><input type="radio" name="mercado" value="Ambas Não" /> Ambas Não</label>
            <label><input type="radio" name="mercado" value="Casa Vence" /> Casa Vence</label>
            <label><input type="radio" name="mercado" value="Fora Vence" /> Fora Vence</label>
            <label><input type="radio" name="mercado" value="Over 1.5" /> Over 1.5</label>
            <label><input type="radio" name="mercado" value="Over 2.5" /> Over 2.5</label>
            <label><input type="radio" name="mercado" value="Over 3.5" /> Over 3.5</label>
            <label><input type="radio" name="mercado" value="Over 5+" /> Over 5+</label>
            <label><input type="radio" name="mercado" value="5+ Time" /> 5+ Time</label>
            <label><input type="radio" name="mercado" value="Under 1.5" /> Under 1.5</label>
            <label><input type="radio" name="mercado" value="Under 2.5" /> Under 2.5</label>
            <label><input type="radio" name="mercado" value="Under 3.5" /> Under 3.5</label>
            <label><input type="radio" name="mercado" value="Empate" /> Empate</label>
            <label><input type="radio" name="mercado" value="Empate HT" /> Empate HT</label>
          </div>
        </section>

        <!-- ==========================================
             SEÇÃO: MOEDAS
             ========================================== -->
        <section class="section">
          <h2>Selecione as Moedas</h2>
          <div class="moedas">
            <label class="moeda"><input type="checkbox" name="moeda" value="Ambas Sim" />Ambas Sim</label>
            <label class="moeda"><input type="checkbox" name="moeda" value="Ambas Não" />Ambas Não</label>
            <label class="moeda"><input type="checkbox" name="moeda" value="Under 1.5" />Under 1.5</label>
            <label class="moeda"><input type="checkbox" name="moeda" value="Over 2.5" />Over 2.5</label>
            <label class="moeda"><input type="checkbox" name="moeda" value="Over 3.5" />Over 3.5</label>
            <label class="moeda"><input type="checkbox" name="moeda" value="Over 5+" />Over 5+</label>
            <label class="moeda"><input type="checkbox" name="moeda" value="5+ Time" />5+ Time</label>
            <label class="moeda"><input type="checkbox" name="moeda" value="Viradinha" />Viradinha</label>
            <label class="moeda"><input type="checkbox" name="moeda" value="1x1" />1x1</label>
            <label class="moeda"><input type="checkbox" name="moeda" value="1x2" />1x2</label>
            <label class="moeda"><input type="checkbox" name="moeda" value="2x1" />2x1</label>
            <label class="moeda"><input type="checkbox" name="moeda" value="2x2" />2x2</label>
          </div>
        </section>

        <!-- ==========================================
             SEÇÃO: TIP FORMATADA
             ========================================== -->
        <section class="section">
          <h2>Tip Formatada</h2>
          <div id="output"></div>
          <div class="action-buttons">
            <button class="btn-primary" onclick="carregarTexto(event)">Carregar Texto</button>
            <button class="btn-secondary" onclick="copiarTexto(event)">Copiar</button>
          </div>
        </section>

        <!-- ==========================================
             SEÇÃO: MOEDAS GREEN
             ========================================== -->
        <section class="section">
          <h2>Selecione Moedas Green</h2>
          <div class="moedas-container">
            <label><input type="checkbox" value="Ambas Sim" /> Ambas Sim</label>
            <label><input type="checkbox" value="Ambas Não" /> Ambas Não</label>
            <label><input type="checkbox" value="Under 1.5" /> Under 1.5</label>
            <label><input type="checkbox" value="Over 2.5" /> Over 2.5</label>
            <label><input type="checkbox" value="Over 3.5" /> Over 3.5</label>
            <label><input type="checkbox" value="Over 5+" /> Over 5+</label>
            <label><input type="checkbox" value="5+ Time" /> 5+ Time</label>
            <label><input type="checkbox" value="Viradinha" /> Viradinha</label>
            <label><input type="checkbox" value="1x1" /> 1x1</label>
            <label><input type="checkbox" value="1x2" /> 1x2</label>
            <label><input type="checkbox" value="2x1" /> 2x1</label>
            <label><input type="checkbox" value="2x2" /> 2x2</label>
          </div>
        </section>

        <!-- ==========================================
             SEÇÃO: RESULTADO GREEN + TEXTO PERSONALIZADO
             ========================================== -->
        <section class="section">
          <div class="dual-section">
            <div class="green-result-section">
              <h3>Resultado Green</h3>
              <div class="side-by-side-group">
                <div class="form-group-inline">
                  <label for="minuto-green">Minuto Green:</label>
                  <input type="text" id="minuto-green" placeholder="Ex: 48" />
                </div>
                <div class="form-group-inline">
                  <label for="quantidade-greens">Greens Seguidos:</label>
                  <input type="number" id="quantidade-greens" min="0" value="0" />
                </div>
              </div>
            </div>
            <div class="custom-text-section">
              <h3>Texto Personalizado</h3>
              <div class="form-group">
                <input type="text" id="texto-personalizado" placeholder="Digite seu texto aqui" />
                <button class="btn-primary" onclick="salvarTexto(event)">Salvar Texto</button>
              </div>
            </div>
          </div>
        </section>

        <!-- ==========================================
             SEÇÃO: AÇÕES
             ========================================== -->
        <section class="section">
          <h2>Ações</h2>
          <div class="action-buttons">
            <button class="btn-success" onclick="adicionarGreen()">Green</button>
            <button class="btn-danger" onclick="adicionarRed()">Red</button>
            <button class="btn-secondary" onclick="copiarTexto(event)">Copiar</button>
            <button class="btn-secondary" onclick="limpar()">Limpar</button>
          </div>
        </section>

      </div>
    </main>

    <script src="catalogo-ferramentas.js"></script>
    <script>
      // ============================================================
      //  DADOS: CASAS, LIGAS E MINUTOS
      //  Vêm do catalogo-ferramentas.js (Catalogo). Aqui ficam só os
      //  cabeçalhos (emoji + título) das mensagens de cada casa.
      // ============================================================
      const CABECALHOS = {
        "1WIN":       "🎯🎯FUTEBOL VIRTUAL 1WIN🎯🎯",
        "BETGREEN":   "💚💚FUTEBOL VIRTUAL BETGREEN💚💚",
        "KIRON":      "🏆🏆FUTEBOL VIRTUAL KIRON🏆🏆",
        "VAVADA":     "🔥🔥FUTEBOL VIRTUAL VAVADA🔥🔥",
        "STRIVO":     "⚡⚡FUTEBOL VIRTUAL STRIVOBET⚡⚡",
        "__ESTRELA":  "⭐⭐FUTEBOL VIRTUAL ESTRELABET⭐⭐"
      };

      // Estrela está agrupada na casa KIRON do catálogo (rota "estrela/..."),
      // mas a mensagem dela continua saindo com o cabeçalho da Estrelabet.
      function cabecalhoDe(liga) {
        if (liga.rota.startsWith("estrela/")) return CABECALHOS["__ESTRELA"];
        const casa = Catalogo.CASAS[liga.casa];
        return CABECALHOS[liga.casa] || `⚽⚽FUTEBOL VIRTUAL ${(casa ? casa.label : liga.casa).toUpperCase()}⚽⚽`;
      }

      // Nome da liga na mensagem (tira o prefixo "Estrela · " usado nos seletores)
      function nomeLigaMsg(liga) {
        return liga.label.replace(/^Estrela\s·\s/, "");
      }

      // Minutos do ciclo da liga, no formato "01", "04", ...
      function minutosDaLiga(liga) {
        return liga.minutos.map(m => String(m).padStart(2, "0"));
      }

      function ligaAtualObj() { return Catalogo.getLiga(ligaSelecionada); }

      // ============================================================
      //  ESTADO
      // ============================================================
      let casaSelecionada    = "";
      let ligaSelecionada    = "";
      let minutosSelecionados = [];
      let mercadoSelecionado  = "";
      let moedasSelecionadas  = [];
      let textoPersonalizado  = "";

      // ============================================================
      //  SELEÇÃO DE CASA
      // ============================================================
      function selecionarCasa(casa) {
        casaSelecionada = casa;

        // Destaca o botão selecionado
        document.querySelectorAll('.casa-btn').forEach(btn => btn.classList.remove('is-selected'));
        document.querySelector(`.casa-btn[data-casa="${casa}"]`)?.classList.add('is-selected');

        // Reseta liga e minutos
        ligaSelecionada = "";
        minutosSelecionados = [];

        renderizarLigas();
        document.getElementById("minutos").innerHTML = "";
        gerarTexto();
      }

      // ============================================================
      //  RENDERIZA LIGAS DA CASA SELECIONADA
      // ============================================================
      function renderizarLigas() {
        const container = document.getElementById("ligas-container");
        container.innerHTML = "";

        if (!casaSelecionada) {
          container.innerHTML = '<p class="placeholder-msg">Selecione uma casa de apostas primeiro.</p>';
          return;
        }

        Catalogo.ligasDaCasa(casaSelecionada).forEach(liga => {
          const label = document.createElement('label');
          label.dataset.liga = liga.id;
          label.textContent = liga.label;
          label.onclick = () => selecionarLiga(liga.id, label);
          container.appendChild(label);
        });
      }

      // ============================================================
      //  SELEÇÃO DE LIGA
      // ============================================================
      function selecionarLiga(liga, labelEl) {
        ligaSelecionada = liga;

        // Destaca o botão selecionado
        document.querySelectorAll('#ligas-container label').forEach(l => l.classList.remove('is-selected'));
        labelEl.classList.add('is-selected');

        minutosSelecionados = [];
        renderizarMinutos();
        gerarTexto();
      }

      // ============================================================
      //  RENDERIZA MINUTOS DA LIGA SELECIONADA
      // ============================================================
      function renderizarMinutos() {
        const minutosDiv = document.getElementById("minutos");
        minutosDiv.innerHTML = "";

        if (!casaSelecionada || !ligaSelecionada) return;

        const minutosLiga = minutosDaLiga(ligaAtualObj());

        minutosLiga.forEach(minuto => {
          minutosDiv.innerHTML += `<label><input type="checkbox" name="minuto" value="${minuto}" onchange="toggleMinuto(this, '${minuto}')"> ${minuto}</label>`;
        });
      }

      // ============================================================
      //  TOGGLE MINUTO
      // ============================================================
      function toggleMinuto(element, minuto) {
        element.parentElement.classList.toggle('is-selected');
        const index = minutosSelecionados.indexOf(minuto);
        if (index === -1) {
          minutosSelecionados.push(minuto);
        } else {
          minutosSelecionados.splice(index, 1);
        }
        gerarTexto();
      }

      // ============================================================
      //  MERCADO — listeners
      // ============================================================
      document.getElementById('mercado-container').addEventListener('change', (e) => {
        if (e.target.name === 'mercado') {
          document.querySelectorAll('input[name="mercado"]').forEach(r => {
            r.parentElement.classList.remove('is-selected');
          });
          e.target.parentElement.classList.add('is-selected');
          mercadoSelecionado = e.target.value;
          gerarTexto();
        }
      });

      // ============================================================
      //  MOEDAS — listeners
      // ============================================================
      document.querySelectorAll('input[name="moeda"]').forEach(checkbox => {
        checkbox.addEventListener("change", (event) => {
          const label = event.target.closest('label');
          const value = checkbox.value;
          const index = moedasSelecionadas.indexOf(value);

          if (checkbox.checked) {
            if (index === -1) moedasSelecionadas.push(value);
            label.classList.add('checked');
          } else {
            if (index !== -1) moedasSelecionadas.splice(index, 1);
            label.classList.remove('checked');
          }
          gerarTexto();
        });
      });

      // ============================================================
      //  FORMATAR MOEDAS
      // ============================================================
      function formatarMoedas(isGreen = false) {
        if (moedasSelecionadas.length === 0) return "";

        let moedasTexto = "💰Moedas:\n";
        const linhas = moedasSelecionadas.map(moeda => {
          if (isGreen) {
            const isChecked = document.querySelector(`.moedas-container input[value="${moeda}"]`)?.checked || false;
            return isChecked ? `${moeda}✅` : moeda;
          }
          return moeda;
        });

        return moedasTexto + linhas.join("\n");
      }

      // ============================================================
      //  FORMATAR HORÁRIOS
      // ============================================================
      function formatarHorarios(minutoGreen = null) {
        const now = new Date();
        let horaAtual = now.getHours();
        let minutoAnterior = -1;

        if (minutosSelecionados.length === 0) return "";

        const horariosString = minutosSelecionados.map(minutoAtual => {
          if (parseInt(minutoAtual) < minutoAnterior) {
            horaAtual++;
            if (horaAtual === 24) horaAtual = 0;
          }
          minutoAnterior = parseInt(minutoAtual);
          const horaFormatada = horaAtual.toString().padStart(2, '0');

          let linha = `▸ ${horaFormatada}:${minutoAtual}`;
          if (minutoGreen && minutoAtual === minutoGreen) linha += '✅';
          return linha;
        }).join("\n");

        return `⏰ Horários\n${horariosString}`;
      }

      // ============================================================
      //  GERAR TEXTO (pré-visualização)
      // ============================================================
      function gerarTexto() {
        textoPersonalizado = document.getElementById("texto-personalizado").value;

        if (!casaSelecionada || !ligaSelecionada || minutosSelecionados.length === 0 || !mercadoSelecionado) {
          document.getElementById("output").innerText = "Por favor, selecione uma casa, liga, minutos e mercado principal.";
          return;
        }

        const header = cabecalhoDe(ligaAtualObj());
        const horariosFormatados = formatarHorarios();
        const moedasFormatadas   = formatarMoedas(false);

        let texto  = `${header}\n\n`;
        texto     += `🏆 Liga: ${nomeLigaMsg(ligaAtualObj())}\n`;
        texto     += `📣 Entrada: ${mercadoSelecionado}\n\n`;
        texto     += `${horariosFormatados}\n\n`;

        if (moedasFormatadas)   texto += `${moedasFormatadas}\n\n`;
        if (textoPersonalizado) texto += `${textoPersonalizado}\n\n`;

        texto += `⚡️DataVirtual`;

        document.getElementById("output").innerText = texto;
      }

      // ============================================================
      //  GREEN
      // ============================================================
      function adicionarGreen() {
        const minutoGreenInput = document.getElementById("minuto-green").value.trim();
        const minutoGreen      = minutoGreenInput.padStart(2, '0');
        const quantidadeGreens = document.getElementById("quantidade-greens").value.trim();
        textoPersonalizado     = document.getElementById("texto-personalizado").value;

        if (!casaSelecionada || !ligaSelecionada || !mercadoSelecionado || minutosSelecionados.length === 0 || !minutoGreenInput) {
          alert("Para gerar um GREEN, selecione a Casa, Liga, Mercado, Minutos e digite o Minuto Green.");
          return;
        }

        if (!minutosDaLiga(ligaAtualObj()).includes(minutoGreen)) {
          alert(`O minuto ${minutoGreen} não pertence ao ciclo da liga ${nomeLigaMsg(ligaAtualObj())}. Use um dos minutos listados em "Selecione os Minutos".`);
          return;
        }

        const header           = cabecalhoDe(ligaAtualObj());
        const horariosFormatados = formatarHorarios(minutoGreen);
        const moedasFormatadas   = formatarMoedas(true);

        let texto  = `${header}\n\n`;
        texto     += `🏆 Liga: ${nomeLigaMsg(ligaAtualObj())}\n`;
        texto     += `📣 Entrada: ${mercadoSelecionado}🎉\n\n`;
        texto     += `${horariosFormatados}\n\n`;

        if (moedasFormatadas)   texto += `${moedasFormatadas}\n\n`;
        if (textoPersonalizado) texto += `${textoPersonalizado}\n\n`;

        texto += `GREEN 💰💰💰😎😜🤑\n`;
        texto += `${"✅".repeat(9)}\n`;
        texto += `${"✅".repeat(9)}\n\n`;

        if (quantidadeGreens && !isNaN(quantidadeGreens) && quantidadeGreens > 0) {
          texto += `${quantidadeGreens} Greens Seguidos! 🚀\n\n`;
        }

        texto += `⚡️DataVirtual`;

        document.getElementById("output").innerText = texto;
      }

      // ============================================================
      //  RED
      // ============================================================
      function adicionarRed() {
        textoPersonalizado = document.getElementById("texto-personalizado").value;

        if (!casaSelecionada || !ligaSelecionada || !mercadoSelecionado) {
          alert("Para gerar um RED, selecione a Casa, Liga e o Mercado.");
          return;
        }

        const header = cabecalhoDe(ligaAtualObj());

        let texto  = `${header}\n\n`;
        texto     += `🏆 Liga: ${nomeLigaMsg(ligaAtualObj())}\n`;
        texto     += `📣 Entrada: ${mercadoSelecionado}\n\n`;
        texto     += `${"✖️".repeat(9)}\n\n`;

        if (textoPersonalizado) texto += `${textoPersonalizado}\n\n`;

        texto += `⚡️DataVirtual`;

        document.getElementById("output").innerText = texto;
      }

      // ============================================================
      //  COPIAR
      // ============================================================
      async function copiarTexto(event) {
        const output = document.getElementById("output");
        try {
          await navigator.clipboard.writeText(output.innerText);
          const button = event.target;
          const originalText = button.textContent;
          button.textContent = 'Copiado!';
          button.classList.add('is-done');
          setTimeout(() => { button.textContent = originalText; button.classList.remove('is-done'); }, 2000);
        } catch (err) {
          alert('Erro ao copiar texto. Tente novamente.');
        }
      }

      // ============================================================
      //  SALVAR / CARREGAR TEXTO
      // ============================================================
      function salvarTexto(event) {
        const textoInput = document.getElementById("texto-personalizado").value;
        localStorage.setItem("textoPersonalizado", textoInput);
        const button = event.target;
        const originalText = button.textContent;
        button.textContent = 'Salvo!';
        button.classList.add('is-done');
        setTimeout(() => { button.textContent = originalText; button.classList.remove('is-done'); }, 2000);
      }

      function carregarTexto(event) {
        const textoSalvo = localStorage.getItem("textoPersonalizado");
        if (textoSalvo) {
          document.getElementById("texto-personalizado").value = textoSalvo;
          textoPersonalizado = textoSalvo;
          gerarTexto();
          const button = event.target;
          const originalText = button.textContent;
          button.textContent = 'Carregado!';
          button.classList.add('is-done');
          setTimeout(() => { button.textContent = originalText; button.classList.remove('is-done'); }, 2000);
        } else {
          alert('Nenhum texto salvo encontrado.');
        }
      }

      // ============================================================
      //  LIMPAR
      // ============================================================
      function limpar() {
        // Casa
        casaSelecionada    = "";
        ligaSelecionada    = "";
        minutosSelecionados = [];
        mercadoSelecionado  = "";
        moedasSelecionadas  = [];
        textoPersonalizado  = "";

        document.querySelectorAll('.casa-btn').forEach(btn => btn.classList.remove('is-selected'));
        document.getElementById("ligas-container").innerHTML = '<p class="placeholder-msg">Selecione uma casa de apostas primeiro.</p>';
        document.getElementById("minutos").innerHTML = "";

        document.querySelectorAll('input[type="radio"], input[type="checkbox"]').forEach(input => {
          input.checked = false;
          if (input.parentElement) input.parentElement.classList.remove('is-selected');
        });

        document.querySelectorAll('.moeda.checked').forEach(label => label.classList.remove('checked'));

        document.getElementById("output").innerText = "";
        document.getElementById("minuto-green").value = "";
        document.getElementById("texto-personalizado").value = "";
        document.getElementById("quantidade-greens").value = 0;
      }

      // ============================================================
      //  INIT
      // ============================================================
      function renderizarCasas() {
        const grid = document.getElementById("casas-grid");
        grid.innerHTML = Catalogo.casasAtivas().map(c =>
          `<div class="casa-btn" data-casa="${c.key}" onclick="selecionarCasa('${c.key}')"><span>${c.label}</span></div>`
        ).join("");
      }

      window.onload = () => {
        renderizarCasas();
        const savedText = localStorage.getItem("textoPersonalizado");
        if (savedText) {
          document.getElementById("texto-personalizado").value = savedText;
          textoPersonalizado = savedText;
        }
      };
    </script>

    <script>
      // Procura o header.html na pasta atual, na pasta acima e na raiz do site.
      // Só injeta se o arquivo existir (evita colar a página 404 do GitHub Pages).
      (async () => {
        const el = document.getElementById('header');
        for (const url of ['header.html', '../header.html', '/header.html']) {
          try {
            const r = await fetch(url);
            if (!r.ok) continue;
            const d = await r.text();
            if (/File not found/i.test(d)) continue;
            el.innerHTML = d;
            return;
          } catch (e) {}
        }
        console.warn('header.html não encontrado');
      })();
    </script>
  </body>
</html>
