    <script>
      let cachedData = {};
      let allProjectionsData = {};

      // ────────────────────────────────────────────────────────
      // CONFIG CASAS / LIGAS
      // ────────────────────────────────────────────────────────
      const BASE = 'https://betstat.site';

      const CASAS = {

            { label: 'Ligas dos Campeões', res: 'estrela/Ligas%20dos%20Campe%C3%B5es' },
            { label: 'América Latina',     res: 'estrela/Am%C3%A9rica%20Latina' },
          ],

      };

      function initCasaSelect() {
        const sel = document.getElementById('casaSelect');
        sel.innerHTML = Object.entries(CASAS).map(([key, casa]) =>
          `<option value="${key}">${casa.label}</option>`
        ).join('');
      }

      function populateLeagueSelect() {
        const casa = document.getElementById('casaSelect').value;
        const sel = document.getElementById('leagueSelect');
        sel.innerHTML =
          '<option value="">Selecione uma liga...</option>' +
          '<option value="all">Todas as Ligas</option>' +
          CASAS[casa].ligas.map(l => `<option value="${l.res}">${l.label}</option>`).join('');
      }

      function onCasaChange() {
        populateLeagueSelect();
      }

      // ────────────────────────────────────────────────────────
      // UTILIDADES
      // ────────────────────────────────────────────────────────

      function extractGoalsFromScore(scoreString) {
        if (!scoreString || typeof scoreString !== 'string') return [0, 0];
        const scoreParts = scoreString.split('x').map(part => part.trim());
        if (scoreParts.length === 2) {
          const team1Goals = parseInt(scoreParts[0], 10) || 0;
          const team2Goals = parseInt(scoreParts[1], 10) || 0;
          return [team1Goals, team2Goals];
        }
        return [0, 0];
      }

      function checkMarketGreen(g1, g2, market, placarht) {
        return (
          (market === "over2.5" && (g1 + g2) > 2) ||
          (market === "over1.5" && (g1 + g2) > 1) ||
          (market === "over3.5" && (g1 + g2) > 3) ||
          (market === "ambas" && g1 > 0 && g2 > 0) ||
          (market === "ambasnao" && (g1 === 0 || g2 === 0)) ||
          (market === "under15" && (g1 + g2) < 2) ||
          (market === "under25" && (g1 + g2) < 3) ||
          (market === "zerog" && (g1 + g2) === 0) ||
          (market === "umg" && (g1 + g2) === 1) ||
          (market === "doisg" && (g1 + g2) === 2) ||
          (market === "tresg" && (g1 + g2) === 3) ||
          (market === "quatrog" && (g1 + g2) === 4) ||
          (market === "cincog" && (g1 + g2) >= 5) ||
          (market === "casa" && g1 > g2) ||
          (market === "fora" && g1 < g2) ||
          (market === "empate" && g1 === g2)
        );
      }

      function calculateAdvancedStats(games, market) {
        const stats = {
          totalGames: games.length,
          greens: 0,
          reds: 0,
          avgGoals: 0,
          hitRate: 0,
          consistency: 0,
          trend: 'stable'
        };

        let totalGoals = 0;
        let results = [];
        
        games.forEach(game => {
          const [g1, g2] = extractGoalsFromScore(game.ft);
          totalGoals += (g1 + g2);
          const isGreen = checkMarketGreen(g1, g2, market, game.ht);
          results.push(isGreen ? 1 : 0);
          if (isGreen) stats.greens++; else stats.reds++;
        });

        stats.avgGoals = games.length > 0 ? (totalGoals / games.length).toFixed(1) : 0;
        stats.hitRate = games.length > 0 ? Math.round((stats.greens / games.length) * 100) : 0;
        
        const recent5 = results.slice(-5);
        const recentHitRate = recent5.length > 0 ? (recent5.filter(r => r === 1).length / recent5.length) * 100 : 0;
        
        if (recentHitRate > stats.hitRate + 10) stats.trend = 'up';
        else if (recentHitRate < stats.hitRate - 10) stats.trend = 'down';
        
        if (results.length > 1) {
          const mean = results.reduce((a, b) => a + b, 0) / results.length;
          const variance = results.reduce((sum, val) => sum + Math.pow(val - mean, 2), 0) / results.length;
          stats.consistency = Math.round((1 - Math.sqrt(variance)) * 100);
        }
        
        return stats;
      }

      function calculateSignalStrength(galePercents, market, advancedStats) {
        const weights = [0.4, 0.3, 0.2];
        let weightedSum = 0;
        let totalWeight = 0;
        
        for (let i = 0; i < galePercents.length && i < weights.length; i++) {
          weightedSum += galePercents[i] * weights[i];
          totalWeight += weights[i];
        }
        
        let forcaBase = totalWeight > 0 ? weightedSum / totalWeight : 0;
        
        if (advancedStats.consistency > 80) forcaBase *= 1.10;
        if (advancedStats.trend === 'up') forcaBase *= 1.05;
        if (advancedStats.trend === 'down') forcaBase *= 0.95;
        if ((market.includes('over') || market === 'ambas') && advancedStats.avgGoals > 2.5) forcaBase *= 1.05;
        
        return Math.min(Math.round(forcaBase), 100);
      }

      function getSignalEmoji(percent) {
        if (percent >= 85) return '🟢';
        if (percent >= 40) return '🟡';
        return '🟠';
      }

      function getSignalStrength(percent) {
        if (percent >= 85) return 'Excelente';
        if (percent >= 40) return 'Bom';
        return 'Regular';
      }

      function getTrendEmoji(trend) {
        if (trend === 'up') return '📈';
        if (trend === 'down') return '📉';
        return '';
      }

      // ────────────────────────────────────────────────────────
      // ANÁLISE
      // ────────────────────────────────────────────────────────

      function analyzeProjections(data, market, range, league, selectedHour) {
        const gamesByHour = {};
        const gamesByMinute = {};
        
        data.forEach(game => {
          const hora = String(game.hora).padStart(2, '0');
          const minuto = String(game.minuto).padStart(2, '0');
          if (selectedHour && hora !== selectedHour) return;
          if (!gamesByHour[hora]) gamesByHour[hora] = [];
          if (!gamesByMinute[minuto]) gamesByMinute[minuto] = [];
          
          gamesByHour[hora].push({ time: `${hora}:${minuto}`, ft: game.ft, ht: game.ht });
          gamesByMinute[minuto].push({ ft: game.ft, ht: game.ht });
        });

        const results = {};
        const galeHits = {};
        const totals = {};

        Object.keys(gamesByHour).forEach(hour => {
          gamesByHour[hour].sort((a, b) => a.time.localeCompare(b.time));

          gamesByHour[hour].forEach(g => {
            const min = g.time.split(':')[1];
            if (!galeHits[min]) galeHits[min] = Array(range).fill(0);
            if (!totals[min]) totals[min] = 0;
          });

          gamesByHour[hour].forEach((game, index) => {
            const minuto = game.time.split(':')[1];
            totals[minuto]++;

            let greenFound = false;
            for (let i = 0; i < range && (index + i) < gamesByHour[hour].length; i++) {
              const check = gamesByHour[hour][index + i];
              const [g1, g2] = extractGoalsFromScore(check.ft);
              const placarht = check.ht || "";

              const isGreen = checkMarketGreen(g1, g2, market, placarht);

              if (isGreen && !greenFound) {
                galeHits[minuto][i]++;
                greenFound = true;
              }
            }
          });

          const sequences = [];
          const used = new Set();

          for (let i = 0; i < gamesByHour[hour].length; i++) {
            const min = gamesByHour[hour][i].time.split(':')[1];
            const totalHits = galeHits[min].reduce((a, b) => a + b, 0);
            if (totalHits === totals[min] && !used.has(min)) {
              const seq = [min];
              let cur = parseInt(min);
              for (let j = 1; j < range; j++) {
                cur = (cur + 3) % 60;
                seq.push(String(cur).padStart(2, '0'));
                used.add(String(cur).padStart(2, '0'));
              }
              
              const percents = galeHits[min].map(h => totals[min] ? Math.round((h / totals[min]) * 100) : 0);
              seq.galePercents = percents;
              
              const advancedStats = calculateAdvancedStats(gamesByMinute[min] || [], market);
              seq.advancedStats = advancedStats;
              
              const forcaSinal = calculateSignalStrength(percents, market, advancedStats);
              seq.forcaSinal = forcaSinal;
              
              seq.galeProbabilities = {
                sg: percents[0] || 0,
                g1: percents[1] || 0,
                g2: percents[2] || 0
              };
              
              seq.lastGames = (gamesByMinute[min] || []).slice(-5);
              
              sequences.push(seq);
              used.add(min);
            }
          }

          if (sequences.length > 0) {
            if (!results[hour]) results[hour] = {};
            results[hour][league] = sequences;
          }
        });

        return results;
      }

      // ────────────────────────────────────────────────────────
      // FETCH E PROCESSAMENTO
      // ────────────────────────────────────────────────────────

      function showLoading(show) {
        document.getElementById("loading").style.display = show ? "block" : "none";
      }

      function fetchApiData(res, label) {
        showLoading(true);
        const apiUrl = `${BASE}/resultados/${res}`;
        fetch(apiUrl)
          .then(response => {
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            return response.json();
          })
          .then(data => {
            cachedData[res] = data;
            processApiData(data, label);
            showLoading(false);
          })
          .catch(error => {
            console.error("Erro:", error);
            showLoading(false);
            alert("Erro ao buscar dados da API.");
          });
      }

      function fetchAllLeagues(casa) {
        const ligas = CASAS[casa].ligas;
        showLoading(true);
        Promise.all(ligas.map(liga =>
          cachedData[liga.res] ? Promise.resolve(cachedData[liga.res]) :
          fetch(`${BASE}/resultados/${liga.res}`).then(res => res.json())
        ))
        .then(results => {
          ligas.forEach((liga, index) => cachedData[liga.res] = results[index]);
          processAllLeagues(ligas);
          showLoading(false);
        })
        .catch(error => {
          console.error("Erro:", error);
          showLoading(false);
          alert("Erro ao buscar dados.");
        });
      }

      function processApiData(data, league) {
        const market = document.getElementById("marketSelect").value;
        const range = parseInt(document.getElementById("rangeSelect").value, 10);
        const selectedHour = document.getElementById("hourSelect").value;
        const gameLimit = document.getElementById("gameLimitSelect").value;
        const limitedData = gameLimit === "todos" ? data : data.slice(-parseInt(gameLimit, 10));
        const projections = analyzeProjections(limitedData, market, range, league, selectedHour);
        displayProjections(projections);
      }

      function processAllLeagues(ligas) {
        const market = document.getElementById("marketSelect").value;
        const range = parseInt(document.getElementById("rangeSelect").value, 10);
        const selectedHour = document.getElementById("hourSelect").value;
        const gameLimit = document.getElementById("gameLimitSelect").value;
        let allProjections = {};

        ligas.forEach(liga => {
          const rawData = cachedData[liga.res];
          const limitedData = gameLimit === "todos" ? rawData : rawData.slice(-parseInt(gameLimit, 10));
          const projections = analyzeProjections(limitedData, market, range, liga.label, selectedHour);
          Object.keys(projections).forEach(hour => {
            if (!allProjections[hour]) allProjections[hour] = {};
            allProjections[hour][liga.label] = projections[hour][liga.label];
          });
        });
        displayProjections(allProjections);
      }

      function generateList() {
        const casa = document.getElementById("casaSelect").value;
        const league = document.getElementById("leagueSelect").value;
        if (!casa || !league) {
          alert("Selecione uma casa e uma liga!");
          return;
        }
        if (league === "all") {
          fetchAllLeagues(casa);
        } else {
          const liga = CASAS[casa].ligas.find(l => l.res === league);
          const label = liga ? liga.label : league;
          if (cachedData[league]) {
            processApiData(cachedData[league], label);
          } else {
            fetchApiData(league, label);
          }
        }
      }

      // ────────────────────────────────────────────────────────
      // RENDERIZAÇÃO
      // ────────────────────────────────────────────────────────

      function renderTopSignals(signals) {
        const container = document.getElementById('topSignalsContainer');
        container.innerHTML = '';
        
        if (signals.length === 0) return;

        const topSection = document.createElement('div');
        topSection.style.marginBottom = '20px';
        topSection.innerHTML = '<div class="section-title" style="margin-bottom: 12px;">⭐ Top 3 Sinais</div>';

        const cardsDiv = document.createElement('div');
        cardsDiv.className = 'top-signals';

        signals.forEach((signal, index) => {
          const card = document.createElement('div');
          card.className = 'signal-card';
          const minutes = signal.sequence.slice(0, 3).join(' ');
          card.innerHTML = `
            <div class="signal-card-rank">#${index + 1}</div>
            <div class="signal-card-content">
              ${signal.league} - Hora ${String(signal.hour).padStart(2, '0')}<br>
              Minutos: ${minutes}
            </div>
            <div class="signal-card-strength">
              ${getSignalEmoji(signal.force)} ${signal.force}% • ${getSignalStrength(signal.force)}
            </div>
          `;
          cardsDiv.appendChild(card);
        });

        topSection.appendChild(cardsDiv);
        container.appendChild(topSection);
      }

      function renderProjections(projections) {
        const container = document.getElementById('projectionsContainer');
        container.innerHTML = '';

        if (Object.keys(projections).length === 0) {
          container.innerHTML = '<div class="no-results">Nenhuma projeção encontrada.</div>';
          return;
        }

        Object.keys(projections).sort((a, b) => a - b).forEach(hour => {
          const hourBlock = document.createElement('div');
          hourBlock.className = 'hour-block';

          const hourTitle = document.createElement('h3');
          hourTitle.textContent = `Hora ${String(hour).padStart(2, '00')}`;
          hourBlock.appendChild(hourTitle);

          Object.keys(projections[hour]).forEach(league => {
            projections[hour][league].forEach((sequence, idx) => {
              const mainLine = document.createElement('div');
              mainLine.className = 'projection-item';
              mainLine.onclick = (e) => toggleDetails(e.currentTarget.nextElementSibling);

              const range = document.getElementById('rangeSelect').value;
              const minutesText = sequence.slice(0, range).join(' ');
              const forcaSinal = sequence.forcaSinal || 0;
              const emoji = getSignalEmoji(forcaSinal);
              const marketSelect = document.getElementById('marketSelect');
              const marketText = marketSelect.options[marketSelect.selectedIndex].text;

              mainLine.innerHTML = `
                <div class="projection-main-text">
                  <span class="projection-league">${emoji} ${league}</span>
                  <span class="projection-minutes">⏰ ${minutesText}</span>
                  <span class="projection-market">→ ${marketText}</span>
                </div>
                <div class="projection-stats">
                  <div class="projection-stat">
                    <div class="progress-bar"><div class="progress-fill" style="width: ${forcaSinal}%"></div></div>
                  </div>
                  <div class="projection-stat">${forcaSinal}% • ${getSignalStrength(forcaSinal)}</div>
                </div>
              `;

              const detailsLine = document.createElement('div');
              detailsLine.className = 'details-section';

              const advStats = sequence.advancedStats || {};
              const probs = sequence.galeProbabilities || {};
              const trend = getTrendEmoji(advStats.trend);

              let galeProbs = '';
              if (range >= 1) galeProbs += `SG: ${probs.sg}%`;
              if (range >= 2) galeProbs += ` | G1: ${probs.g1}%`;
              if (range >= 3) galeProbs += ` | G2: ${probs.g2}%`;

              detailsLine.innerHTML = `
                <div class="details-stat-row">
                  <span>📊 Taxa de acerto:</span>
                  <span>${advStats.hitRate || 0}% (${advStats.greens || 0}✅ / ${advStats.reds || 0}❌)</span>
                </div>
                <div class="details-stat-row">
                  <span>⚽ Média de gols:</span>
                  <span>${advStats.avgGoals || 0} gols/jogo</span>
                </div>
                <div class="details-stat-row">
                  <span>🎯 Consistência:</span>
                  <span>${advStats.consistency || 0}% ${trend}</span>
                </div>
                ${galeProbs ? `<div class="details-stat-row"><span>🔄 Prob. Gales:</span><span>${galeProbs}</span></div>` : ''}
                ${sequence.lastGames && sequence.lastGames.length > 0 ? `
                <div class="last-games">
                  <strong>📜 Últimos 5 jogos</strong>
                  <div class="last-games-list">
                    ${sequence.lastGames.map(g => {
                      const [g1, g2] = extractGoalsFromScore(g.ft);
                      const market = document.getElementById("marketSelect").value;
                      const isGreen = checkMarketGreen(g1, g2, market, g.ht);
                      return `<span class="game-result ${isGreen ? 'green' : 'red'}">${g.ft} ${isGreen ? '✅' : '❌'}</span>`;
                    }).join('')}
                  </div>
                </div>
                ` : ''}
              `;

              hourBlock.appendChild(mainLine);
              hourBlock.appendChild(detailsLine);
            });
          });

          container.appendChild(hourBlock);
        });
      }

      function displayProjections(projections) {
        allProjectionsData = projections;
        
        const topSignals = [];
        Object.keys(projections).forEach(hour => {
          Object.keys(projections[hour]).forEach(league => {
            projections[hour][league].forEach(seq => {
              topSignals.push({
                hour,
                league,
                sequence: seq,
                force: seq.forcaSinal
              });
            });
          });
        });
        topSignals.sort((a, b) => b.force - a.force);
        
        renderTopSignals(topSignals.slice(0, 3));
        renderProjections(projections);
      }

      function toggleDetails(element) {
        if (element && element.className === 'details-section') {
          element.classList.toggle('open');
        }
      }

      function applyFilters() {
        const filterGood = document.getElementById('filterGoodSignals')?.checked || false;
        let filtered = allProjectionsData;
        
        if (filterGood) {
          filtered = {};
          Object.keys(allProjectionsData).forEach(hour => {
            Object.keys(allProjectionsData[hour]).forEach(league => {
              const sequences = allProjectionsData[hour][league].filter(seq => seq.forcaSinal >= 40);
              if (sequences.length > 0) {
                if (!filtered[hour]) filtered[hour] = {};
                filtered[hour][league] = sequences;
              }
            });
          });
        }
        
        renderProjections(filtered);
      }

      function copyResults() {
        let text = "=== PROJEÇÕES DE SINAIS ===\n\n";
        Object.keys(allProjectionsData).sort((a, b) => a - b).forEach(hour => {
          text += `\nHORA: ${String(hour).padStart(2, '0')}\n`;
          text += "=".repeat(50) + "\n";
          Object.keys(allProjectionsData[hour]).forEach(league => {
            allProjectionsData[hour][league].forEach(seq => {
              const range = document.getElementById('rangeSelect').value;
              const minutes = seq.slice(0, range).join(' ');
              const probs = seq.galeProbabilities || {};
              text += `${league} - Minutos: ${minutes}\n`;
              text += `Força: ${seq.forcaSinal}% | SG: ${probs.sg}% | G1: ${probs.g1}% | G2: ${probs.g2}%\n\n`;
            });
          });
        });
        navigator.clipboard.writeText(text).then(() => {
          alert('✅ Copiado!');
        }).catch(() => {
          alert('❌ Erro ao copiar');
        });
      }

      document.addEventListener('DOMContentLoaded', () => {
        const headerEl = document.getElementById('header');
        if (typeof loadHeaderContent === 'function') {
          loadHeaderContent(headerEl);
        }
        initCasaSelect();
        populateLeagueSelect();
      });
    </script>

    <script src="app.utils.min.js"></script>
    <script src="header-loader.js"></script>
    <script src="redirecionar.js"></script>
  </body>
