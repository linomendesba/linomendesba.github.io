    <style>
      :root {
        --bg-primary: #111318;
        --bg-secondary: #181c23;
        --bg-card: #1e232d;
        --bg-card-hover: #242a36;
        --bg-top: #0d1c1f;
        --border: #2a3040;
        --border-accent: #1a4750;
        --accent: #177b8e;
        --accent-dim: #115c6b;
        --accent-muted: rgba(23, 123, 142, 0.14);
        --text-primary: #e4e8f0;
        --text-secondary: #7a8499;
        --text-accent: #177b8e;
        --green: #2ecc71;
        --red: #e74c3c;
        --orange: #e6a817;
        --red-bg: #1a0d0d;
        --green-bg: #0a1f16;
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        font-family: "DM Sans", sans-serif;
        background-color: var(--bg-primary);
        color: var(--text-primary);
        min-height: 100vh;
      }

      #header { position: sticky; top: 0; z-index: 100; }

      .page-wrapper {
        max-width: 1600px;
        margin: 0 auto;
        padding: 28px 24px 60px;
      }

      .section-title {
        font-size: 0.7rem;
        font-family: "DM Mono", monospace;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--text-accent);
        margin-bottom: 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      /* ── FILTROS ── */
      .filter-section {
        background: var(--bg-secondary);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 20px 24px;
        margin-bottom: 24px;
      }

      .filters-row {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 16px;
        margin-bottom: 16px;
      }

      .filter-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .filter-group label {
        font-size: 0.75rem;
        font-family: "DM Mono", monospace;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--text-secondary);
        font-weight: 500;
      }

      .filter-group select {
        background: var(--bg-card);
        border: 1px solid var(--border);
        color: var(--text-primary);
        padding: 10px 12px;
        border-radius: 6px;
        font-family: "DM Sans", sans-serif;
        font-size: 0.85rem;
        cursor: pointer;
        transition: all 0.2s;
      }

      .filter-group select:hover {
        border-color: var(--accent-dim);
      }

      .filter-group select:focus {
        outline: none;
        border-color: var(--accent);
        background: var(--bg-card-hover);
      }

      .filter-group select option {
        background: var(--bg-card);
        color: var(--text-primary);
      }

      .filters-actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      .btn-filter {
        background: var(--accent-muted);
        border: 1px solid var(--accent);
        color: var(--accent);
        font-family: "DM Sans", sans-serif;
        font-size: 0.8rem;
        font-weight: 600;
        padding: 10px 18px;
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.15s;
      }

      .btn-filter:hover {
        background: var(--accent);
        color: var(--bg-primary);
      }

      .checkbox-filter {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 0.85rem;
        color: var(--text-secondary);
      }

      .checkbox-filter input {
        cursor: pointer;
        width: 16px;
        height: 16px;
        accent-color: var(--accent);
      }

      /* ── PROJEÇÕES ── */
      .projections-section {
        margin-bottom: 24px;
      }

      .projections-header {
        background: var(--bg-secondary);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 20px 24px;
        margin-bottom: 20px;
      }

      .projections-header h2 {
        font-size: 1rem;
        font-weight: 600;
        color: var(--text-primary);
        margin-bottom: 12px;
      }

      .projections-content {
        background: var(--bg-secondary);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 20px 24px;
      }

      .top-signals {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 12px;
        margin-bottom: 24px;
      }

      .signal-card {
        background: linear-gradient(135deg, rgba(23, 123, 142, 0.15) 0%, rgba(23, 123, 142, 0.05) 100%);
        border: 1px solid var(--border-accent);
        border-radius: 8px;
        padding: 16px;
        transition: all 0.2s;
      }

      .signal-card:hover {
        border-color: var(--accent);
        background: linear-gradient(135deg, rgba(23, 123, 142, 0.25) 0%, rgba(23, 123, 142, 0.1) 100%);
      }

      .signal-card-rank {
        font-size: 0.75rem;
        font-family: "DM Mono", monospace;
        color: var(--accent);
        font-weight: 600;
        margin-bottom: 4px;
      }

      .signal-card-content {
        font-size: 0.85rem;
        line-height: 1.5;
        color: var(--text-primary);
      }

      .signal-card-strength {
        font-size: 0.75rem;
        color: var(--text-secondary);
        margin-top: 8px;
      }

      .hour-block {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 16px;
        margin-bottom: 12px;
      }

      .hour-block h3 {
        font-size: 0.85rem;
        font-family: "DM Mono", monospace;
        color: var(--accent);
        margin-bottom: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .projection-item {
        background: var(--bg-primary);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 12px;
        margin-bottom: 8px;
        cursor: pointer;
        transition: all 0.2s;
        font-size: 0.85rem;
      }

      .projection-item:hover {
        background: var(--bg-card-hover);
        border-color: var(--accent-dim);
      }

      .projection-main-text {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 6px;
      }

      .projection-league {
        color: var(--text-primary);
        font-weight: 600;
      }

      .projection-minutes {
        color: var(--text-secondary);
        font-size: 0.8rem;
      }

      .projection-market {
        color: var(--accent);
        font-size: 0.8rem;
      }

      .projection-stats {
        font-size: 0.8rem;
        color: var(--text-secondary);
        margin-top: 6px;
        padding-top: 6px;
        border-top: 1px solid var(--border);
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }

      .projection-stat {
        display: flex;
        align-items: center;
        gap: 4px;
      }

      .details-section {
        display: none;
        background: rgba(23, 123, 142, 0.1);
        border: 1px solid var(--border-accent);
        border-radius: 6px;
        padding: 12px;
        margin-top: 8px;
        font-size: 0.8rem;
        color: var(--text-secondary);
      }

      .details-section.open {
        display: block;
      }

      .details-stat-row {
        display: flex;
        justify-content: space-between;
        margin-bottom: 6px;
        gap: 12px;
      }

      .last-games {
        margin-top: 12px;
        padding-top: 12px;
        border-top: 1px solid var(--border-accent);
      }

      .last-games-list {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-top: 8px;
      }

      .game-result {
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 0.75rem;
        font-weight: 500;
      }

      .game-result.green {
        background: var(--green-bg);
        color: var(--green);
      }

      .game-result.red {
        background: var(--red-bg);
        color: var(--red);
      }

      .no-results {
        background: var(--bg-card);
        border: 1px dashed var(--border);
        border-radius: 8px;
        padding: 40px;
        text-align: center;
        color: var(--text-secondary);
        font-size: 0.9rem;
      }

      .progress-bar {
        display: inline-block;
        width: 100px;
        height: 6px;
        background: var(--border);
        border-radius: 3px;
        overflow: hidden;
      }

      .progress-fill {
        height: 100%;
        background: linear-gradient(90deg, var(--accent-dim), var(--accent));
        width: 0%;
      }

      /* Responsive */
      @media (max-width: 768px) {
        .page-wrapper {
          padding: 16px 12px 40px;
        }

        .filters-row {
          grid-template-columns: 1fr;
        }

        .top-signals {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>

  <body>
    <div id="header"></div>

    <div class="page-wrapper">
      <!-- FILTROS -->
      <section class="filter-section">
        <div class="section-title">Filtros e Configurações</div>
        
        <div class="filters-row">
          <div class="filter-group">
            <label>Casa</label>
            <select id="casaSelect">
              <option value="all">Todas as Casas</option>
              <option value="betano">Betano</option>
              <option value="bet365">Bet365</option>
              <option value="rivalo">Rivalo</option>
            </select>
          </div>

          <div class="filter-group">
            <label>Liga</label>
            <select id="ligaSelect">
              <option value="all">Todas as Ligas</option>
              <option value="Copa">Copa</option>
              <option value="Euro">Euro</option>
              <option value="Super">Super</option>
              <option value="Premier">Premier</option>
            </select>
          </div>

          <div class="filter-group">
            <label>Gales</label>
            <select id="rangeSelect" onchange="loadProjections()">
              <option value="1">1º Gale</option>
              <option value="2">2º Gale</option>
              <option value="3">3º Gale</option>
            </select>
          </div>

          <div class="filter-group">
            <label>Mercado</label>
            <select id="marketSelect" onchange="loadProjections()">
              <option value="ht_over_1_5">HT Over 1.5</option>
              <option value="ft_over_2_5">FT Over 2.5</option>
              <option value="ft_over_3_5">FT Over 3.5</option>
              <option value="ft_over_4_5">FT Over 4.5</option>
              <option value="ht_over_0_5">HT Over 0.5</option>
            </select>
          </div>
        </div>

        <div class="filters-actions">
          <button class="btn-filter" onclick="loadProjections()">Buscar Projeções</button>
          <button class="btn-filter" onclick="copyResults()">Copiar Resultados</button>
          <label class="checkbox-filter">
            <input type="checkbox" id="filterGoodSignals" onchange="applyFilters()">
            <span>Apenas sinais Bons/Ótimos</span>
          </label>
        </div>
      </section>

      <!-- PROJEÇÕES -->
      <section class="projections-section">
        <div class="projections-header">
          <div class="section-title">Análise de Projeções</div>
        </div>

        <div class="projections-content">
          <div id="topSignalsContainer"></div>
          <div id="projectionsContainer"></div>
        </div>
      </section>
    </div>

    <script>
      let allProjectionsData = {};
      const projectionsDatabase = {};

      // ────────────────────────────────────────────────────────
      // UTILIDADES
      // ────────────────────────────────────────────────────────

      function getSignalEmoji(force) {
        if (force >= 90) return '🔥';
        if (force >= 75) return '⚡';
        if (force >= 60) return '✅';
        if (force >= 45) return '⚠️';
        return '❌';
      }

      function getSignalStrength(force) {
        if (force >= 90) return 'Ótimo';
        if (force >= 75) return 'Muito Bom';
        if (force >= 60) return 'Bom';
        if (force >= 45) return 'Moderado';
        return 'Fraco';
      }

      function getSignalColor(force) {
        if (force >= 90) return '#ff6b6b';
        if (force >= 75) return '#ffd93d';
        if (force >= 60) return '#6bcf7f';
        if (force >= 45) return '#e6a817';
        return '#e74c3c';
      }

      function createProgressBar(force) {
        const percentage = Math.min(100, force);
        return `<div class="progress-bar"><div class="progress-fill" style="width: ${percentage}%"></div></div> ${force}%`;
      }

      function getTrendEmoji(trend) {
        if (trend === 'up') return '📈';
        if (trend === 'down') return '📉';
        return '➡️';
      }

      function extractGoalsFromScore(score) {
        const match = score.match(/(\d+)\s*x\s*(\d+)/);
        return match ? [parseInt(match[1]), parseInt(match[2])] : [0, 0];
      }

      function checkMarketGreen(g1, g2, market, ht) {
        const total = g1 + g2;
        const htTotal = ht ? parseInt(ht.split('x')[0]) + parseInt(ht.split('x')[1]) : 0;
        
        switch(market) {
          case 'ht_over_1_5': return htTotal > 1;
          case 'ft_over_2_5': return total > 2;
          case 'ft_over_3_5': return total > 3;
          case 'ft_over_4_5': return total > 4;
          case 'ht_over_0_5': return htTotal > 0;
          default: return false;
        }
      }

      function filterByStrength(projections, minForce) {
        const filtered = {};
        Object.keys(projections).forEach(hour => {
          filtered[hour] = {};
          Object.keys(projections[hour]).forEach(league => {
            filtered[hour][league] = projections[hour][league].filter(seq => (seq.forcaSinal || 0) >= minForce);
          });
        });
        return filtered;
      }

      function findTopSignals(projections, limit) {
        const signals = [];
        Object.keys(projections).forEach(hour => {
          Object.keys(projections[hour]).forEach(league => {
            projections[hour][league].forEach(sequence => {
              signals.push({
                hour,
                league,
                sequence: sequence.slice(0, document.getElementById("rangeSelect").value),
                force: sequence.forcaSinal || 0
              });
            });
          });
        });
        return signals.sort((a, b) => b.force - a.force).slice(0, limit);
      }

      function exportResults(projections) {
        let text = 'PROJEÇÕES EXPORTADAS\n';
        text += '='.repeat(50) + '\n\n';
        Object.keys(projections).forEach(hour => {
          Object.keys(projections[hour]).forEach(league => {
            projections[hour][league].forEach(sequence => {
              text += `${league} - Hora ${hour} - ${sequence.join(' ')} - Força: ${sequence.forcaSinal}%\n`;
            });
          });
        });
        return text;
      }

      // ────────────────────────────────────────────────────────
      // CARREGAMENTO E RENDERIZAÇÃO
      // ────────────────────────────────────────────────────────

      async function loadProjections() {
        const casa = document.getElementById('casaSelect').value;
        const liga = document.getElementById('ligaSelect').value;
        const range = document.getElementById('rangeSelect').value;
        const market = document.getElementById('marketSelect').value;

        // Simula carregamento de dados (ajuste com sua API real)
        const projections = await fetchProjectionData(casa, liga, market);
        
        if (projections && Object.keys(projections).length > 0) {
          allProjectionsData = projections;
          renderProjectionsPage(projections, range);
        } else {
          document.getElementById('projectionsContainer').innerHTML = '<div class="no-results">Nenhuma projeção encontrada para os critérios selecionados.</div>';
        }
      }

      async function fetchProjectionData(casa, liga, market) {
        // AJUSTE AQUI: Use sua URL/API real para buscar dados
        try {
          const response = await fetch(`/api/projections?casa=${casa}&liga=${liga}&market=${market}`);
          if (!response.ok) return {};
          return await response.json();
        } catch (e) {
          console.error('Erro ao carregar projeções:', e);
          return {};
        }
      }

      function renderProjectionsPage(projections, range) {
        const marketSelect = document.getElementById('marketSelect');
        const marketText = marketSelect.options[marketSelect.selectedIndex].text;
        
        // Top Signals
        const topSignals = findTopSignals(projections, 3);
        renderTopSignals(topSignals);
        
        // Projeções
        const container = document.getElementById('projectionsContainer');
        renderProjections(projections, container, range, marketText);
      }

      function renderTopSignals(signals) {
        const container = document.getElementById('topSignalsContainer');
        container.innerHTML = '';
        
        if (signals.length === 0) return;

        const topSection = document.createElement('div');
        topSection.style.marginBottom = '20px';
        topSection.innerHTML = '<div class="section-title" style="margin-bottom: 12px;">⭐ Top 3 Sinais</div>';

        const cardsDiv = document.createElement('div');
        cardsDiv.className = 'top-signals';

        signals.forEach((signal, index) => {
          const card = document.createElement('div');
          card.className = 'signal-card';
          card.innerHTML = `
            <div class="signal-card-rank">#${index + 1}</div>
            <div class="signal-card-content">
              ${signal.league} - Hora ${String(signal.hour).padStart(2, '0')}<br>
              Minutos: ${signal.sequence.join(' ')}
            </div>
            <div class="signal-card-strength">
              Força: ${signal.force}% • ${getSignalStrength(signal.force)}
            </div>
          `;
          cardsDiv.appendChild(card);
        });

        topSection.appendChild(cardsDiv);
        container.appendChild(topSection);
      }

      function renderProjections(projections, container, range, marketText) {
        container.innerHTML = '';

        Object.keys(projections).sort((a, b) => a - b).forEach(hour => {
          const hourBlock = document.createElement('div');
          hourBlock.className = 'hour-block';

          const hourTitle = document.createElement('h3');
          hourTitle.textContent = `Hora ${String(hour).padStart(2, '00')}`;
          hourBlock.appendChild(hourTitle);

          const hasProj = Object.keys(projections[hour]).some(league => projections[hour][league].length > 0);
          
          if (!hasProj) {
            const noProj = document.createElement('p');
            noProj.style.color = 'var(--text-secondary)';
            noProj.style.fontSize = '0.85rem';
            noProj.textContent = 'Nenhuma projeção para esta hora';
            hourBlock.appendChild(noProj);
            container.appendChild(hourBlock);
            return;
          }

          Object.keys(projections[hour]).forEach(league => {
            projections[hour][league].forEach((sequence, idx) => {
              const mainLine = document.createElement('div');
              mainLine.className = 'projection-item';
              mainLine.onclick = (e) => toggleDetails(e.currentTarget.nextElementSibling);

              const minutesText = sequence.slice(0, range).join(' ');
              const forcaSinal = sequence.forcaSinal || 0;
              const emoji = getSignalEmoji(forcaSinal);

              mainLine.innerHTML = `
                <div class="projection-main-text">
                  <span class="projection-league">${emoji} ${league}</span>
                  <span class="projection-minutes">⏰ ${minutesText}</span>
                  <span class="projection-market">→ ${marketText}</span>
                </div>
                <div class="projection-stats">
                  <div class="projection-stat">${createProgressBar(forcaSinal)}</div>
                  <div class="projection-stat">${getSignalStrength(forcaSinal)}</div>
                </div>
              `;

              const detailsLine = document.createElement('div');
              detailsLine.className = 'details-section';

              const galeProbabilities = sequence.galeProbabilities || {};
              const advStats = sequence.advancedStats || {};
              
              let galeTexts = [];
              if (range >= 1 && galeProbabilities.sg !== undefined) galeTexts.push(`SG: ${galeProbabilities.sg}%`);
              if (range >= 2 && galeProbabilities.g1 !== undefined) galeTexts.push(`G1: ${galeProbabilities.g1}%`);
              if (range >= 3 && galeProbabilities.g2 !== undefined) galeTexts.push(`G2: ${galeProbabilities.g2}%`);

              detailsLine.innerHTML = `
                <div class="details-stat-row">
                  <span>📊 Taxa de acerto:</span>
                  <span>${advStats.hitRate || 0}% (${advStats.greens || 0}✅ / ${advStats.reds || 0}❌)</span>
                </div>
                <div class="details-stat-row">
                  <span>⚽ Média de gols:</span>
                  <span>${advStats.avgGoals || 0} gols/jogo</span>
                </div>
                <div class="details-stat-row">
                  <span>🎯 Consistência:</span>
                  <span>${advStats.consistency || 0}%</span>
                </div>
                ${galeTexts.length > 0 ? `<div class="details-stat-row"><span>🔄 Probabilidade gales:</span><span>${galeTexts.join(' | ')}</span></div>` : ''}
                ${sequence.lastGames && sequence.lastGames.length > 0 ? `
                <div class="last-games">
                  <strong>📜 Últimos 5 jogos</strong>
                  <div class="last-games-list">
                    ${sequence.lastGames.map(g => {
                      const [g1, g2] = extractGoalsFromScore(g.ft);
                      const market = document.getElementById("marketSelect").value;
                      const isGreen = checkMarketGreen(g1, g2, market, g.ht);
                      return `<span class="game-result ${isGreen ? 'green' : 'red'}">${g.ft} ${isGreen ? '✅' : '❌'}</span>`;
                    }).join('')}
                  </div>
                </div>
                ` : ''}
              `;

              hourBlock.appendChild(mainLine);
              hourBlock.appendChild(detailsLine);
            });
          });

          container.appendChild(hourBlock);
        });
      }

      function toggleDetails(element) {
        if (element && element.className === 'details-section') {
          element.classList.toggle('open');
        }
      }

      function applyFilters() {
        const filterGood = document.getElementById('filterGoodSignals')?.checked || false;
        let filtered = allProjectionsData;
        
        if (filterGood) {
          filtered = filterByStrength(filtered, 45);
        }
        
        const container = document.getElementById('projectionsContainer');
        const marketText = document.getElementById('marketSelect').options[document.getElementById('marketSelect').selectedIndex].text;
        const range = document.getElementById('rangeSelect').value;
        
        if (container) {
          renderProjections(filtered, container, range, marketText);
        }
      }

      function copyResults() {
        const text = exportResults(allProjectionsData);
        navigator.clipboard.writeText(text).then(() => {
          alert('✅ Resultados copiados para a área de transferência!');
        }).catch(err => {
          console.error('Erro ao copiar:', err);
          alert('❌ Erro ao copiar resultados.');
        });
      }

      // ────────────────────────────────────────────────────────
      // INICIALIZAÇÃO
      // ────────────────────────────────────────────────────────

      document.addEventListener('DOMContentLoaded', () => {
        // Carrega header
        loadHeader();
        
        // Carrega dados iniciais
        loadProjections();
      });

      function loadHeader() {
        const headerEl = document.getElementById('header');
        if (typeof loadHeaderContent === 'function') {
          loadHeaderContent(headerEl);
        }
      }
    </script>

    <script src="app.utils.min.js"></script>
    <script src="header-loader.js"></script>
    <script src="redirecionar.js"></script>
  </body>
