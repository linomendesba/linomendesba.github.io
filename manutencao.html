<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gráfico Velas — Gols FT/HT</title>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
/* CSS do acordeon — troque pelo seu se já tiver um */
:root{
    --bg:#0b0e17; --panel:#0f121c; --border:rgba(125,227,214,.18);
    --accent:#7DE3D6; --text:#E5E7EB; --muted:#8B92A8;
}
*{box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',Roboto,Arial,sans-serif;margin:0;padding:20px;}

.accordion-item{background:var(--panel);border:1px solid var(--border);border-radius:10px;overflow:hidden;max-width:1120px;margin:0 auto;}
.accordion-button{width:100%;text-align:left;padding:14px 18px;background:rgba(125,227,214,.06);border:none;color:var(--accent);font-size:15px;font-weight:600;cursor:pointer;}
.accordion-button:hover{background:rgba(125,227,214,.1);}
.accordion-content{padding:16px 18px 20px;display:block;}
.accordion-content.collapsed{display:none;}

/* CSS do gráfico + ferramentas — este sim é necessário */
.chart-container{display:flex;flex-direction:column;gap:12px;}
.canvas-wrapper{position:relative;width:100%;height:450px;border-radius:8px;overflow:hidden;border:1px solid rgba(148,163,184,.09);}
#chartVelas{width:100%;height:100%;}
#drawOverlay{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:2;}

.control-panel{display:flex;flex-wrap:wrap;gap:10px;align-items:center;}
.control-panel select{
    background:#141826;color:var(--text);border:1px solid rgba(148,163,184,.2);
    border-radius:6px;padding:7px 10px;font-size:13px;cursor:pointer;
}
.control-panel select:focus{outline:1px solid var(--accent);}

.mercado-toggle{display:flex;background:#141826;border:1px solid rgba(148,163,184,.2);border-radius:8px;overflow:hidden;}
.mercado-toggle button{background:transparent;border:none;color:var(--muted);padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer;transition:.15s;}
.mercado-toggle button.active.ft{background:#26A69A;color:#08110e;}
.mercado-toggle button.active.ht{background:#42A5F5;color:#08110e;}

.linha-atual-toggle{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer;user-select:none;}
.linha-atual-toggle input{accent-color:var(--accent);cursor:pointer;}

.valor-atual{margin-left:auto;font-size:13px;color:var(--muted);}
.valor-atual b{color:var(--text);font-size:16px;}
.valor-atual .tag{padding:2px 8px;border-radius:5px;font-size:11px;font-weight:700;margin-left:6px;}
.valor-atual .tag.ft{background:rgba(38,166,154,.18);color:#26A69A;}
.valor-atual .tag.ht{background:rgba(66,165,245,.18);color:#42A5F5;}

.linha-tools-wrapper{position:relative;}
.linha-tools-wrapper > button{
    background:#141826;border:1px solid rgba(148,163,184,.2);color:var(--text);
    border-radius:6px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;
}
.linha-tools-wrapper > button:hover{border-color:var(--accent);}
.linha-tools-wrapper > button.tool-active{border-color:var(--accent);color:var(--accent);}
.tool-dropdown-panel{
    position:absolute;top:calc(100% + 6px);left:0;background:#141826;
    border:1px solid rgba(148,163,184,.2);border-radius:8px;padding:12px;
    min-width:190px;z-index:10;display:flex;flex-direction:column;gap:8px;
    box-shadow:0 8px 24px rgba(0,0,0,.4);
}
.contador-linhas{font-size:11px;color:var(--muted);text-align:center;}
.btn-linha{border:none;border-radius:6px;padding:8px 10px;font-size:12px;font-weight:600;cursor:pointer;color:#08110e;}
.btn-linha.green{background:#34D399;}
.btn-linha.yellow{background:#FBBF24;}
.btn-linha.red{background:#F87171;}
.separador-panel{height:1px;background:rgba(148,163,184,.15);margin:2px 0;}
</style>
</head>
<body>

<div class="accordion-item">
    <button class="accordion-button" onclick="toggleAccordion(this)">▼ Gráfico Velas — Gols ▲</button>
    <div class="accordion-content" id="accordionContent">

        <div class="chart-container">
            <div class="control-panel">

                <div>
                    <label for="pointsSelector"></label>
                    <select id="pointsSelector">
                        <option value="20">1 Hora</option>
                        <option value="40">2 Horas</option>
                        <option value="60">3 Horas</option>
                        <option value="80">4 Horas</option>
                        <option value="100">5 Horas</option>
                        <option value="120">6 Horas</option>
                        <option value="140">7 Horas</option>
                        <option value="160" selected>8 Horas</option>
                        <option value="180">9 Horas</option>
                        <option value="200">10 Horas</option>
                        <option value="220">11 Horas</option>
                        <option value="240">12 Horas</option>
                        <option value="480">24 Horas</option>
                        <option value="960">48 Horas</option>
                        <option value="1440">72 Horas</option>
                    </select>
                </div>

                <div>
                    <label for="averageSelector"></label>
                    <select id="averageSelector">
                        <option value="19" selected>Base 20</option>
                        <option value="39">Base 40</option>
                        <option value="59">Base 60</option>
                        <option value="79">Base 80</option>
                        <option value="99">Base 100</option>
                        <option value="119">Base 120</option>
                    </select>
                </div>

                <div class="mercado-toggle">
                    <button id="btnFT" class="active ft" onclick="setMercado('FT')">Gols FT</button>
                    <button id="btnHT" class="ht" onclick="setMercado('HT')">Gols HT</button>
                </div>

                <label class="linha-atual-toggle">
                    <input type="checkbox" id="linhaAtualToggle" checked>
                    Atual
                </label>

                <!-- ══ FIBONACCI ══ -->
                <div class="linha-tools-wrapper">
                    <button id="btnFibTools">Fib+</button>
                    <div id="fibToolsPanel" class="tool-dropdown-panel" style="display:none;">
                        <div class="contador-linhas" id="contadorFibs">0 / 4 fibonacci</div>
                        <button class="btn-linha green" onclick="ativarDesenhoFibonacci()">🖊 Traçar</button>
                        <div class="separador-panel"></div>
                        <button class="btn-linha yellow" onclick="deletarFibonacciSelecionado()">🗑 Selecionado</button>
                        <button class="btn-linha red"    onclick="limparFibonacciLivre()">🧹 Todos</button>
                    </div>
                </div>

                <!-- ══ LTA / LTB ══ -->
                <div class="linha-tools-wrapper">
                    <button id="btnTrendTools">LTA/LTB</button>
                    <div id="trendToolsPanel" class="tool-dropdown-panel" style="display:none;">
                        <div class="contador-linhas" id="contadorTendencias">0 / 6 tendências</div>
                        <button class="btn-linha green" onclick="ativarDesenhoLTA()">▲ Traçar LTA</button>
                        <button class="btn-linha red"   onclick="ativarDesenhoLTB()">▼ Traçar LTB</button>
                        <div class="separador-panel"></div>
                        <button class="btn-linha yellow" onclick="deletarTendenciaSelecionada()">🗑 Selecionada</button>
                        <button class="btn-linha red"    onclick="limparTendencias()">🧹 Todas</button>
                    </div>
                </div>

                <div class="valor-atual">
                    Último valor: <b id="valorAtualDisplay">—</b>
                    <span class="tag" id="valorAtualTag">FT</span>
                </div>

            </div><!-- /control-panel -->

            <div class="canvas-wrapper">
                <div id="chartVelas"></div>
                <canvas id="drawOverlay"></canvas>
            </div>
        </div><!-- /chart-container -->

    </div><!-- /accordion-content -->
</div><!-- /accordion-item -->

<script src="grafico_velas_gols.js"></script>
</body>
</html>
