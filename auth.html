<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="img/favicon.ico" type="image/x-icon" />
    <title>BetStat | Login</title>
    
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!-- Cloudflare Turnstile SDK -->
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

    <style>
        :root {
            --bg-primary: #111318;
            --bg-secondary: #181c23;
            --bg-card: #1e232d;
            --border: #2a3040;
            --accent: #177b8e;
            --accent-dim: #115c6b;
            --text-primary: #e4e8f0;
            --text-secondary: #7a8499;
            --red: #e74c3c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: radial-gradient(circle at 50% 35%, rgba(23, 123, 142, 0.16) 0%, transparent 55%), var(--bg-primary);
            font-family: 'DM Sans', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-primary);
        }

        .login-container {
            background-color: var(--bg-secondary);
            padding: 40px;
            border-radius: 10px;
            border: 1px solid var(--border);
            width: 100%;
            max-width: 360px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        .logo {
            height: 55px;
            width: auto;
            margin-bottom: 25px;
            display: block;
            margin-left: auto;
            margin-right: auto;
            filter: drop-shadow(0 0 10px rgba(23, 123, 142, 0.25));
            flex-shrink: 0;
        }

        h2 {
            font-size: 22px;
            margin-bottom: 25px;
            text-align: center;
            font-weight: 600;
            color: var(--text-primary);
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.68rem;
            font-family: 'DM Mono', monospace;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-bottom: 8px;
            color: var(--text-secondary);
        }

        input {
            width: 100%;
            padding: 12px 16px;
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-family: 'DM Sans', sans-serif;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--accent);
        }

        /* Sem isso, o Chrome força fundo branco em campos com autofill
           (e-mail/senha salvos), quebrando o tema escuro */
        input:-webkit-autofill,
        input:-webkit-autofill:hover,
        input:-webkit-autofill:focus {
            -webkit-box-shadow: 0 0 0 1000px var(--bg-card) inset;
            -webkit-text-fill-color: var(--text-primary);
            caret-color: var(--text-primary);
            transition: background-color 9999s ease-in-out 0s;
        }

        button {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-family: 'DM Sans', sans-serif;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: opacity 0.2s, background-color 0.2s;
        }

        .btn-login {
            background-color: var(--accent);
            color: #fff;
            margin-top: 10px;
        }

        .btn-login:hover {
            background-color: var(--accent-dim);
        }

        .btn-login:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-payment {
            background-color: transparent;
            color: var(--text-secondary);
            margin-top: 15px;
            font-size: 13px;
            text-decoration: underline;
        }

        .btn-payment:hover {
            color: var(--accent);
        }

        /* Container do widget Turnstile — centralizado e com margem */
        .cf-turnstile {
            margin-top: 16px;
            display: flex;
            justify-content: center;
        }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.0.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/9.0.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDmLGMBnUa2YOdP0b-zlZepXjm-zlV477A",
            authDomain: "linoautenticador.firebaseapp.com",
            projectId: "linoautenticador",
            storageBucket: "linoautenticador.firebasestorage.app",
            messagingSenderId: "946057648829",
            appId: "1:946057648829:web:ac5c2b1ba66e651f9d75d4",
            measurementId: "G-4WT805FFHQ"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        window.login = async function() {
            const email    = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            if (!email || !password) {
                return alert("Preencha os campos.");
            }

            // Pega o token gerado pelo Turnstile
            const token = document.querySelector('[name="cf-turnstile-response"]')?.value;

            if (!token) {
                return alert("Por favor, aguarde a verificação de segurança.");
            }

            const btn = document.querySelector('.btn-login');
            btn.disabled = true;
            btn.textContent = 'Verificando...';

            // ─────────────────────────────────────────────────────────────────
            // Valida o token no backend antes de logar
            // ─────────────────────────────────────────────────────────────────
            let verify;
            try {
                verify = await fetch('https://betstat.site/api/verify-turnstile', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token })
                });
            } catch (e) {
                console.error('Erro de rede ao chamar /api/verify-turnstile:', e);
                alert("Não foi possível verificar a segurança agora. Tente novamente.");
                btn.disabled = false;
                btn.textContent = 'Entrar';
                if (window.turnstile) turnstile.reset();
                return;
            }

            let result;
            try {
                result = await verify.json();
            } catch (e) {
                console.error('Resposta de /api/verify-turnstile não é JSON. Status:', verify.status);
                alert("Erro inesperado na verificação (status " + verify.status + "). Veja o console.");
                btn.disabled = false;
                btn.textContent = 'Entrar';
                if (window.turnstile) turnstile.reset();
                return;
            }

            if (!verify.ok || !result.success) {
                console.error('Turnstile rejeitado:', verify.status, result);
                alert("Falha na verificação de segurança.");
                btn.disabled = false;
                btn.textContent = 'Entrar';
                if (window.turnstile) turnstile.reset();
                return;
            }

            btn.textContent = 'Entrando...';

            signInWithEmailAndPassword(auth, email, password)
                .then(() => {
                    window.location.href = "/home.html";
                })
                .catch(() => {
                    alert("E-mail ou senha incorretos.");
                    btn.disabled = false;
                    btn.textContent = 'Entrar';
                    // Reseta o widget para gerar novo token
                    if (window.turnstile) turnstile.reset();
                });
        }

        window.goToPayment = function() {
            window.location.href = "payment.html";
        }
    </script>

    <script>
        document.addEventListener("contextmenu", function(e) { e.preventDefault(); });
        document.addEventListener("keydown", function(e) {
            if (e.key === "F12") e.preventDefault();
            if (e.ctrlKey && e.shiftKey && e.key === "I") e.preventDefault();
            if (e.ctrlKey && e.key === "u") e.preventDefault();
            if (e.ctrlKey && e.shiftKey && e.key === "J") e.preventDefault();
            if (e.ctrlKey && e.shiftKey && e.key === "C") e.preventDefault();
            if (e.ctrlKey && e.key === "s") e.preventDefault();
            if (e.ctrlKey && e.key === "p") e.preventDefault();
        });
        document.addEventListener('selectstart', function(e) { e.preventDefault(); });
        document.addEventListener('dragstart', function(e) { e.preventDefault(); });
        console.log = function() {};
        console.debug = function() {};
        console.info = function() {};
    </script>
</head>
<body>

    <div class="login-container">
        <img src="img/logo3.png" alt="BetStat" class="logo">
        
        <h2>Login</h2>

        <div class="input-group">
            <label>E-mail</label>
            <input type="email" id="email" placeholder="Seu e-mail">
        </div>

        <div class="input-group">
            <label>Senha</label>
            <input type="password" id="password" placeholder="Sua senha">
        </div>

        <!--
            Widget Turnstile — substitua SUA_SITE_KEY_AQUI pela chave
            que você copiou no painel do Cloudflare → Turnstile
        -->
        <div class="cf-turnstile"
             data-sitekey="0x4AAAAAABMb1ZbXMk4zcM_U"
             data-theme="dark">
        </div>

        <button class="btn-login" onclick="login()">Entrar</button>
        <button class="btn-payment" onclick="goToPayment()">Não tem uma conta? Assine aqui</button>
    </div>

</body>
</html>
