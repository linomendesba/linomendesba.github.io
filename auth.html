<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="img/favicon.ico" type="image/x-icon" />
    <title>BetStat | Login</title>
    
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">


    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

    <style>
        :root {
            --bg-primary: #111318;
            --bg-secondary: #181c23;
            --bg-card: #1e232d;
            --border: #2a3040;
            --accent: #177b8e;
            --accent-dim: #115c6b;
            --text-primary: #e4e8f0;
            --text-secondary: #7a8499;
            --red: #e74c3c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: radial-gradient(circle at 50% 35%, rgba(23, 123, 142, 0.16) 0%, transparent 55%), var(--bg-primary);
            font-family: 'DM Sans', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-primary);
        }

        .login-container {
            background-color: var(--bg-secondary);
            padding: 40px;
            border-radius: 10px;
            border: 1px solid var(--border);
            width: 100%;
            max-width: 360px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        .logo {
            height: 55px;
            width: auto;
            margin-bottom: 25px;
            display: block;
            margin-left: auto;
            margin-right: auto;
            filter: drop-shadow(0 0 10px rgba(23, 123, 142, 0.25));
            flex-shrink: 0;
        }

        h2 {
            font-size: 22px;
            margin-bottom: 25px;
            text-align: center;
            font-weight: 600;
            color: var(--text-primary);
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.68rem;
            font-family: 'DM Mono', monospace;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-bottom: 8px;
            color: var(--text-secondary);
        }

        input {
            width: 100%;
            padding: 12px 16px;
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-family: 'DM Sans', sans-serif;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--accent);
        }


        input:-webkit-autofill,
        input:-webkit-autofill:hover,
        input:-webkit-autofill:focus {
            -webkit-box-shadow: 0 0 0 1000px var(--bg-card) inset;
            -webkit-text-fill-color: var(--text-primary);
            caret-color: var(--text-primary);
            transition: background-color 9999s ease-in-out 0s;
        }

        button {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-family: 'DM Sans', sans-serif;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: opacity 0.2s, background-color 0.2s;
        }

        .btn-login {
            background-color: var(--accent);
            color: #fff;
            margin-top: 10px;
        }

        .btn-login:hover {
            background-color: var(--accent-dim);
        }

        .btn-login:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-payment {
            background-color: transparent;
            color: var(--text-secondary);
            margin-top: 15px;
            font-size: 13px;
            text-decoration: underline;
        }

        .btn-payment:hover {
            color: var(--accent);
        }


        .cf-turnstile {
            margin-top: 16px;
            display: flex;
            justify-content: center;
        }
    </style>
