<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="img/favicon.ico" type="image/x-icon" />
    <title>BetStat | Criar conta</title>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <script src="app.utils.min.js"></script>

    <style>
        :root {
            --bg-primary: #111318;
            --bg-secondary: #181c23;
            --bg-card: #1e232d;
            --border: #2a3040;
            --accent: #177b8e;
            --accent-dim: #115c6b;
            --text-primary: #e4e8f0;
            --text-secondary: #7a8499;
            --red: #e74c3c;
            --green: #22c55e;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: radial-gradient(circle at 50% 35%, rgba(23, 123, 142, 0.16) 0%, transparent 55%), var(--bg-primary);
            font-family: 'DM Sans', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-primary);
            padding: 24px 0;
        }

        .box-container {
            background-color: var(--bg-secondary);
            padding: 40px;
            border-radius: 10px;
            border: 1px solid var(--border);
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        .logo {
            height: 55px; width: auto; margin: 0 auto 25px; display: block;
            filter: drop-shadow(0 0 10px rgba(23, 123, 142, 0.25));
        }

        h2 { font-size: 22px; margin-bottom: 6px; text-align: center; font-weight: 600; }
        .subtitle { font-size: 12.5px; color: var(--text-secondary); text-align: center; margin-bottom: 25px; }

        .input-group { margin-bottom: 18px; }
        label {
            display: block; font-size: 0.68rem; font-family: 'DM Mono', monospace;
            letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 8px; color: var(--text-secondary);
        }
        input {
            width: 100%; padding: 12px 16px; background-color: var(--bg-card);
            border: 1px solid var(--border); border-radius: 8px; color: var(--text-primary);
            font-family: 'DM Sans', sans-serif; font-size: 15px; outline: none; transition: border-color 0.2s;
        }
        input:focus { border-color: var(--accent); }
        input:-webkit-autofill, input:-webkit-autofill:hover, input:-webkit-autofill:focus {
            -webkit-box-shadow: 0 0 0 1000px var(--bg-card) inset;
            -webkit-text-fill-color: var(--text-primary);
            caret-color: var(--text-primary);
            transition: background-color 9999s ease-in-out 0s;
        }

        button {
            width: 100%; padding: 12px; border-radius: 8px; font-family: 'DM Sans', sans-serif;
            font-size: 15px; font-weight: 600; cursor: pointer; border: none;
            transition: opacity 0.2s, background-color 0.2s;
        }
        .btn-primary { background-color: var(--accent); color: #fff; margin-top: 6px; }
        .btn-primary:hover { background-color: var(--accent-dim); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

        .btn-link {
            background: transparent; color: var(--text-secondary); margin-top: 14px;
            font-size: 13px; text-decoration: underline;
        }
        .btn-link:hover { color: var(--accent); }

        .cf-turnstile { margin-top: 16px; display: flex; justify-content: center; }

        .error-msg {
            background: rgba(231,76,60,0.12); border: 1px solid rgba(231,76,60,0.3);
            color: var(--red); font-size: 13px; padding: 10px 14px; border-radius: 8px;
            margin-bottom: 16px; display: none;
        }

        /* Tela de pagamento PIX */
        #tela-pagamento { display: none; text-align: center; }
        #tela-pagamento img { width: 220px; height: 220px; border-radius: 10px; background: #fff; padding: 8px; margin: 10px auto 16px; display: block; }
        .pix-copia {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px;
            padding: 10px 12px; font-family: 'DM Mono', monospace; font-size: 11px;
            color: var(--text-secondary); word-break: break-all; margin-bottom: 14px; max-height: 70px; overflow-y: auto;
        }
        .status-aguardando {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            font-size: 13px; color: var(--text-secondary); margin-top: 10px;
        }
        .spinner {
            width: 14px; height: 14px; border: 2px solid var(--border);
            border-top-color: var(--accent); border-radius: 50%; animation: girar 0.8s linear infinite;
        }
        @keyframes girar { to { transform: rotate(360deg); } }
        .status-ok { color: var(--green); font-size: 14px; font-weight: 600; margin-top: 10px; }
    </style>

    <script>
        document.addEventListener("contextmenu", function(e) { e.preventDefault(); });
        console.log = function() {};
    </script>
</head>
<body>

    <div class="box-container">
        <img src="img/logo3.png" alt="BetStat" class="logo">

        <div id="tela-form">
            <h2>Criar conta</h2>
            <p class="subtitle">Cadastre-se e ative sua assinatura via PIX</p>

            <div class="error-msg" id="erro"></div>

            <div class="input-group">
                <label>Nome completo</label>
                <input type="text" id="name" placeholder="Seu nome">
            </div>
            <div class="input-group">
                <label>E-mail</label>
                <input type="email" id="email" placeholder="Seu e-mail">
            </div>
            <div class="input-group">
                <label>CPF</label>
                <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="14">
            </div>
            <div class="input-group">
                <label>Telefone (opcional)</label>
                <input type="text" id="phone" placeholder="(00) 00000-0000">
            </div>
            <div class="input-group">
                <label>Senha</label>
                <input type="password" id="password" placeholder="Mínimo 6 caracteres">
            </div>

            <div class="cf-turnstile"
                 data-sitekey="0x4AAAAAABMb1ZbXMk4zcM_U"
                 data-theme="dark">
            </div>

            <button class="btn-primary" id="btn-cadastrar" onclick="cadastrar()">Continuar para pagamento</button>
            <button class="btn-link" onclick="window.location.href='auth.html'">Já tem uma conta? Entrar</button>
        </div>

        <div id="tela-pagamento">
            <h2>Pague com PIX</h2>
            <p class="subtitle" id="valor-info"></p>
            <img id="pix-qr" src="" alt="QR Code PIX">
            <label style="text-align:left;display:block;">PIX copia e cola</label>
            <div class="pix-copia" id="pix-copia"></div>
            <button class="btn-primary" onclick="copiarPix()">Copiar código PIX</button>
            <div class="status-aguardando" id="status-aguardando">
                <div class="spinner"></div> Aguardando confirmação do pagamento...
            </div>
            <div class="status-ok" id="status-ok" style="display:none;">✅ Pagamento confirmado! Redirecionando para o login...</div>
        </div>
    </div>
