    <style>
      :root {
        --bg-primary: #111318;
        --bg-secondary: #181c23;
        --bg-card: #1e232d;
        --bg-card-hover: #242a36;
        --bg-top: #0d1c1f;
        --border: #2a3040;
        --border-accent: #1a4750;
        --accent: #177b8e;
        --accent-dim: #115c6b;
        --accent-muted: rgba(23, 123, 142, 0.14);
        --text-primary: #e4e8f0;
        --text-secondary: #7a8499;
        --text-accent: #177b8e;
        --green: #2ecc71;
        --red: #e74c3c;
        --orange: #e6a817;
        --red-bg: #1a0d0d;
        --green-bg: #0a1f16;
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        font-family: "DM Sans", sans-serif;
        background-color: var(--bg-primary);
        color: var(--text-primary);
        min-height: 100vh;
      }

      #header { position: sticky; top: 0; z-index: 100; }

      .page-wrapper {
        max-width: 1600px;
        margin: 0 auto;
        padding: 28px 24px 60px;
      }

      .section-title {
        font-size: 0.7rem;
        font-family: "DM Mono", monospace;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--text-accent);
        margin-bottom: 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      /* ── FILTROS ── */
      .filter-section {
        background: var(--bg-secondary);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 20px 24px;
        margin-bottom: 24px;
      }

      .filters-row {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 16px;
        margin-bottom: 16px;
      }

      .filter-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .filter-group label {
        font-size: 0.75rem;
        font-family: "DM Mono", monospace;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--text-secondary);
        font-weight: 500;
      }

      .filter-group select {
        background: var(--bg-card);
        border: 1px solid var(--border);
        color: var(--text-primary);
        padding: 10px 12px;
        border-radius: 6px;
        font-family: "DM Sans", sans-serif;
        font-size: 0.85rem;
        cursor: pointer;
        transition: all 0.2s;
      }

      .filter-group select:hover {
        border-color: var(--accent-dim);
      }

      .filter-group select:focus {
        outline: none;
        border-color: var(--accent);
        background: var(--bg-card-hover);
      }

      .filter-group select option {
        background: var(--bg-card);
        color: var(--text-primary);
      }

      .filters-actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
      }

      .btn-filter {
        background: var(--accent-muted);
        border: 1px solid var(--accent);
        color: var(--accent);
        font-family: "DM Sans", sans-serif;
        font-size: 0.8rem;
        font-weight: 600;
        padding: 10px 18px;
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.15s;
      }

      .btn-filter:hover {
        background: var(--accent);
        color: var(--bg-primary);
      }

      .checkbox-filter {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 0.85rem;
        color: var(--text-secondary);
      }

      .checkbox-filter input {
        cursor: pointer;
        width: 16px;
        height: 16px;
        accent-color: var(--accent);
      }

      /* ── PROJEÇÕES ── */
      .projections-section {
        margin-bottom: 24px;
      }

      .projections-header {
        background: var(--bg-secondary);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 20px 24px;
        margin-bottom: 20px;
      }

      .projections-content {
        background: var(--bg-secondary);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 20px 24px;
      }

      .top-signals {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 12px;
        margin-bottom: 24px;
      }

      .signal-card {
        background: linear-gradient(135deg, rgba(23, 123, 142, 0.15) 0%, rgba(23, 123, 142, 0.05) 100%);
        border: 1px solid var(--border-accent);
        border-radius: 8px;
        padding: 16px;
        transition: all 0.2s;
      }

      .signal-card:hover {
        border-color: var(--accent);
        background: linear-gradient(135deg, rgba(23, 123, 142, 0.25) 0%, rgba(23, 123, 142, 0.1) 100%);
      }

      .signal-card-rank {
        font-size: 0.75rem;
        font-family: "DM Mono", monospace;
        color: var(--accent);
        font-weight: 600;
        margin-bottom: 4px;
      }

      .signal-card-content {
        font-size: 0.85rem;
        line-height: 1.5;
        color: var(--text-primary);
      }

      .signal-card-strength {
        font-size: 0.75rem;
        color: var(--text-secondary);
        margin-top: 8px;
      }

      .hour-block {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 16px;
        margin-bottom: 12px;
      }

      .hour-block h3 {
        font-size: 0.85rem;
        font-family: "DM Mono", monospace;
        color: var(--accent);
        margin-bottom: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .projection-item {
        background: var(--bg-primary);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 12px;
        margin-bottom: 8px;
        cursor: pointer;
        transition: all 0.2s;
        font-size: 0.85rem;
      }

      .projection-item:hover {
        background: var(--bg-card-hover);
        border-color: var(--accent-dim);
      }

      .projection-main-text {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 6px;
      }

      .projection-league {
        color: var(--text-primary);
        font-weight: 600;
      }

      .projection-minutes {
        color: var(--text-secondary);
        font-size: 0.8rem;
      }

      .projection-stats {
        font-size: 0.8rem;
        color: var(--text-secondary);
        margin-top: 6px;
        padding-top: 6px;
        border-top: 1px solid var(--border);
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }

      .projection-stat {
        display: flex;
        align-items: center;
        gap: 4px;
      }

      .details-section {
        display: none;
        background: rgba(23, 123, 142, 0.1);
        border: 1px solid var(--border-accent);
        border-radius: 6px;
        padding: 12px;
        margin-top: 8px;
        font-size: 0.8rem;
        color: var(--text-secondary);
      }

      .details-section.open {
        display: block;
      }

      .details-stat-row {
        display: flex;
        justify-content: space-between;
        margin-bottom: 6px;
        gap: 12px;
      }

      .last-games {
        margin-top: 12px;
        padding-top: 12px;
        border-top: 1px solid var(--border-accent);
      }

      .last-games-list {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-top: 8px;
      }

      .game-result {
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 0.75rem;
        font-weight: 500;
      }

      .game-result.green {
        background: var(--green-bg);
        color: var(--green);
      }

      .game-result.red {
        background: var(--red-bg);
        color: var(--red);
      }

      .no-results {
        background: var(--bg-card);
        border: 1px dashed var(--border);
        border-radius: 8px;
        padding: 40px;
        text-align: center;
        color: var(--text-secondary);
        font-size: 0.9rem;
      }

      .loading {
        text-align: center;
        padding: 20px;
        color: var(--accent);
        font-weight: 500;
      }

      .progress-bar {
        display: inline-block;
        width: 80px;
        height: 4px;
        background: var(--border);
        border-radius: 2px;
        overflow: hidden;
      }

      .progress-fill {
        height: 100%;
        background: linear-gradient(90deg, var(--accent-dim), var(--accent));
        width: 0%;
      }

      @media (max-width: 768px) {
        .page-wrapper {
          padding: 16px 12px 40px;
        }
        .filters-row {
          grid-template-columns: 1fr;
        }
        .top-signals {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
