<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    html, body {
        margin: 0;
        background: #0b0c14;
        font-family: 'Roboto', system-ui, -apple-system, Segoe UI, sans-serif;
        color: #cbd5e1;
        min-height: 100vh;
    }

    #status { display: none; }

    .tv-wrap {
        max-width: 1600px;
        margin: 0 auto;
        padding: 16px 16px 40px;
        box-sizing: border-box;
    }

    .tv-header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 18px;
    }

    .tv-title-block .tv-title {
        font-size: 22px;
        font-weight: 800;
        color: #f1f5f9;
        letter-spacing: -0.02em;
    }

    .tv-title-block .tv-sub {
        font-size: 13px;
        color: #94a3b8;
        margin-top: 2px;
    }

    .tv-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
    }

    .tv-btn {
        height: 34px;
        padding: 0 14px;
        border-radius: 12px;
        border: 1px solid rgba(124,92,246,.35);
        background: #171a21;
        color: #cbd5e1;
        font-size: 12px;
        font-weight: 800;
        cursor: pointer;
        transition: all .15s ease;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        user-select: none;
    }

    .tv-btn:hover {
        border-color: rgba(124,92,246,.8);
        background: rgba(124,92,246,.14);
        color: #7c5cff;
    }

    .tv-btn.active {
        color: #7c5cff;
        border-color: rgba(124,92,246,.8);
        background: rgba(124,92,246,.14);
        box-shadow:
            0 0 0 1px rgba(124,92,246,.22),
            0 4px 14px rgba(124,92,246,.12);
    }

    .tv-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 14px;
    }

    @media (max-width: 900px) {
        .tv-grid { grid-template-columns: 1fr; }
    }

    .tv-card {
        background: #111318;
        border: 1px solid rgba(124,92,246,.22);
        border-radius: 16px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        box-shadow: 0 8px 28px rgba(0,0,0,.35);
    }

    .tv-card-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 10px 12px;
        background: #171a21;
        border-bottom: 1px solid rgba(255,255,255,.05);
    }

    .tv-card-name {
        font-size: 13px;
        font-weight: 800;
        color: #e2e8f0;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .tv-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #22c55e;
        box-shadow: 0 0 8px rgba(34,197,94,.7);
        flex-shrink: 0;
    }

    .tv-card-controls {
        display: flex;
        gap: 6px;
        align-items: center;
    }

    .tv-icon-btn {
        width: 32px;
        height: 32px;
        border-radius: 10px;
        border: 1px solid rgba(124,92,246,.35);
        background: #0f1219;
        color: #cbd5e1;
        font-size: 14px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        transition: all .15s ease;
        padding: 0;
        line-height: 1;
    }

    .tv-icon-btn:hover {
        border-color: rgba(124,92,246,.8);
        color: #7c5cff;
        background: rgba(124,92,246,.12);
    }

    .tv-icon-btn.unmuted {
        color: #22c55e;
        border-color: rgba(34,197,94,.55);
        background: rgba(34,197,94,.12);
        box-shadow: 0 0 0 1px rgba(34,197,94,.2);
    }

    .tv-player-wrap {
        position: relative;
        width: 100%;
        aspect-ratio: 16 / 9;
        background: #0a0b10;
        overflow: hidden;
    }

    .tv-player-wrap iframe {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
        background: #000;
    }

    .tv-overlay-msg {
        position: absolute;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(11,12,20,.85);
        color: #94a3b8;
        font-size: 13px;
        font-weight: 600;
        text-align: center;
        padding: 16px;
        z-index: 2;
    }

    .tv-hint {
        margin-top: 16px;
        font-size: 12px;
        color: #64748b;
        line-height: 1.5;
        text-align: center;
    }

    .tv-hint strong { color: #94a3b8; }
</style>
</head>
<body>
<div id="header"></div>
<br><br><br>

<div class="tv-wrap">

    <div class="tv-header">
        <div class="tv-title-block">
            <div class="tv-title">TV Esportes</div>
            <div class="tv-sub">Canais ao vivo — áudio individual por player</div>
        </div>
        <div class="tv-actions">
            <button type="button" class="tv-btn" id="btnMuteAll" title="Mutar todos">🔇 Mutar todos</button>
            <button type="button" class="tv-btn" id="btnReloadAll" title="Recarregar players">↻ Recarregar</button>
        </div>
    </div>

    <div class="tv-grid" id="tvGrid">
        <!-- preenchido via JS -->
    </div>

    <p class="tv-hint">
        Os players iniciam <strong>mutados</strong> (exigência dos navegadores para autoplay).
        Clique no ícone de volume de cada card para ativar o áudio daquele canal.
        Apenas um canal costuma tocar com som por vez — os demais continuam mutados.
    </p>

</div>

<script>
(function () {
    "use strict";

    const CANAIS = [
        {
            id: "sportv1",
            nome: "SporTV 1",
            url: "https://redecanaistv.vision/player3/ch.php?categoria=live&canal=sportv1"
        },
        {
            id: "premiere",
            nome: "Premiere Clubes",
            url: "https://redecanaistv.vision/player3/ch.php?categoria=live&canal=premiereclubes"
        },
        {
            id: "espn",
            nome: "ESPN",
            url: "https://redecanaistv.vision/player3/ch.php?categoria=live&canal=espn"
        },
        {
            id: "bandsports",
            nome: "BandSports",
            url: "https://redecanaistv.vision/player3/ch.php?categoria=live&canal=bandsports"
        }
    ];

    const grid = document.getElementById("tvGrid");
    const state = {}; // id -> { muted: true, iframe }

    function buildCard(canal) {
        const card = document.createElement("div");
        card.className = "tv-card";
        card.dataset.canal = canal.id;

        card.innerHTML = `
            <div class="tv-card-top">
                <div class="tv-card-name">
                    <span class="tv-dot" aria-hidden="true"></span>
                    <span>${canal.nome}</span>
                </div>
                <div class="tv-card-controls">
                    <button type="button" class="tv-icon-btn btn-mute" title="Ativar / desativar áudio" aria-label="Áudio">🔇</button>
                    <button type="button" class="tv-icon-btn btn-reload" title="Recarregar este player" aria-label="Recarregar">↻</button>
                    <button type="button" class="tv-icon-btn btn-fullscreen" title="Tela cheia" aria-label="Tela cheia">⛶</button>
                </div>
            </div>
            <div class="tv-player-wrap">
                <iframe
                    src="${canal.url}"
                    allow="autoplay; encrypted-media; picture-in-picture; fullscreen"
                    allowfullscreen
                    referrerpolicy="no-referrer"
                    loading="eager"
                    title="${canal.nome}"
                ></iframe>
                <div class="tv-overlay-msg">Player indisponível ou bloqueado pelo navegador</div>
            </div>
        `;

        const iframe = card.querySelector("iframe");
        const btnMute = card.querySelector(".btn-mute");
        const btnReload = card.querySelector(".btn-reload");
        const btnFs = card.querySelector(".btn-fullscreen");

        state[canal.id] = { muted: true, iframe, btnMute };

        // Tenta forçar mute no documento do iframe (pode falhar por cross-origin)
        function tryMuteIframe(muted) {
            try {
                const doc = iframe.contentDocument || iframe.contentWindow?.document;
                if (!doc) return;
                const videos = doc.querySelectorAll("video, audio");
                videos.forEach(v => {
                    v.muted = muted;
                    if (!muted) {
                        v.volume = 1;
                        v.play?.().catch(() => {});
                    }
                });
            } catch (e) {
                // cross-origin — esperado na maioria dos players externos
            }
        }

        btnMute.addEventListener("click", () => {
            const st = state[canal.id];
            st.muted = !st.muted;
            updateMuteUI(canal.id);
            tryMuteIframe(st.muted);

            // Se desmutou este, muta os outros (comportamento típico de "só um com som")
            if (!st.muted) {
                Object.keys(state).forEach(id => {
                    if (id === canal.id) return;
                    state[id].muted = true;
                    updateMuteUI(id);
                    try {
                        const other = state[id].iframe;
                        const doc = other.contentDocument || other.contentWindow?.document;
                        if (doc) {
                            doc.querySelectorAll("video, audio").forEach(v => { v.muted = true; });
                        }
                    } catch (_) {}
                });
            }
        });

        btnReload.addEventListener("click", () => {
            const src = iframe.src;
            iframe.src = "about:blank";
            setTimeout(() => {
                iframe.src = src;
                state[canal.id].muted = true;
                updateMuteUI(canal.id);
            }, 80);
        });

        btnFs.addEventListener("click", () => {
            const wrap = card.querySelector(".tv-player-wrap");
            if (!document.fullscreenElement) {
                (wrap.requestFullscreen || wrap.webkitRequestFullscreen)?.call(wrap);
            } else {
                (document.exitFullscreen || document.webkitExitFullscreen)?.call(document);
            }
        });

        // Tenta mutar assim que o iframe carregar (quando possível)
        iframe.addEventListener("load", () => {
            tryMuteIframe(true);
        });

        return card;
    }

    function updateMuteUI(id) {
        const st = state[id];
        if (!st) return;
        if (st.muted) {
            st.btnMute.textContent = "🔇";
            st.btnMute.classList.remove("unmuted");
            st.btnMute.title = "Ativar áudio";
        } else {
            st.btnMute.textContent = "🔊";
            st.btnMute.classList.add("unmuted");
            st.btnMute.title = "Desativar áudio";
        }
    }

    // Monta grid
    CANAIS.forEach(c => grid.appendChild(buildCard(c)));

    // Mutar todos
    document.getElementById("btnMuteAll").addEventListener("click", () => {
        Object.keys(state).forEach(id => {
            state[id].muted = true;
            updateMuteUI(id);
            try {
                const iframe = state[id].iframe;
                const doc = iframe.contentDocument || iframe.contentWindow?.document;
                if (doc) {
                    doc.querySelectorAll("video, audio").forEach(v => { v.muted = true; });
                }
            } catch (_) {}
        });
    });

    // Recarregar todos
    document.getElementById("btnReloadAll").addEventListener("click", () => {
        Object.keys(state).forEach(id => {
            const iframe = state[id].iframe;
            const src = iframe.src;
            iframe.src = "about:blank";
            setTimeout(() => {
                iframe.src = src;
                state[id].muted = true;
                updateMuteUI(id);
            }, 80);
        });
    });
})();
</script>

<script>
  fetch('header.html').then(r => r.text()).then(d => {
    document.getElementById('header').innerHTML = d;
  }).catch(() => {});
</script>
<script src="redirecionar.js"></script>
</body>
