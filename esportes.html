<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TV Esportes — BetStat</title>
<meta name="description" content="TV Esportes BetStat — Sportv, Premiere, ESPN e BandSports ao vivo">

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
    html, body {
        margin: 0;
        background: #0b0c14;
        font-family: 'Roboto', system-ui, -apple-system, Segoe UI, sans-serif;
        color: #cbd5e1;
        min-height: 100vh;
    }

    #status { display: none; }

    .tv-wrap {
        max-width: 1280px;
        margin: 0 auto;
        padding: 8px 12px 24px;
        box-sizing: border-box;
    }

    .tv-header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 12px;
    }

    .tv-title-block .tv-title {
        font-size: 18px;
        font-weight: 800;
        color: #f1f5f9;
        letter-spacing: -0.02em;
    }

    .tv-title-block .tv-sub {
        font-size: 12px;
        color: #94a3b8;
        margin-top: 1px;
    }

    .tv-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
    }

    .tv-btn {
        height: 30px;
        padding: 0 12px;
        border-radius: 10px;
        border: 1px solid rgba(124,92,246,.35);
        background: #171a21;
        color: #cbd5e1;
        font-size: 11px;
        font-weight: 800;
        cursor: pointer;
        transition: all .15s ease;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        user-select: none;
    }

    .tv-btn:hover {
        border-color: rgba(124,92,246,.8);
        background: rgba(124,92,246,.14);
        color: #7c5cff;
    }

    .tv-btn.primary {
        color: #7c5cff;
        border-color: rgba(124,92,246,.8);
        background: rgba(124,92,246,.14);
    }

    .tv-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
    }

    @media (max-width: 700px) {
        .tv-grid { grid-template-columns: 1fr; }
    }

    .tv-card {
        background: #111318;
        border: 1px solid rgba(124,92,246,.22);
        border-radius: 12px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        box-shadow: 0 4px 16px rgba(0,0,0,.3);
    }

    .tv-card-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 6px 10px;
        background: #171a21;
        border-bottom: 1px solid rgba(255,255,255,.05);
        min-height: 34px;
        box-sizing: border-box;
    }

    .tv-card-name {
        font-size: 12px;
        font-weight: 800;
        color: #e2e8f0;
        display: flex;
        align-items: center;
        gap: 6px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .tv-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #22c55e;
        box-shadow: 0 0 6px rgba(34,197,94,.7);
        flex-shrink: 0;
    }

    .tv-card-controls {
        display: flex;
        gap: 4px;
        align-items: center;
        flex-shrink: 0;
    }

    .tv-icon-btn {
        width: 28px;
        height: 28px;
        border-radius: 8px;
        border: 1px solid rgba(124,92,246,.35);
        background: #0f1219;
        color: #cbd5e1;
        font-size: 13px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        transition: all .15s ease;
        padding: 0;
        line-height: 1;
    }

    .tv-icon-btn:hover {
        border-color: rgba(124,92,246,.8);
        color: #7c5cff;
        background: rgba(124,92,246,.12);
    }

    .tv-icon-btn.unmuted {
        color: #22c55e;
        border-color: rgba(34,197,94,.55);
        background: rgba(34,197,94,.12);
        box-shadow: 0 0 0 1px rgba(34,197,94,.2);
    }

    .tv-player-wrap {
        position: relative;
        width: 100%;
        height: clamp(160px, 28vh, 240px);
        background: #0a0b10;
        overflow: hidden;
    }

    .tv-player-wrap iframe {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
        background: #000;
    }

    .tv-play-overlay {
        position: absolute;
        inset: 0;
        z-index: 3;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0,0,0,.45);
        cursor: pointer;
        transition: opacity .2s ease;
    }

    .tv-play-overlay.hidden {
        opacity: 0;
        pointer-events: none;
    }

    .tv-play-overlay span {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        background: rgba(124,92,246,.9);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
        box-shadow: 0 4px 20px rgba(124,92,246,.45);
        border: 2px solid rgba(255,255,255,.25);
    }

    .tv-hint {
        margin-top: 12px;
        font-size: 11px;
        color: #64748b;
        line-height: 1.45;
        text-align: center;
    }

    .tv-hint strong { color: #94a3b8; }
</style>
</head>
<body>
<div id="header"></div>
<br><br><br>

<div class="tv-wrap">

    <div class="tv-header">
        <div class="tv-title-block">
            <div class="tv-title">TV Esportes</div>
            <div class="tv-sub">Canais ao vivo — clique em ▶ ou em “Iniciar todos”</div>
        </div>
        <div class="tv-actions">
            <button type="button" class="tv-btn primary" id="btnPlayAll" title="Iniciar todos os players">▶ Iniciar todos</button>
            <button type="button" class="tv-btn" id="btnMuteAll" title="Mutar todos">🔇 Mutar todos</button>
            <button type="button" class="tv-btn" id="btnReloadAll" title="Recarregar players">↻ Recarregar</button>
        </div>
    </div>

    <div class="tv-grid" id="tvGrid"></div>

    <p class="tv-hint">
        Navegadores bloqueiam autoplay com som. Os players iniciam <strong>mutados</strong>.
        Use <strong>Iniciar todos</strong> (ou o ▶ de cada card) e depois o ícone de volume para ouvir o canal desejado.
        Se o vídeo continuar pausado, clique no ▶ dentro do player.
    </p>

</div>

<script>
(function () {
    "use strict";

    const AP = "&autoplay=1&mute=1&muted=1";

    const CANAIS = [
        {
            id: "sportv1",
            nome: "SporTV 1",
            url: "https://redecanaistv.vision/player3/ch.php?categoria=live&canal=sportv1" + AP
        },
        {
            id: "premiere",
            nome: "Premiere Clubes",
            url: "https://redecanaistv.vision/player3/ch.php?categoria=live&canal=premiereclubes" + AP
        },
        {
            id: "espn",
            nome: "ESPN",
            url: "https://redecanaistv.vision/player3/ch.php?categoria=live&canal=espn" + AP
        },
        {
            id: "bandsports",
            nome: "BandSports",
            url: "https://redecanaistv.vision/player3/ch.php?categoria=live&canal=bandsports" + AP
        }
    ];

    const grid = document.getElementById("tvGrid");
    const state = {};

    function buildCard(canal) {
        const card = document.createElement("div");
        card.className = "tv-card";
        card.dataset.canal = canal.id;

        card.innerHTML = `
            <div class="tv-card-top">
                <div class="tv-card-name">
                    <span class="tv-dot" aria-hidden="true"></span>
                    <span>${canal.nome}</span>
                </div>
                <div class="tv-card-controls">
                    <button type="button" class="tv-icon-btn btn-mute" title="Ativar / desativar áudio" aria-label="Áudio">🔇</button>
                    <button type="button" class="tv-icon-btn btn-reload" title="Recarregar este player" aria-label="Recarregar">↻</button>
                    <button type="button" class="tv-icon-btn btn-fullscreen" title="Tela cheia" aria-label="Tela cheia">⛶</button>
                </div>
            </div>
            <div class="tv-player-wrap">
                <iframe
                    src="${canal.url}"
                    allow="autoplay *; encrypted-media *; picture-in-picture *; fullscreen *"
                    allowfullscreen
                    referrerpolicy="no-referrer"
                    loading="eager"
                    title="${canal.nome}"
                ></iframe>
                <div class="tv-play-overlay" title="Clique para iniciar">
                    <span>▶</span>
                </div>
            </div>
        `;

        const iframe = card.querySelector("iframe");
        const overlay = card.querySelector(".tv-play-overlay");
        const btnMute = card.querySelector(".btn-mute");
        const btnReload = card.querySelector(".btn-reload");
        const btnFs = card.querySelector(".btn-fullscreen");

        state[canal.id] = { muted: true, iframe, overlay, btnMute, started: false };

        function tryControlMedia(action) {
            try {
                const doc = iframe.contentDocument || iframe.contentWindow?.document;
                if (!doc) return false;
                const medias = doc.querySelectorAll("video, audio");
                medias.forEach(v => {
                    if (action === "play") {
                        v.muted = state[canal.id].muted;
                        v.play?.().catch(() => {});
                    } else if (action === "mute") {
                        v.muted = true;
                    } else if (action === "unmute") {
                        v.muted = false;
                        v.volume = 1;
                    }
                });
                return medias.length > 0;
            } catch (e) {
                return false;
            }
        }

        function startPlayer() {
            state[canal.id].started = true;
            overlay.classList.add("hidden");
            tryControlMedia("play");
        }

        overlay.addEventListener("click", startPlayer);

        btnMute.addEventListener("click", () => {
            const st = state[canal.id];
            st.muted = !st.muted;
            updateMuteUI(canal.id);

            if (!st.muted) {
                Object.keys(state).forEach(id => {
                    if (id === canal.id) return;
                    state[id].muted = true;
                    updateMuteUI(id);
                    try {
                        const other = state[id].iframe;
                        const doc = other.contentDocument || other.contentWindow?.document;
                        if (doc) doc.querySelectorAll("video, audio").forEach(v => { v.muted = true; });
                    } catch (_) {}
                });
                tryControlMedia("unmute");
            } else {
                tryControlMedia("mute");
            }
        });

        btnReload.addEventListener("click", () => {
            const src = canal.url;
            iframe.src = "about:blank";
            overlay.classList.remove("hidden");
            state[canal.id].started = false;
            state[canal.id].muted = true;
            updateMuteUI(canal.id);
            setTimeout(() => { iframe.src = src; }, 60);
        });

        btnFs.addEventListener("click", () => {
            const wrap = card.querySelector(".tv-player-wrap");
            if (!document.fullscreenElement) {
                (wrap.requestFullscreen || wrap.webkitRequestFullscreen)?.call(wrap);
            } else {
                (document.exitFullscreen || document.webkitExitFullscreen)?.call(document);
            }
        });

        iframe.addEventListener("load", () => {
            setTimeout(() => tryControlMedia("mute"), 400);
            setTimeout(() => tryControlMedia("mute"), 1200);
        });

        return card;
    }

    function updateMuteUI(id) {
        const st = state[id];
        if (!st) return;
        if (st.muted) {
            st.btnMute.textContent = "🔇";
            st.btnMute.classList.remove("unmuted");
            st.btnMute.title = "Ativar áudio";
        } else {
            st.btnMute.textContent = "🔊";
            st.btnMute.classList.add("unmuted");
            st.btnMute.title = "Desativar áudio";
        }
    }

    CANAIS.forEach(c => grid.appendChild(buildCard(c)));

    document.getElementById("btnPlayAll").addEventListener("click", () => {
        Object.keys(state).forEach(id => {
            const st = state[id];
            st.started = true;
            st.overlay.classList.add("hidden");
            try {
                const doc = st.iframe.contentDocument || st.iframe.contentWindow?.document;
                if (doc) {
                    doc.querySelectorAll("video, audio").forEach(v => {
                        v.muted = st.muted;
                        v.play?.().catch(() => {});
                    });
                }
            } catch (_) {}
        });
    });

    document.getElementById("btnMuteAll").addEventListener("click", () => {
        Object.keys(state).forEach(id => {
            state[id].muted = true;
            updateMuteUI(id);
            try {
                const iframe = state[id].iframe;
                const doc = iframe.contentDocument || iframe.contentWindow?.document;
                if (doc) doc.querySelectorAll("video, audio").forEach(v => { v.muted = true; });
            } catch (_) {}
        });
    });

    document.getElementById("btnReloadAll").addEventListener("click", () => {
        Object.keys(state).forEach(id => {
            const st = state[id];
            const canal = CANAIS.find(c => c.id === id);
            st.iframe.src = "about:blank";
            st.overlay.classList.remove("hidden");
            st.started = false;
            st.muted = true;
            updateMuteUI(id);
            setTimeout(() => { st.iframe.src = canal.url; }, 60);
        });
    });
})();
</script>

<script>
  fetch('header.html').then(r => r.text()).then(d => {
    document.getElementById('header').innerHTML = d;
  }).catch(() => {});
</script>
<script src="redirecionar.js"></script>
</body>
</html>
