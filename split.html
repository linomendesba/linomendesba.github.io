    <style>
      .ligas-container { display: flex; flex-direction: column; gap: 22px; margin: 18px 0 60px; }
      .liga-card {
        border: 1px solid rgba(255,255,255,0.10);
        border-radius: 10px;
        overflow: hidden;
        background: rgba(255,255,255,0.02);
      }
      .liga-card-iframe { width: 100%; border: none; display: block; }
      .liga-card-titulo {
        display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
        padding: 12px 16px;
        border-bottom: 1px solid rgba(255,255,255,0.10);
        background: rgba(255,255,255,0.04);
        border-left: 4px solid #f5b800;
      }
      .liga-card-titulo .liga-nome { font-size: 1.1rem; font-weight: 500; color: #fff; }
      .liga-card-titulo .liga-casa { font-size: 0.85rem; opacity: 0.65; }
      .liga-card-titulo .liga-acoes { margin-left: auto; display: flex; gap: 6px; }
      .liga-btn {
        background: rgba(255,255,255,0.08); color: #fff; cursor: pointer;
        border: 1px solid rgba(255,255,255,0.15); border-radius: 6px;
        padding: 4px 10px; font-size: 0.85rem;
      }
      .liga-btn:hover { background: rgba(255,255,255,0.16); }
      .liga-btn.ativo { background: #1fac89; border-color: #1fac89; }
      .liga-erro {
        display: none; margin: 10px 14px; padding: 10px 12px; border-radius: 6px;
        background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.5);
        color: #fecaca; font-size: 0.85rem; word-break: break-all;
      }
      .liga-card.recolhido .liga-card-corpo { display: none; }
      .liga-card.recolhido .liga-card-titulo { border-bottom: none; }

      .seletor-casa select { min-width: 200px; }

      /* ── Seletor de ligas ── */
      .seletor-ligas { position: relative; display: inline-block; }
      .btn-ligas {
        cursor: pointer; white-space: nowrap; color: #fff;
        background: rgba(255,255,255,0.08);
        border: 1px solid rgba(255,255,255,0.2); border-radius: 6px;
        padding: 7px 14px; font-size: 0.95rem;
      }
      .btn-ligas:hover { background: rgba(255,255,255,0.16); }
      .btn-ligas .cont-ligas { margin-left: 6px; color: #4ade80; font-weight: 600; }
      .painel-ligas {
        position: absolute; top: 42px; left: 0; z-index: 60; width: 280px;
        background: #0f1420; border: 1px solid #374151; border-radius: 8px;
        padding: 10px; box-shadow: 0 8px 24px rgba(0,0,0,0.45);
      }
      .painel-ligas-acoes { display: flex; gap: 6px; margin-bottom: 8px; }
      .painel-ligas-acoes button {
        flex: 1; cursor: pointer; color: #fff; font-size: 0.8rem;
        background: rgba(255,255,255,0.08);
        border: 1px solid rgba(255,255,255,0.15); border-radius: 6px; padding: 5px 8px;
      }
      .painel-ligas-lista { max-height: 320px; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
      .painel-ligas-lista label {
        display: flex; align-items: center; gap: 8px; padding: 6px 8px;
        border-radius: 6px; cursor: pointer; color: #e5e7eb; font-size: 0.9rem;
      }
      .painel-ligas-lista label:hover { background: rgba(255,255,255,0.07); }
      .ligas-vazio { padding: 40px 16px; text-align: center; opacity: 0.7; }
    </style>

    <!-- Carrega config.js e ligas-config.js para usar LIGAS_INFO -->
    <script src="config.js"></script>
    <script src="ligas-config.js"></script>
  </head>

  <body>

    <div id="header"></div>

    <br><br>

    <div id="errorMessage" class="error-message" style="display: none;"></div>

    <div class="seletor-container">
      <div class="seletor-casa">
        <select id="seletorCasa"></select>
      </div>

      <div class="seletor-ligas">
        <button type="button" id="btnLigas" class="btn-ligas">
          Ligas<span id="contLigas" class="cont-ligas"></span>
        </button>
        <div id="painelLigas" class="painel-ligas" style="display:none;">
          <div class="painel-ligas-acoes">
            <button type="button" id="ligasTodas">Marcar todas</button>
            <button type="button" id="ligasNenhuma">Limpar</button>
          </div>
          <div id="listaLigas" class="painel-ligas-lista"></div>
        </div>
      </div>
    </div>

    <div id="ligasContainer" class="ligas-container"></div>

    <script>
      // ── Nomes bonitos e ordem das casas ──────────────────────────────
      // Casas novas que não estiverem aqui entram automaticamente no fim
      // da lista, com o nome capitalizado.
      const CASAS_ORDEM = [
        "BET365", "BETANO", "ESTRELABET", "BETSSON",
        "KIRON", "VAVADA", "1WIN", "BETGREEN", "MGM",
      ];
      const CASAS_NOMES = {
        BET365: "Bet365",
        BETANO: "Betano",
        ESTRELABET: "EstrelaBet",
        BETSSON: "Betsson",
        KIRON: "Kiron",
        VAVADA: "Vavada",
        "1WIN": "1win",
        BETGREEN: "BetGreen",
        MGM: "MGM",
      };

      // ── Configuração salva (tudo que o usuário ajusta nesta página) ──
      //  casa       : última casa escolhida
      //  ligas      : { casaKey: [res das ligas marcadas] }  (ausente = todas)
      //  recolhidos : { "casaKey|res": true }                (cards fechados)
      //  scroll     : última posição da página
      const CFG_KEY = "multligas_config_v2";
      const CASA_STORAGE_KEY = "multligas_casaSelecionada"; // chave antiga, só leitura (migração)

      function lerCfg() {
        try {
          const c = JSON.parse(localStorage.getItem(CFG_KEY) || "{}");
          return c && typeof c === "object" ? c : {};
        } catch (e) { return {}; }
      }
      const CFG = lerCfg();
      CFG.ligas = CFG.ligas || {};
      CFG.recolhidos = CFG.recolhidos || {};
      CFG.graficos = CFG.graficos || {}; // { "casaKey|res": true } = gráfico de mercado aberto
      function salvarCfg() {
        try { localStorage.setItem(CFG_KEY, JSON.stringify(CFG)); } catch (e) {}
      }

      function nomeBonitoCasa(casa) {
        return CASAS_NOMES[casa] ||
          casa.charAt(0).toUpperCase() + casa.slice(1).toLowerCase();
      }

      // Agrupa LIGAS_INFO por casa, mantendo a ordem de CASAS_ORDEM
      function construirCasas(ligasInfo) {
        const porCasa = {};
        Object.entries(ligasInfo).forEach(([chave, liga]) => {
          if (!liga || !liga.casa) return;
          (porCasa[liga.casa] = porCasa[liga.casa] || []).push({
            label: liga.nomeExibicao,
            nome: chave,
            res: chave, // nome cru da liga; a URL do iframe codifica uma única vez
          });
        });

        const ordenadas = [
          ...CASAS_ORDEM.filter((c) => porCasa[c]),
          ...Object.keys(porCasa).filter((c) => !CASAS_ORDEM.includes(c)),
        ];

        const casas = {};
        ordenadas.forEach((casa) => {
          casas[casa.toLowerCase()] = {
            label: nomeBonitoCasa(casa),
            ligas: porCasa[casa],
          };
        });
        return casas;
      }

      const CASAS = construirCasas(LIGAS_INFO);

      // Casa padrão pelo nome do arquivo: estrelamult.html -> estrelabet,
      // multbetano.html -> betano
      function casaPeloArquivo() {
        const nome = (window.location.pathname.split("/").pop() || "")
          .toLowerCase()
          .replace(/\.html$/, "")
          .replace("mult", "");
        if (!nome) return null;
        return Object.keys(CASAS).find(
          (k) => k.startsWith(nome) || nome.startsWith(k)
        ) || null;
      }

      // Prioridade: ?casa=  >  última escolha salva  >  nome do arquivo  >  primeira
      function casaInicial() {
        const param = (new URLSearchParams(window.location.search).get("casa") || "").toLowerCase();
        if (CASAS[param]) return param;

        if (CFG.casa && CASAS[CFG.casa]) return CFG.casa;

        let salva = null;
        try { salva = localStorage.getItem(CASA_STORAGE_KEY); } catch (e) {}
        if (salva && CASAS[salva]) return salva;

        return casaPeloArquivo() || Object.keys(CASAS)[0];
      }

      function popularSeletorCasa() {
        const sel = document.getElementById("seletorCasa");
        sel.innerHTML = "";
        Object.entries(CASAS).forEach(([key, c]) => {
          const opt = document.createElement("option");
          opt.value = key;
          opt.textContent = c.label;
          sel.appendChild(opt);
        });
        sel.value = casaInicial();
      }

      // ── Ligas selecionadas por casa ──────────────────────────────────
      function ligasSelecionadas(casaKey) {
        const casa = CASAS[casaKey];
        if (!casa) return [];
        const salvas = CFG.ligas[casaKey];
        if (!Array.isArray(salvas)) return casa.ligas.map((l) => l.res); // padrão: todas
        const validas = new Set(casa.ligas.map((l) => l.res));
        return salvas.filter((r) => validas.has(r));
      }

      function atualizarContador(casaKey) {
        const total = CASAS[casaKey] ? CASAS[casaKey].ligas.length : 0;
        const sel = ligasSelecionadas(casaKey).length;
        document.getElementById("contLigas").textContent = sel + "/" + total;
      }

      function renderPainelLigas(casaKey) {
        const lista = document.getElementById("listaLigas");
        lista.innerHTML = "";
        const casa = CASAS[casaKey];
        if (!casa) return;
        const marcadas = new Set(ligasSelecionadas(casaKey));

        casa.ligas.forEach((liga) => {
          const label = document.createElement("label");
          const cb = document.createElement("input");
          cb.type = "checkbox";
          cb.checked = marcadas.has(liga.res);
          cb.addEventListener("change", () => {
            const atual = new Set(ligasSelecionadas(casaKey));
            if (cb.checked) atual.add(liga.res); else atual.delete(liga.res);
            // mantém a ordem original da casa
            CFG.ligas[casaKey] = casa.ligas.map((l) => l.res).filter((r) => atual.has(r));
            salvarCfg();
            atualizarContador(casaKey);
            montarLigasDaCasa(casaKey);
          });
          const span = document.createElement("span");
          span.textContent = liga.label;
          label.appendChild(cb);
          label.appendChild(span);
          lista.appendChild(label);
        });
        atualizarContador(casaKey);
      }

      function definirTodas(casaKey, marcar) {
        const casa = CASAS[casaKey];
        if (!casa) return;
        CFG.ligas[casaKey] = marcar ? casa.ligas.map((l) => l.res) : [];
        salvarCfg();
        renderPainelLigas(casaKey);
        montarLigasDaCasa(casaKey);
      }

      // ── Altura dos iframes ───────────────────────────────────────────
      function medirAlturaConteudo(doc) {
        const body = doc.body;
        if (!body) return 0;
        const bodyTop = body.getBoundingClientRect().top;
        let maxBottom = 0;
        Array.from(body.children).forEach(el => {
          const rect = el.getBoundingClientRect();
          if (rect.bottom > maxBottom) maxBottom = rect.bottom;
        });
        return Math.ceil(maxBottom - bodyTop);
      }

      function ajustarAlturaIframe(iframe) {
        try {
          const doc = iframe.contentDocument || iframe.contentWindow.document;
          const altura = medirAlturaConteudo(doc);
          if (altura > 0) iframe.style.height = (altura + 24) + "px";
        } catch (e) {
          iframe.style.height = "900px";
        }
      }

      // Se o iframe abriu a página 404 do GitHub, mostra o endereço que falhou
      function checar404(iframe, banner) {
        try {
          const src = iframe.getAttribute("src") || "";
          if (!src || src === "about:blank") return;
          const doc = iframe.contentDocument;
          if (!doc || !doc.body) return;
          const texto = ((doc.title || "") + " " + (doc.body.innerText || "").slice(0, 300)).toLowerCase();
          const ehPaginaValida = doc.getElementById("tabelaResultados") || doc.getElementById("Copa");
          const erro = !ehPaginaValida && /file not found|page not found|404/.test(texto);
          banner.style.display = erro ? "block" : "none";
          if (erro) banner.textContent = "⚠ Arquivo não encontrado (404): " + new URL(src, location.href).href;
        } catch (e) {}
      }

      const _timersAltura = new WeakMap();
      function agendarAjusteAltura(iframe) {
        clearTimeout(_timersAltura.get(iframe));
        _timersAltura.set(iframe, setTimeout(() => ajustarAlturaIframe(iframe), 150));
      }

      function observarIframe(iframe) {
        try {
          const doc = iframe.contentDocument || iframe.contentWindow.document;
          const obs = new MutationObserver(() => agendarAjusteAltura(iframe));
          obs.observe(doc.body, { childList: true, subtree: true, attributes: true });
        } catch (e) {}
      }

      // Carrega os iframes escalonados (um a cada ATRASO_ENTRE_IFRAMES_MS)
      // pra não disparar todas as chamadas à API ao mesmo tempo.
      const ATRASO_ENTRE_IFRAMES_MS = 1500;
      let _montagemId = 0;

      function montarLigasDaCasa(casaKey) {
        const idMontagem = ++_montagemId; // invalida montagens anteriores
        const cont = document.getElementById("ligasContainer");
        cont.innerHTML = "";
        const casa = CASAS[casaKey];
        if (!casa) return;

        const marcadas = new Set(ligasSelecionadas(casaKey));
        const ligas = casa.ligas.filter((l) => marcadas.has(l.res));

        if (!ligas.length) {
          const vazio = document.createElement("div");
          vazio.className = "ligas-vazio";
          vazio.textContent = "Nenhuma liga selecionada. Use o botão \"Ligas\" para escolher.";
          cont.appendChild(vazio);
          return;
        }

        let posicaoFila = 0; // só conta os cards que realmente vão carregar

        ligas.forEach((liga) => {
          const chaveRecolhido = casaKey + "|" + liga.res;

          const card = document.createElement("div");
          card.className = "liga-card";

          const titulo = document.createElement("div");
          titulo.className = "liga-card-titulo";
          const spanNome = document.createElement("span");
          spanNome.className = "liga-nome";
          spanNome.textContent = liga.label;
          const spanCasa = document.createElement("span");
          spanCasa.className = "liga-casa";
          spanCasa.textContent = liga.nome;
          const acoes = document.createElement("div");
          acoes.className = "liga-acoes";
          const btnRecolher = document.createElement("button");
          btnRecolher.type = "button";
          btnRecolher.className = "liga-btn";
          acoes.appendChild(btnRecolher);
          titulo.appendChild(spanNome);
          titulo.appendChild(spanCasa);
          titulo.appendChild(acoes);
          card.appendChild(titulo);

          const corpo = document.createElement("div");
          corpo.className = "liga-card-corpo";

          const bannerTab = document.createElement("div");
          bannerTab.className = "liga-erro";
          corpo.appendChild(bannerTab);
          const iframe = document.createElement("iframe");
          iframe.className = "liga-card-iframe";
          iframe.scrolling = "no";
          iframe.style.height = "400px";
          iframe.addEventListener("load", () => {
            checar404(iframe, bannerTab);
            ajustarAlturaIframe(iframe);
            observarIframe(iframe);
          });
          corpo.appendChild(iframe);
          card.appendChild(corpo);
          cont.appendChild(card);

          const urlIframe = `mult-liga-tabela.html?casa=${encodeURIComponent(casaKey)}`
                          + `&res=${encodeURIComponent(liga.res)}`
                          + `&label=${encodeURIComponent(liga.label)}`;

          function carregar(atraso) {
            if (iframe.getAttribute("src")) return; // já carregado
            setTimeout(() => {
              if (idMontagem !== _montagemId) return; // usuário trocou de casa/ligas
              if (!iframe.getAttribute("src")) iframe.src = urlIframe;
            }, atraso);
          }

          function aplicarRecolhido(recolhido) {
            card.classList.toggle("recolhido", recolhido);
            btnRecolher.textContent = recolhido ? "▸ Abrir" : "▾ Recolher";
            btnRecolher.title = recolhido ? "Mostrar esta liga" : "Esconder o conteúdo desta liga";
          }

          const recolhidoInicial = !!CFG.recolhidos[chaveRecolhido];
          aplicarRecolhido(recolhidoInicial);

          btnRecolher.addEventListener("click", () => {
            const novo = !card.classList.contains("recolhido");
            aplicarRecolhido(novo);
            if (novo) CFG.recolhidos[chaveRecolhido] = true;
            else delete CFG.recolhidos[chaveRecolhido];
            salvarCfg();
            if (!novo) {
              carregar(0); // carrega sob demanda se ainda não tinha carregado
              setTimeout(() => ajustarAlturaIframe(iframe), 100);
            }
          });

          // Cards recolhidos não carregam (economiza chamadas à API)
          if (!recolhidoInicial) {
            carregar(posicaoFila * ATRASO_ENTRE_IFRAMES_MS);
            posicaoFila++;
          }
        });
      }

      function ajustarTodasAlturas() {
        document.querySelectorAll(".liga-card:not(.recolhido) .liga-card-iframe").forEach(ajustarAlturaIframe);
      }
      setInterval(ajustarTodasAlturas, 6000);

      // ── Inicialização ────────────────────────────────────────────────
      popularSeletorCasa();
      const seletorCasaEl = document.getElementById("seletorCasa");
      const casaAtual = () => seletorCasaEl.value;

      CFG.casa = casaAtual();
      salvarCfg();
      renderPainelLigas(casaAtual());
      montarLigasDaCasa(casaAtual());

      seletorCasaEl.addEventListener("change", () => {
        CFG.casa = casaAtual();
        salvarCfg();
        renderPainelLigas(casaAtual());
        montarLigasDaCasa(casaAtual());
      });

      // Painel "Ligas"
      const painelEl = document.getElementById("painelLigas");
      document.getElementById("btnLigas").addEventListener("click", (e) => {
        e.stopPropagation();
        painelEl.style.display = painelEl.style.display === "none" ? "block" : "none";
      });
      painelEl.addEventListener("click", (e) => e.stopPropagation());
      document.addEventListener("click", () => { painelEl.style.display = "none"; });
      document.getElementById("ligasTodas").addEventListener("click", () => definirTodas(casaAtual(), true));
      document.getElementById("ligasNenhuma").addEventListener("click", () => definirTodas(casaAtual(), false));

      // Posição da rolagem: salva ao rolar e restaura ao voltar
      // (só restaura se o usuário ainda não rolou manualmente)
      let _usuarioRolou = false;
      ["wheel", "touchstart", "keydown", "mousedown"].forEach((ev) =>
        window.addEventListener(ev, () => { _usuarioRolou = true; }, { passive: true })
      );
      let _timerScroll = null;
      window.addEventListener("scroll", () => {
        clearTimeout(_timerScroll);
        _timerScroll = setTimeout(() => {
          CFG.scroll = Math.round(window.scrollY);
          salvarCfg();
        }, 300);
      }, { passive: true });
      [1200, 3500, 6500].forEach((ms) =>
        setTimeout(() => {
          if (!_usuarioRolou && CFG.scroll > 0) window.scrollTo(0, CFG.scroll);
        }, ms)
      );
    </script>
      <script>
  fetch('header.html').then(r=>r.text()).then(d=>{document.getElementById('header').innerHTML=d;});
</script>
