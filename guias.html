<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>BetStat | Vídeo Aulas</title>
    <link rel="icon" href="img/favicon.ico" type="image/x-icon" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script type="module" src="js/firebase-auth.js"></script>
    <style>
      /* ============================================================
         TOKENS — mesmo sistema de cores/tipografia da home
      ============================================================ */
      :root {
        --bg: #111318;
        --bg-elevated: #15181f;
        --surface: #181c23;
        --surface-hover: #1e232d;
        --border: rgba(148, 163, 184, 0.12);
        --border-strong: rgba(148, 163, 184, 0.26);

        --accent: #177b8e;
        --accent-dim: rgba(23, 123, 142, 0.14);
        --accent-line: rgba(23, 123, 142, 0.55);

        --live: #f4f5f7;
        --live-dim: rgba(255, 255, 255, 0.08);

        --neutral: #eef0f4;
        --neutral-dim: rgba(255, 255, 255, 0.08);
        --neutral-line: rgba(255, 255, 255, 0.22);

        --danger: #e74c3c;

        --text: #e4e8f0;
        --text-secondary: #7a8499;
        --text-tertiary: #4a5164;

        --font-display: "Space Grotesk", sans-serif;
        --font-mono: "IBM Plex Mono", monospace;

        --radius: 10px;
        --max-w: 1080px;
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }

      html { color-scheme: dark; scroll-behavior: smooth; }

      body {
        font-family: var(--font-display);
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        padding: 64px 20px 48px;
        overflow-x: hidden;
        position: relative;
      }

      /* fundo ambiente — grid sutil + glow, estático (sem partículas) */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
        background-size: 44px 44px;
        mask-image: radial-gradient(ellipse 70% 60% at 50% 0%, black, transparent 75%);
        pointer-events: none;
        z-index: 0;
      }
      body::after {
        content: "";
        position: fixed;
        top: -10%;
        left: 50%;
        transform: translateX(-50%);
        width: 720px;
        height: 420px;
        background: radial-gradient(ellipse, rgba(255, 255, 255, 0.05) 0%, transparent 70%);
        pointer-events: none;
        z-index: 0;
      }

      .container {
        max-width: var(--max-w);
        width: 100%;
        margin: 0 auto;
        position: relative;
        z-index: 1;
      }

      /* ============================================================
         SAIR
      ============================================================ */
      .logout-btn {
        position: fixed;
        top: 18px;
        right: 18px;
        display: flex;
        align-items: center;
        gap: 7px;
        background: var(--bg-elevated);
        color: var(--text-tertiary);
        border: 1px solid var(--border);
        padding: 8px 14px;
        border-radius: 7px;
        cursor: pointer;
        font-family: var(--font-mono);
        font-size: 0.72rem;
        font-weight: 500;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        transition: color 0.18s ease, border-color 0.18s ease, background 0.18s ease;
        z-index: 1000;
      }
      .logout-btn:hover {
        color: var(--danger);
        border-color: rgba(226, 87, 76, 0.4);
        background: rgba(226, 87, 76, 0.08);
      }
      .logout-btn svg { flex-shrink: 0; }

      /* ============================================================
         HEADER
      ============================================================ */
      .header { margin-bottom: 34px; animation: rise 0.5s ease both; }

      .brand-row {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 22px;
      }
      .brand-row img { height: 50px; width: auto; }
      .brand-row .divider-dot {
        width: 4px; height: 4px;
        border-radius: 50%;
        background: var(--text-tertiary);
      }
      .brand-tag {
        font-family: var(--font-mono);
        font-size: 0.72rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--text-secondary);
      }

      .header-title {
        font-size: clamp(1.6rem, 5vw, 2.15rem);
        font-weight: 600;
        letter-spacing: -0.01em;
        line-height: 1.15;
        margin-bottom: 8px;
      }
      .header-title span { color: var(--accent); }

      .header-sub {
        font-size: 0.92rem;
        color: var(--text-secondary);
        margin-bottom: 22px;
        max-width: 56ch;
      }

      .status-readout {
        display: flex;
        align-items: center;
        gap: 12px;
        border: 1px solid var(--border);
        background: var(--bg-elevated);
        border-radius: 8px;
        padding: 10px 14px;
        font-family: var(--font-mono);
        font-size: 0.74rem;
        color: var(--text-secondary);
        position: relative;
        overflow: hidden;
        width: fit-content;
      }
      .status-readout::after {
        content: "";
        position: absolute;
        top: 0; left: -30%;
        width: 30%; height: 100%;
        background: linear-gradient(90deg, transparent, rgba(23, 123, 142, 0.14), transparent);
        animation: scan 6s ease-in-out infinite;
      }
      .status-live {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        color: var(--accent);
        font-weight: 500;
      }
      .status-live::before {
        content: "";
        width: 6px; height: 6px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 6px var(--accent);
        animation: pulse 2s infinite;
      }
      .status-sep { color: var(--text-tertiary); }
      .status-count { color: var(--text); }

      /* ============================================================
         LABELS DE SEÇÃO
      ============================================================ */
      .section-label {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 30px 0 14px;
        font-family: var(--font-mono);
        font-size: 0.68rem;
        font-weight: 500;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--text-secondary);
      }
      .section-label::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--border);
      }

      /* ============================================================
         AVISO DE EXTENSÃO — mesmo padrão do chrome-recommend da home
      ============================================================ */
      .ext-notice {
        border: 1px solid var(--border);
        background: var(--bg-elevated);
        border-radius: var(--radius);
        padding: 16px 18px;
        animation: rise 0.5s ease 0.05s both;
      }
      .ext-notice-title {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 0.86rem;
        font-weight: 600;
        color: var(--text);
        margin-bottom: 10px;
      }
      .ext-notice-title svg { color: var(--accent); flex-shrink: 0; }
      .ext-notice p {
        font-size: 0.84rem;
        color: var(--text-secondary);
        line-height: 1.7;
      }
      .ext-link {
        color: var(--accent);
        text-decoration: none;
        font-weight: 500;
        border-bottom: 1px solid var(--accent-line);
      }
      .ext-link:hover { color: var(--neutral); border-color: var(--neutral-line); }
      .ext-steps {
        list-style: none;
        margin-top: 12px;
        display: grid;
        gap: 0;
      }
      .ext-steps li {
        display: flex;
        align-items: flex-start;
        gap: 11px;
        padding: 8px 0;
        border-bottom: 1px solid var(--border);
        color: var(--text-secondary);
        font-size: 0.84rem;
        line-height: 1.6;
      }
      .ext-steps li:last-child { border-bottom: none; }
      .ext-steps li strong { color: var(--text); font-weight: 600; }
      .ext-step-num {
        width: 20px; height: 20px;
        border-radius: 50%;
        background: var(--accent-dim);
        border: 1px solid var(--accent-line);
        color: var(--accent);
        font-family: var(--font-mono);
        font-size: 0.66rem;
        font-weight: 600;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        margin-top: 1px;
      }
      .ext-warn {
        margin-top: 14px;
        padding-top: 14px;
        border-top: 1px solid var(--border);
        font-size: 0.8rem;
        color: var(--text-tertiary);
        line-height: 1.7;
      }
      .ext-warn strong { color: var(--text-secondary); }

      /* ============================================================
         GRID DE VÍDEOS
      ============================================================ */
      .video-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 14px;
        margin-top: 4px;
        animation: rise 0.5s ease 0.1s both;
      }
      .video-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        overflow: hidden;
        cursor: pointer;
        transition: border-color 0.18s ease, background 0.18s ease, transform 0.18s ease;
        -webkit-tap-highlight-color: transparent;
      }
      .video-card:hover,
      .video-card:focus-visible {
        border-color: var(--accent-line);
        background: var(--surface-hover);
        transform: translateY(-2px);
        outline: none;
      }
      .video-thumb {
        position: relative;
        width: 100%;
        aspect-ratio: 16/9;
        background: var(--bg-elevated);
        overflow: hidden;
      }
      .video-thumb img {
        width: 100%; height: 100%;
        object-fit: cover;
        display: block;
        transition: transform 0.3s ease;
      }
      .video-card:hover .video-thumb img { transform: scale(1.03); }
      .video-play-overlay {
        position: absolute; inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(17, 19, 24, 0.35);
        transition: background 0.18s ease;
      }
      .video-card:hover .video-play-overlay { background: rgba(17, 19, 24, 0.15); }
      .video-play-btn {
        width: 44px; height: 44px;
        background: var(--accent);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-size: 0.95rem;
        box-shadow: 0 4px 20px rgba(23, 123, 142, 0.4);
        transition: transform 0.18s ease, opacity 0.18s ease;
      }
      .video-card:hover .video-play-btn { transform: scale(1.08); }
      .video-info { padding: 13px 14px; }
      .video-title {
        font-size: 0.86rem;
        font-weight: 600;
        color: var(--text);
        line-height: 1.4;
      }

      /* ============================================================
         MATERIAIS COMPLEMENTARES
      ============================================================ */
      .material-list {
        display: grid;
        gap: 10px;
        margin-top: 4px;
        animation: rise 0.5s ease 0.12s both;
      }
      .material-card {
        display: flex;
        align-items: center;
        gap: 14px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 14px 16px;
        transition: border-color 0.18s ease, background 0.18s ease;
      }
      .material-card:hover {
        border-color: var(--accent-line);
        background: var(--surface-hover);
      }
      .material-icon {
        flex-shrink: 0;
        width: 40px; height: 40px;
        border-radius: 8px;
        background: var(--accent-dim);
        border: 1px solid var(--accent-line);
        color: var(--accent);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .material-info { flex: 1; min-width: 0; }
      .material-title {
        font-size: 0.88rem;
        font-weight: 600;
        color: var(--text);
        line-height: 1.4;
      }
      .material-desc {
        font-size: 0.78rem;
        color: var(--text-secondary);
        margin-top: 2px;
        line-height: 1.5;
      }
      .material-meta {
        font-family: var(--font-mono);
        font-size: 0.68rem;
        letter-spacing: 0.04em;
        color: var(--text-tertiary);
        text-transform: uppercase;
        margin-top: 4px;
      }
      .material-download {
        flex-shrink: 0;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 8px 14px;
        border-radius: 7px;
        border: 1px solid var(--border-strong);
        color: var(--text);
        background: var(--bg-elevated);
        font-size: 0.78rem;
        font-weight: 500;
        text-decoration: none;
        transition: background 0.16s ease, border-color 0.16s ease, color 0.16s ease;
      }
      .material-download:hover {
        border-color: var(--accent-line);
        color: var(--accent);
      }
      .material-empty {
        font-size: 0.82rem;
        color: var(--text-tertiary);
        padding: 10px 2px;
      }

      /* ============================================================
         MODAL DE VÍDEO
      ============================================================ */
      .video-modal-backdrop {
        display: none;
        position: fixed; inset: 0;
        background: rgba(9, 10, 13, 0.88);
        z-index: 9000;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .video-modal-backdrop.open { display: flex; }
      .video-modal {
        background: var(--bg-elevated);
        border: 1px solid var(--border-strong);
        border-radius: 14px;
        width: 100%;
        max-width: 800px;
        overflow: hidden;
        position: relative;
      }
      .video-modal-close {
        position: absolute;
        top: 10px; right: 10px;
        width: 32px; height: 32px;
        background: rgba(9, 10, 13, 0.6);
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text-secondary);
        font-size: 0.85rem;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 10;
        transition: background 0.18s ease, color 0.18s ease;
      }
      .video-modal-close:hover { background: rgba(226, 87, 76, 0.75); color: #fff; }
      .video-modal-frame { width: 100%; aspect-ratio: 16/9; }
      .video-modal-frame iframe { width: 100%; height: 100%; border: none; display: block; }
      .video-modal-info { padding: 16px 20px; }
      .video-modal-info .vm-title { font-size: 0.95rem; font-weight: 600; color: var(--text); margin-bottom: 3px; }
      .video-modal-info .vm-desc { font-size: 0.82rem; color: var(--text-secondary); line-height: 1.6; }

      /* ============================================================
         RODAPÉ
      ============================================================ */
      .footer {
        display: flex;
        gap: 10px;
        margin-top: 40px;
        animation: rise 0.5s ease 0.2s both;
      }
      .footer-link {
        flex: 1;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        padding: 11px 18px;
        border-radius: 8px;
        font-size: 0.8rem;
        font-weight: 500;
        text-decoration: none;
        border: 1px solid var(--border);
        color: var(--text-secondary);
        background: var(--bg-elevated);
        transition: background 0.16s ease, border-color 0.16s ease, color 0.16s ease;
      }
      .footer-link:hover { color: var(--text); border-color: var(--border-strong); }

      /* ============================================================
         ANIMAÇÕES
      ============================================================ */
      @keyframes rise {
        from { opacity: 0; transform: translateY(10px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
      @keyframes scan { 0% { left: -30%; } 100% { left: 130%; } }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation: none !important; transition: none !important; }
      }

      /* ============================================================
         RESPONSIVO
      ============================================================ */
      @media (max-width: 600px) {
        body { padding: 56px 14px 36px; }
        .video-grid { grid-template-columns: repeat(auto-fill, minmax(46%, 1fr)); gap: 10px; }
        .footer { flex-direction: column; }
      }
    </style>
  </head>
  <body>
    <button class="logout-btn" onclick="logout()">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
        <polyline points="16 17 21 12 16 7" />
        <line x1="21" y1="12" x2="9" y2="12" />
      </svg>
      Sair
    </button>

    <div class="container">

      <div class="header">
        <div class="brand-row">
          <img src="img/logo.png" alt="BetStat" />
          <span class="divider-dot"></span>
          <span class="brand-tag">Plataforma</span>
        </div>

        <h1 class="header-title">Vídeo <span>aulas</span></h1>
        <p class="header-sub">Tutoriais em vídeo para aprender a usar cada ferramenta do BetStat na prática.</p>

        <div class="status-readout">
          <span class="status-live">Conteúdo atualizado</span>
          <span class="status-sep">·</span>
          <span class="status-count" id="videoCount">8 vídeos disponíveis</span>
        </div>
      </div>

      <div class="section-label">Tutoriais</div>

      <div class="video-grid" id="videoGrid"></div>

      <div class="section-label">Materiais complementares</div>

      <div class="material-list" id="materialList"></div>

      <div class="footer">
        <a href="https://t.me/Betstatsite" class="footer-link" target="_blank" rel="noopener noreferrer">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          </svg>
          Suporte
        </a>
        <a href="index.html" class="footer-link" rel="noopener noreferrer">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>
          </svg>
          Voltar
        </a>
      </div>

    </div>

    <!-- MODAL DE VÍDEO -->
    <div class="video-modal-backdrop" id="videoModalBackdrop" onclick="closeVideoOnBackdrop(event)">
      <div class="video-modal">
        <button class="video-modal-close" onclick="closeVideo()">✕</button>
        <div class="video-modal-frame">
          <iframe id="videoModalFrame" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>
        <div class="video-modal-info">
          <div class="vm-title" id="videoModalTitle"></div>
          <div class="vm-desc" id="videoModalDesc"></div>
        </div>
      </div>
    </div>

    <script>
      function logout() {
        if (typeof firebase !== 'undefined' && firebase.auth) {
          firebase.auth().signOut().then(() => { window.location.href = 'index.html'; });
        } else {
          window.location.href = 'index.html';
        }
      }

      function openVideo(youtubeId, title, desc, start) {
        var src = 'https://www.youtube.com/embed/' + youtubeId + '?autoplay=1&rel=0';
        if (start) src += '&start=' + start;
        document.getElementById('videoModalFrame').src = src;
        document.getElementById('videoModalTitle').textContent = title;
        document.getElementById('videoModalDesc').textContent = desc;
        document.getElementById('videoModalBackdrop').classList.add('open');
        document.body.style.overflow = 'hidden';
      }

      function closeVideo() {
        document.getElementById('videoModalBackdrop').classList.remove('open');
        document.getElementById('videoModalFrame').src = '';
        document.body.style.overflow = '';
      }

      function closeVideoOnBackdrop(e) {
        if (e.target === document.getElementById('videoModalBackdrop')) closeVideo();
      }

      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') closeVideo();
      });

      // ============================================================
      // CARREGAMENTO DOS VÍDEOS A PARTIR DE videos.json
      // Para adicionar um vídeo novo: edite apenas o arquivo videos.json
      // (não precisa mexer neste HTML).
      // ============================================================

      // Extrai o ID do vídeo e o tempo de início (se houver) de qualquer
      // formato de link do YouTube: youtu.be/ID, watch?v=ID, embed/ID,
      // com ou sem ?t=90 / &start=90 no final.
      function parseYoutubeLink(link) {
        var idMatch = link.match(/(?:youtu\.be\/|v=|embed\/)([A-Za-z0-9_-]{11})/);
        var id = idMatch ? idMatch[1] : null;
        var startMatch = link.match(/[?&](?:t|start)=(\d+)/);
        var start = startMatch ? parseInt(startMatch[1], 10) : null;
        return { id: id, start: start };
      }

      function renderVideoCard(video) {
        var parsed = parseYoutubeLink(video.link || '');
        if (!parsed.id) {
          console.warn('Link inválido em videos.json, pulando:', video);
          return null;
        }
        var card = document.createElement('div');
        card.className = 'video-card';
        card.tabIndex = 0;
        var title = video.titulo || '';
        var desc = video.descricao || '';
        card.onclick = function () { openVideo(parsed.id, title, desc, parsed.start); };
        card.onkeydown = function (e) { if (e.key === 'Enter' || e.key === ' ') card.onclick(); };

        var thumb = document.createElement('div');
        thumb.className = 'video-thumb';
        var img = document.createElement('img');
        img.src = 'https://i.ytimg.com/vi/' + parsed.id + '/mqdefault.jpg';
        img.alt = title;
        img.loading = 'lazy';
        var overlay = document.createElement('div');
        overlay.className = 'video-play-overlay';
        overlay.innerHTML = '<div class="video-play-btn">▶</div>';
        thumb.appendChild(img);
        thumb.appendChild(overlay);

        var info = document.createElement('div');
        info.className = 'video-info';
        var titleEl = document.createElement('div');
        titleEl.className = 'video-title';
        titleEl.textContent = title;
        info.appendChild(titleEl);

        card.appendChild(thumb);
        card.appendChild(info);
        return card;
      }

      function loadVideos() {
        var grid = document.getElementById('videoGrid');
        fetch('videos.json?_=' + Date.now())
          .then(function (res) { return res.json(); })
          .then(function (videos) {
            grid.innerHTML = '';
            videos.forEach(function (video) {
              var card = renderVideoCard(video);
              if (card) grid.appendChild(card);
            });
            var count = grid.querySelectorAll('.video-card').length;
            document.getElementById('videoCount').textContent =
              count + (count === 1 ? ' vídeo disponível' : ' vídeos disponíveis');
          })
          .catch(function (err) {
            console.error('Erro ao carregar videos.json:', err);
            document.getElementById('videoCount').textContent = 'Erro ao carregar vídeos';
          });
      }

      loadVideos();

      // ============================================================
      // CARREGAMENTO DOS MATERIAIS A PARTIR DE materiais.json
      // Para adicionar um material novo: edite apenas o arquivo
      // materiais.json (não precisa mexer neste HTML). O "link" pode
      // apontar para um PDF hospedado no seu servidor (ex: "materiais/guia.pdf")
      // ou qualquer URL de arquivo para download.
      // ============================================================

      var FILE_ICONS = {
        pdf: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>',
        default: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>'
      };

      function fileExtension(link) {
        var clean = (link || '').split('?')[0].split('#')[0];
        var match = clean.match(/\.([a-zA-Z0-9]+)$/);
        return match ? match[1].toLowerCase() : '';
      }

      function renderMaterialCard(material) {
        if (!material.link) return null;
        var ext = fileExtension(material.link);
        var icon = FILE_ICONS[ext] || FILE_ICONS.default;

        var card = document.createElement('div');
        card.className = 'material-card';

        var iconEl = document.createElement('div');
        iconEl.className = 'material-icon';
        iconEl.innerHTML = icon;

        var info = document.createElement('div');
        info.className = 'material-info';
        var titleEl = document.createElement('div');
        titleEl.className = 'material-title';
        titleEl.textContent = material.titulo || 'Material';
        info.appendChild(titleEl);

        if (material.descricao) {
          var descEl = document.createElement('div');
          descEl.className = 'material-desc';
          descEl.textContent = material.descricao;
          info.appendChild(descEl);
        }

        var metaEl = document.createElement('div');
        metaEl.className = 'material-meta';
        metaEl.textContent = ext ? ext : 'arquivo';
        info.appendChild(metaEl);

        var downloadLink = document.createElement('a');
        downloadLink.className = 'material-download';
        downloadLink.href = material.link;
        downloadLink.target = '_blank';
        downloadLink.rel = 'noopener';
        downloadLink.setAttribute('download', '');
        downloadLink.innerHTML =
          '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Baixar';

        card.appendChild(iconEl);
        card.appendChild(info);
        card.appendChild(downloadLink);
        return card;
      }

      function loadMaterials() {
        var list = document.getElementById('materialList');
        fetch('materiais.json?_=' + Date.now())
          .then(function (res) { return res.json(); })
          .then(function (materiais) {
            list.innerHTML = '';
            if (!materiais.length) {
              list.innerHTML = '<div class="material-empty">Nenhum material disponível no momento.</div>';
              return;
            }
            materiais.forEach(function (material) {
              var card = renderMaterialCard(material);
              if (card) list.appendChild(card);
            });
          })
          .catch(function (err) {
            console.error('Erro ao carregar materiais.json:', err);
            list.innerHTML = '<div class="material-empty">Erro ao carregar materiais.</div>';
          });
      }

      loadMaterials();
    </script>

    <script src="redirecionar.js"></script>
  </body>
</html>
