<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="img/favicon.ico" type="image/x-icon" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-4WT805FFHQ"></script>

  <meta name="description" content="BetStat Morfeus — análise de mercados por hora em futebol virtual." />
  <meta name="keywords" content="BetStat, análise de mercados, futebol virtual, estatísticas apostas" />

  <meta property="og:description" content="Análise de mercados por hora em futebol virtual." />

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg-primary: #111318;
      --bg-secondary: #181c23;
      --bg-card: #1e232d;
      --bg-card-hover: #242a36;
      --bg-top: #0d1c1f;
      --border: #2a3040;
      --border-accent: #1a4750;
      --accent: #177b8e;
      --accent-dim: #115c6b;
      --accent-muted: rgba(23, 123, 142, 0.14);
      --text-primary: #e4e8f0;
      --text-secondary: #7a8499;
      --text-accent: #177b8e;
      --green: #2ecc71;
      --red: #e74c3c;
      --orange: #e6a817;
      --red-bg: #1a0d0d;
      --green-bg: #0a1f16;
      --odd-color: #e6a817;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: "DM Sans", sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    #header { position: sticky; top: 0; z-index: 100; }

    .page-wrapper {
      max-width: 1600px;
      margin: 0 auto;
      padding: 28px 24px 60px;
    }

    .section-title {
      font-size: 0.7rem;
      font-family: "DM Mono", monospace;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-accent);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    /* ── MODO TABS ── */
    .modo-tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }
    .modo-tab {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      font-family: "DM Sans", sans-serif;
      font-size: 0.8rem;
      font-weight: 500;
      padding: 9px 18px;
      border-radius: 8px;
      cursor: pointer;
      transition: all .15s;
    }
    .modo-tab:hover { border-color: var(--accent-dim); color: var(--text-primary); }
    .modo-tab.active {
      background: var(--accent-muted);
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 600;
    }

    /* ── FILTER SECTION ── */
    .filter-section {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px 24px;
      margin-bottom: 24px;
    }

    .filter-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin-bottom: 20px;
    }
    .filter-row:last-child { margin-bottom: 0; }

    .filter-group {
      display: flex;
      flex-direction: column;
    }

    .filter-label {
      font-size: 0.65rem;
      font-family: "DM Mono", monospace;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-accent);
      margin-bottom: 10px;
      font-weight: 600;
    }

    .btn-flex {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .btn-option {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      font-family: "DM Sans", sans-serif;
      font-size: 0.78rem;
      font-weight: 500;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      transition: all .15s;
      white-space: nowrap;
    }
    .btn-option:hover {
      border-color: var(--accent-dim);
      color: var(--text-primary);
    }
    .btn-option.active {
      background: var(--accent-muted);
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 600;
    }

    .divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 20px 0;
    }

    .actions-bar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn-action {
      flex: 1;
      min-width: 140px;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      font-family: "DM Sans", sans-serif;
      cursor: pointer;
      transition: all .15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-clear {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-secondary);
    }
    .btn-clear:hover {
      background: var(--bg-card-hover);
      border-color: var(--accent-dim);
      color: var(--text-primary);
    }

    .btn-generate {
      background: var(--accent);
      color: #fff;
      border: 1px solid var(--accent);
    }
    .btn-generate:hover {
      background: var(--accent-dim);
      border-color: var(--accent-dim);
    }
    .btn-generate:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .spinner {
      width: 12px;
      height: 12px;
      border: 2px solid rgba(23, 123, 142, 0.3);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: inline-block;
      flex-shrink: 0;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── RESULT SECTION ── */
    .result-container {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 24px;
    }

    .result-header {
      background: var(--accent-muted);
      border-bottom: 1px solid var(--border-accent);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .result-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
    }

    .result-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--accent);
      font-family: "DM Mono", monospace;
    }

    .liga-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 12px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-card);
    }

    .liga-tab {
      padding: 6px 14px;
      border-radius: 5px;
      font-size: 0.75rem;
      font-weight: 500;
      cursor: pointer;
      transition: all .15s;
      border: 1px solid var(--border);
      background: var(--bg-secondary);
      color: var(--text-secondary);
      font-family: "DM Sans", sans-serif;
    }
    .liga-tab:hover {
      color: var(--text-primary);
      border-color: var(--accent-dim);
    }
    .liga-tab.active {
      background: var(--accent-muted);
      color: var(--accent);
      border-color: var(--accent);
      font-weight: 600;
    }

    .liga-panel {
      display: none;
    }
    .liga-panel.active {
      display: block;
    }

    .result-body {
      padding: 24px;
    }

    .analysis-block {
      margin-bottom: 24px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border);
    }
    .analysis-block:last-child {
      margin-bottom: 0;
      padding-bottom: 0;
      border-bottom: none;
    }

    .block-title {
      font-size: 0.65rem;
      font-family: "DM Mono", monospace;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-accent);
      margin-bottom: 12px;
      font-weight: 600;
    }

    .score-row {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }

    .score-badge {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--accent);
      line-height: 1;
      font-family: "DM Mono", monospace;
    }

    .score-label {
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-family: "DM Mono", monospace;
    }

    .score-bar {
      flex: 1;
      height: 4px;
      background: var(--bg-card);
      border-radius: 2px;
      overflow: hidden;
      min-width: 80px;
    }

    .score-bar-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 2px;
    }

    .meta-line {
      font-size: 0.75rem;
      color: var(--text-secondary);
      margin-top: 6px;
    }
    .meta-line strong {
      color: var(--text-primary);
      font-weight: 600;
    }

    .rec-box {
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 0.8rem;
      font-weight: 500;
      line-height: 1.6;
      border-left: 3px solid;
    }

    .rec-forte {
      background: rgba(46, 204, 113, 0.08);
      border-color: var(--green);
      color: var(--green);
    }

    .rec-normal {
      background: rgba(230, 168, 23, 0.08);
      border-color: var(--orange);
      color: var(--orange);
    }

    .rec-cautela {
      background: rgba(230, 168, 23, 0.08);
      border-color: var(--orange);
      color: var(--orange);
    }

    .rec-aguardar {
      background: rgba(231, 76, 60, 0.08);
      border-color: var(--red);
      color: var(--red);
    }

    .odd-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.75rem;
      margin-top: 12px;
    }

    .odd-table th {
      text-align: left;
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-accent);
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-card);
    }

    .odd-table td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      color: var(--text-secondary);
    }

    .odd-table tr:last-child td {
      border-bottom: none;
    }

    .match-name {
      color: var(--text-primary);
      font-weight: 500;
    }

    .loading-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      color: var(--accent);
      padding: 12px 0;
    }

    .error-box {
      background: rgba(231, 76, 60, 0.08);
      border: 1px solid var(--red);
      border-radius: 8px;
      padding: 12px 16px;
      color: var(--red);
      font-size: 0.8rem;
      line-height: 1.6;
    }

    .pattern-item {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 14px;
      margin-bottom: 8px;
    }

    .pattern-name {
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--text-primary);
      margin-bottom: 4px;
    }

    .pattern-stats {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 0.7rem;
      color: var(--text-secondary);
    }

    .stat-badge {
      background: var(--bg-secondary);
      border-radius: 3px;
      padding: 2px 6px;
      color: var(--text-secondary);
    }

    .stat-badge strong {
      color: var(--accent);
      font-weight: 600;
    }

    @media (max-width: 768px) {
      .page-wrapper { padding: 16px 12px 40px; }
      .filter-row { grid-template-columns: 1fr; }
      .result-title { font-size: 0.75rem; }
      .btn-action { min-width: 100px; font-size: 0.75rem; padding: 10px 14px; }
    }
  </style>
</head>

<body>
  <div id="header"></div>

  <br><br>

  <div class="page-wrapper">

    <!-- FILTER CARD -->
    <div class="filter-section">

      <div class="filter-row">
        <div class="filter-group">
          <div class="filter-label">Casa de Aposta</div>
          <div class="btn-flex" id="casas-group">
            <button class="btn-option" data-value="betano">Betano</button>
            <button class="btn-option" data-value="betsson">Betsson</button>
            <button class="btn-option" data-value="kiron">Kiron</button>
            <button class="btn-option" data-value="estrela">Estrelabet</button>
            <button class="btn-option" data-value="bet365">Bet365</button>
          </div>
        </div>

        <div class="filter-group">
          <div class="filter-label">Período de Análise</div>
          <div class="btn-flex" id="periodo-group">
            <button class="btn-option" data-value="120">6h</button>
            <button class="btn-option" data-value="240">12h</button>
            <button class="btn-option" data-value="480">24h</button>
            <button class="btn-option" data-value="960">48h</button>
            <button class="btn-option" data-value="1440">72h</button>
          </div>
        </div>
      </div>

      <div class="filter-row" id="liga-section" style="display:none;">
        <div class="filter-group" style="grid-column: 1/-1;">
          <div class="filter-label">Liga</div>
          <p style="font-size:0.75rem;color:var(--text-secondary);margin-bottom:10px;">Selecione uma ou mais ligas — ou clique em "Todas"</p>
          <div class="btn-flex" id="ligas-group"></div>
        </div>
      </div>

      <div class="filter-row" style="grid-column: 1/-1;">
        <div class="filter-group" style="width:100%;">
          <div class="filter-label">Mercado da Análise</div>
          <div class="btn-flex" id="mercados-group">
            <button class="btn-option" data-value="casaVence">Casa Vence</button>
            <button class="btn-option" data-value="foraVence">Fora Vence</button>
            <button class="btn-option" data-value="empate">Empate</button>
            <button class="btn-option" data-value="ambasMarcam">Ambas Sim</button>
            <button class="btn-option" data-value="ambasNaoMarcam">Ambas Não</button>
            <button class="btn-option" data-value="over1.5">Over 1.5</button>
            <button class="btn-option" data-value="over2.5">Over 2.5</button>
            <button class="btn-option" data-value="over3.5">Over 3.5</button>
            <button class="btn-option" data-value="under1.5">Under 1.5</button>
            <button class="btn-option" data-value="under2.5">Under 2.5</button>
            <button class="btn-option" data-value="under3.5">Under 3.5</button>
            <button class="btn-option" data-value="over5">5+ Gols</button>
            <button class="btn-option" data-value="exact1">1 Gol Exato</button>
            <button class="btn-option" data-value="exact2">2 Gols Exatos</button>
            <button class="btn-option" data-value="exact3">3 Gols Exatos</button>
            <button class="btn-option" data-value="exact4">4 Gols Exatos</button>
          </div>
        </div>
      </div>

      <div class="filter-row">
        <div class="filter-group">
          <div class="filter-label">Estratégia Martingale</div>
          <div class="btn-flex" id="martingale-group">
            <button class="btn-option" data-value="0">Nenhum</button>
            <button class="btn-option" data-value="1">1 Cobertura</button>
            <button class="btn-option" data-value="2">2 Coberturas</button>
            <button class="btn-option" data-value="3">3 Coberturas</button>
          </div>
        </div>
      </div>

      <hr class="divider">

      <div class="actions-bar">
        <button class="btn-action btn-clear" onclick="limparAnalise()">Limpar</button>
        <button class="btn-action btn-generate" id="btn-gerar" onclick="gerarAnalise()">Gerar Análise</button>
      </div>
    </div>

    <!-- RESULTADO -->
    <div id="result-container"></div>

  </div>

  <script>
/* === CASAS CONFIG === */
const casasConfig = {
  'betano': { 
    name:'Betano', 
    ligas:[
      {name:'Clássicos da América',value:'Taça Glória Eterna'},
      'Copa América',
      'Euro',
      'Campeonato Italiano',
      'Copa das Estrelas',
      'Brasileirão Betano',
      'Mondial'
    ] 
  },
  'betsson': { 
    name:'Betsson', 
    ligas:['Championship','Premier','Coppa','Bundesliga','Ligue 1'],
    path:'betsson'
  },
  'kiron': { 
    name:'Kiron', 
    ligas:['England','Italy','Spain'], 
    path:'kiron' 
  },
  'estrela': { 
    name:'Estrelabet', 
    ligas:['Copa do Mundo','Ligas dos Campeões','América Latina'], 
    path:'estrela' 
  },
  'bet365': { 
    name:'Bet365', 
    ligas:['Copa','Euro','Super','Premier'], 
    path:'bet365' 
  }
};

/* === CACHE API === */
const _apiCache = new Map();
const CACHE_TTL_MS = 3*60*1000;
async function fetchComCache(url) {
  const c = _apiCache.get(url);
  if (c && Date.now()-c.ts < CACHE_TTL_MS) return c.data;
  const data = await fetch(url).then(r=>r.json());
  _apiCache.set(url, {ts:Date.now(), data});
  return data;
}

/* === LOCALSTORAGE === */
const LS_KEY = 'betstat_morfeus_config';
function salvarConfig() {
  const cfg = {
    casa: getSelectedValue('casas-group'),
    mercado: getSelectedValue('mercados-group'),
    martingale: getSelectedValue('martingale-group'),
    periodo: getSelectedValue('periodo-group'),
    ligas: getSelectedLigas()
  };
  try { localStorage.setItem(LS_KEY, JSON.stringify(cfg)); } catch(e){}
}

function restaurarConfig() {
  let cfg; try { cfg = JSON.parse(localStorage.getItem(LS_KEY)); } catch(e){ return; }
  if (!cfg) return;
  if (cfg.casa) {
    const b = document.querySelector(`#casas-group .btn-option[data-value="${cfg.casa}"]`);
    if (b) { b.classList.add('active'); mostrarLigas(cfg.casa); }
  }
  ['mercado','martingale','periodo'].forEach(k => {
    const id = k==='mercado'?'mercados-group':k==='martingale'?'martingale-group':'periodo-group';
    if (cfg[k]) { const b = document.querySelector(`#${id} .btn-option[data-value="${cfg[k]}"]`); if (b) b.classList.add('active'); }
  });
  if (cfg.ligas && cfg.ligas.length > 0) {
    setTimeout(() => {
      cfg.ligas.forEach(v => { const b = document.querySelector(`#ligas-group .btn-option[data-value="${v}"]`); if (b) b.classList.add('active'); });
      const allBtns = document.querySelectorAll('#ligas-group .btn-option:not([data-value="__todas__"])');
      const actBtns = document.querySelectorAll('#ligas-group .btn-option.active:not([data-value="__todas__"])');
      if (allBtns.length > 0 && allBtns.length === actBtns.length) {
        const tb = document.querySelector('#ligas-group .btn-option[data-value="__todas__"]');
        if (tb) { document.querySelectorAll('#ligas-group .btn-option.active').forEach(b=>b.classList.remove('active')); tb.classList.add('active'); }
      }
    }, 50);
  }
}

/* === BOTÕES SINGLE-SELECT === */
['casas-group','mercados-group','martingale-group','periodo-group'].forEach(id => {
  const g = document.getElementById(id);
  if (!g) return;
  g.addEventListener('click', e => {
    if (!e.target.classList.contains('btn-option')) return;
    g.querySelectorAll('.btn-option.active').forEach(b=>b.classList.remove('active'));
    e.target.classList.add('active');
    if (id==='casas-group') mostrarLigas(e.target.dataset.value);
    salvarConfig();
  });
});

/* LIGA MULTI-SELECT */
document.getElementById('ligas-group').addEventListener('click', e => {
  if (!e.target.classList.contains('btn-option')) return;
  const btn = e.target;
  if (btn.dataset.value==='__todas__') {
    const isActive = btn.classList.contains('active');
    document.querySelectorAll('#ligas-group .btn-option').forEach(b=>b.classList.remove('active'));
    if (!isActive) btn.classList.add('active');
  } else {
    const tb = document.querySelector('#ligas-group .btn-option[data-value="__todas__"]');
    if (tb) tb.classList.remove('active');
    btn.classList.toggle('active');
  }
  salvarConfig();
});

function mostrarLigas(casa) {
  const section = document.getElementById('liga-section');
  const group   = document.getElementById('ligas-group');
  if (!casasConfig[casa]) { section.style.display='none'; return; }
  group.innerHTML = '';
  const all = document.createElement('button');
  all.className='btn-option'; all.dataset.value='__todas__'; all.textContent='Todas';
  group.appendChild(all);
  casasConfig[casa].ligas.forEach(item => {
    const btn = document.createElement('button');
    btn.className = 'btn-option';
    if (typeof item==='object') { btn.dataset.value=item.value; btn.textContent=item.name; }
    else { btn.dataset.value=item; btn.textContent=item; }
    group.appendChild(btn);
  });
  section.style.display = 'block';
}

function getSelectedValue(groupId) { const g=document.getElementById(groupId),b=g?g.querySelector('.btn-option.active'):null; return b?b.dataset.value:null; }
function getSelectedText(groupId)  { const g=document.getElementById(groupId),b=g?g.querySelector('.btn-option.active'):null; return b?b.innerText:null; }
function getSelectedLigas() {

/* === API === */
async function buscarDadosAPI(casa, liga, numJogos) {
  const config = casasConfig[casa];
  if (!config) throw new Error(`Casa ${casa} não encontrada`);
  const d = { casa:config.name, liga, totalJogos:0, dadosCru:[] };
  try {
    const le=encodeURIComponent(liga), base='https://betstat.site', prefix=config.path?`/${config.path}`:'';
    const [res, prox, oddsRaw] = await Promise.all([
      fetchComCache(`${base}/resultados${prefix}/${le}`),
      fetchComCache(`${base}/proximos${prefix}/${le}`),
      fetchComCache(`${base}/odds${prefix}/${le}`).catch(()=>[])
    ]);
    res.slice(-numJogos).forEach(j=>{
      d.dadosCru.push([j[0],j[1],(j[2]||'').slice(11,16),j[3],j[4],parseInt(j[6]||0)]);
      d.totalJogos++;
    });
    d.proximos=prox.slice(0,6);
    d.oddsRaw=oddsRaw;
    return d;
  } catch(e){
    console.error(`Erro ao buscar ${casa}/${liga}:`,e);
    throw new Error(`Falha ao buscar dados: ${e.message}`);
  }
}

/* === CÁLCULOS === */
function normalizeTeamName(s) { return (s||'').toLowerCase().trim().replace(/\s+/g,' ').replace(/[^a-z0-9\s]/g,''); }

function calcularRankingTimes(jogos,mv) {
  const r={};
  jogos.forEach(j=>{
    const nk1=normalizeTeamName(j.time_a), nk2=normalizeTeamName(j.time_b);
    if(!r[nk1])r[nk1]={v:0,d:0,p:0,e:0};
    if(!r[nk2])r[nk2]={v:0,d:0,p:0,e:0};
    const [g1,g2]=j.ft.split(' x ').map(Number);
    if(isNaN(g1)||isNaN(g2))return;
    r[nk1].v++;r[nk2].v++;
    if(mv==='casaVence'||mv==='foraVence'||mv==='empate'){
      if(g1>g2){r[nk1].d++;r[nk2].p++;}else if(g1<g2){r[nk2].d++;r[nk1].p++;}else{r[nk1].e++;r[nk2].e++;}
    }
  });
  return r;
}

function calcularStreak(jogos, mv) {
  let seq=[], lastRes='';
  jogos.forEach(j=>{
    const [g1,g2]=j[0].split(' x ').map(Number);
    if(isNaN(g1)||isNaN(g2))return;
    const ocorreu = (mv==='casaVence'&&g1>g2) || (mv==='foraVence'&&g1<g2) || (mv==='empate'&&g1===g2) || (mv==='ambasMarcam'&&g1>0&&g2>0) || (mv==='ambasNaoMarcam'&&(g1===0||g2===0)) || (mv.startsWith('over')&&(g1+g2)>parseFloat(mv.replace('over',''))) || (mv.startsWith('under')&&(g1+g2)<parseFloat(mv.replace('under',''))) || (mv.startsWith('exact')&&(g1+g2)===parseInt(mv.replace('exact','')));
    const res = ocorreu?'green':'red';
    if(res===lastRes){seq[seq.length-1]++;}else{seq.push(1);lastRes=res;}
  });
  if(!seq.length)return null;
  const tipo = lastRes;
  const contagem = seq[seq.length-1];
  return {tipo, contagem};
}

async function analyzeInWorker(dados, opts) {
  return new Promise(resolve=>{
    const w=new Worker(window.URL.createObjectURL(new Blob([`
      self.onmessage=e=>{
        const {dados,opts}=e.data;
        const res=calcularPadroes(dados,opts);
        self.postMessage(res);
      };
      function calcularPadroes(dados,opts){return {resultados:[]};}
    `],{type:'application/javascript'})));
    w.onmessage=e=>{resolve(e.data);w.terminate();};
    w.postMessage({dados, opts});
  });
}

function calcularRankingOdds(dados,mv) {
  const exato={}, faixas={};
  (dados.oddsRaw||[]).forEach(o=>{
    let val;
    if(mv==='casaVence')val=parseFloat(o.casa_vence);
    else if(mv==='foraVence')val=parseFloat(o.fora_vence);
    else if(mv==='empate')val=parseFloat(o.empate);
    else if(mv==='ambasMarcam')val=parseFloat(o.ambas_marcam_sim);
    else if(mv==='ambasNaoMarcam')val=parseFloat(o.ambas_marcam_nao);
    else if(mv.startsWith('over')){
      const t=parseFloat(mv.replace('over',''));
      if(t===1.5)val=parseFloat(o.over_1_5);
      else if(t===2.5)val=parseFloat(o.over_2_5);
      else if(t===3.5)val=parseFloat(o.over_3_5);
      else if(t===5)val=parseFloat(o.gols_5_mais);
    }else if(mv.startsWith('under')){
      const t=parseFloat(mv.replace('under',''));
      if(t===1.5)val=parseFloat(o.under_1_5);
      else if(t===2.5)val=parseFloat(o.under_2_5);
      else if(t===3.5)val=parseFloat(o.under_3_5);
    }else if(mv.startsWith('exact')){
      const t=parseInt(mv.replace('exact',''));
      if(t===1)val=parseFloat(o.exact_1);
      else if(t===2)val=parseFloat(o.exact_2);
      else if(t===3)val=parseFloat(o.exact_3);
      else if(t===4)val=parseFloat(o.exact_4);
    }
    if(!isNaN(val)){
      const k=val.toFixed(2);
      exato[k]=(exato[k]||0)+1;
    }
  });
  const top5Odds=new Set(Object.entries(exato).sort((a,b)=>b[1]-a[1]).slice(0,5).map(e=>e[0]));
  return{rankingExato:exato, rankingFaixas:faixas, top5Odds, top3Faixas:new Set()};
}

function mapMercado(mv) {
  const m={'casaVence':'1','foraVence':'2','empate':'X','ambasMarcam':'GG','ambasNaoMarcam':'NG'};
  return m[mv]||mv;
}

function renderAnalise(dados, opts) {
  if(!dados)return '<div style="color:var(--text-secondary)">Sem dados disponíveis.</div>';
  
  const {mercado, mercadoValue, ligaDisplay, casa, martingale, periodo} = opts;
  let html='';
  
  const wr = dados.padroesEncontrados || [];
  const ranking = dados.ranking || {};
  const acertos = Object.values(ranking).reduce((s,t)=>s+t.d, 0);
  const total = Object.values(ranking).reduce((s,t)=>s+t.v, 0);
  const ma = total>0 ? Math.round((acertos/total)*100) : 0;
  
  const topOdds = dados.top5Odds || new Set();
  const score = (ma >= 70 ? 80 : ma >= 50 ? 60 : 40);
  
  html += `<div class="analysis-block">
    <div class="block-title">Resumo da Análise</div>
    <div class="score-row">
      <div class="score-badge">${score}</div>
      <div style="flex:1">
        <div class="score-label">Score Total</div>
        <div class="score-bar"><div class="score-bar-fill" style="width:${score}%"></div></div>
      </div>
    </div>
    <div class="meta-line"><strong>${casa}</strong> • ${ligaDisplay} • ${periodo}</div>
  </div>`;
  
  html += `<div class="analysis-block">
    <div class="block-title">Acurácia do Padrão</div>
    <div class="score-row">
      <div class="score-badge">${ma}%</div>
      <div><div class="score-label">Acerto Histórico</div></div>
    </div>
    <div class="meta-line">Em <strong>${total}</strong> jogos analisados, <strong>${acertos}</strong> com o padrão "${mercado}"</div>
  </div>`;
  
  if(dados.proximos && dados.proximos.length>0) {
    const rows = dados.proximos.map(j=>{
      const ta=j.time_a||'—', tb=j.time_b||'—';
      return `<tr><td class="match-name">${ta} × ${tb}</td><td>${j.horario||'—'}</td><td style="text-align:center">—</td></tr>`;
    }).join('');
    html += `<div class="analysis-block"><div class="block-title">Próximos Jogos — ${mercado}</div><table class="odd-table"><thead><tr><th>Partida</th><th>Horário</th><th>Odd</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }
  
  const streak = dados.streak;
  if(streak) {
    const streakInfo = streak.tipo==='red' && streak.contagem>=4 ? ` ⚠️ ${streak.contagem}× red consecutivas` : '';
    html += `<div class="analysis-block"><div class="block-title">Sequência Atual</div><div class="meta-line">Streak: <strong>${streak.contagem}×</strong> (${streak.tipo})${streakInfo}</div></div>`;
  }
  
  let recCls='rec-normal', recMsg='';
  if(score>=80) {
    recCls='rec-forte';
    recMsg=`✅ ENTRADA FORTE (Score ${score}/100). Confluência detectada.`;
  } else if(score>=65) {
    recCls='rec-normal';
    recMsg=`🟡 ENTRADA (Score ${score}/100). Sinais positivos.`;
  } else if(score>=50) {
    recCls='rec-cautela';
    recMsg=`🟠 ENTRADA COM CAUTELA (Score ${score}/100). Risco moderado.`;
  } else {
    recCls='rec-aguardar';
    recMsg=`🔴 AGUARDAR (Score ${score}/100). Indicadores baixos.`;
  }
  html += `<div class="analysis-block"><div class="block-title">Recomendação</div><div class="rec-box ${recCls}">${recMsg}</div></div>`;
  
  return html;
}

/* === PROCESSAR LIGA === */
async function processarLiga(casa,liga,mv,martCob) {
  const dados=await buscarDadosAPI(casa,liga,parseInt(getSelectedValue('periodo-group')));
  dados.ranking=calcularRankingTimes(dados.dadosCru.map(j=>({time_a:j[3],time_b:j[4],ft:`${j[0]} x ${j[1]}`})),mv);
  dados.streak=calcularStreak(dados.dadosCru,mv);
  dados.padroesEncontrados=[];
  const{rankingExato,rankingFaixas,top5Odds,top3Faixas}=calcularRankingOdds(dados,mv);
  dados.rankingExato=rankingExato;
  dados.rankingFaixas=rankingFaixas;
  dados.top5Odds=top5Odds;
  dados.top3Faixas=top3Faixas;
  const sm=mapMercado(mv);
  dados.marketAnalysis=calculateMarketAnalysis(dados,sm,dados.totalJogos,20,martCob+1);
  return dados;
}

/* === FUNÇÃO PRINCIPAL === */
async function gerarAnalise() {
  const casa=getSelectedValue('casas-group');
  const ligas=getSelectedLigas();
  const mv=getSelectedValue('mercados-group');
  const mt=getSelectedText('mercados-group');
  const martCob=parseInt(getSelectedValue('martingale-group')||'0',10);
  const martText=getSelectedText('martingale-group');
  const periodo=getSelectedValue('periodo-group');

  if(!casa||ligas.length===0||!mv||!periodo){
    alert('Por favor, selecione Casa, Liga, Mercado e Período de Análise.');
    return;
  }

  const btn=document.getElementById('btn-gerar');
  const rc=document.getElementById('result-container');
  btn.disabled=true;
  btn.innerHTML='<span class="spinner"></span> Processando...';
  rc.innerHTML=`<div class="result-container"><div class="result-header"><div class="result-dot"></div><div class="result-title" id="rtt">Processando…</div></div><div class="result-body"><div class="loading-indicator"><span class="spinner"></span>Coletando dados de ${ligas.length} liga(s)…</div></div></div>`;
  rc.style.display='block';

  function setS(msg){const el=document.getElementById('rtt');if(el)el.textContent=msg;}

  try {
    setS(`Processando ${ligas.length} liga(s)…`);
    const resultados=await Promise.all(ligas.map(liga=>processarLiga(casa,liga,mv,martCob)));

    const casaNome=casasConfig[casa].name;
    const agora=new Date(),hora=`${String(agora.getHours()).padStart(2,'0')}:${String(agora.getMinutes()).padStart(2,'0')}`;

    let tabsHtml='',panelsHtml='';
    ligas.forEach((liga,idx)=>{
      const isFirst=idx===0;
      const cfg=casasConfig[casa];
      const found=cfg.ligas.find(l=>(typeof l==='object'?l.value:l)===liga);
      const ligaDisplay=typeof found==='object'?found.name:(found||liga);
      tabsHtml+=`<button class="liga-tab${isFirst?' active':''}" onclick="switchTab(${idx})" id="tab-${idx}">${ligaDisplay}</button>`;
      const html=renderAnalise(resultados[idx],{mercado:mt,mercadoValue:mv,ligaDisplay,casa:casaNome,martingale:martText||'Nenhum',periodo:periodo+' min'});
      panelsHtml+=`<div class="liga-panel${isFirst?' active':''}" id="panel-${idx}"><div class="result-body">${html}</div></div>`;
    });

    const tabsSec=ligas.length>1?`<div class="liga-tabs">${tabsHtml}</div>`:'';
    const titleLiga=ligas.length>1?ligas.join(', '):ligas[0];
    rc.innerHTML=`<div class="result-container"><div class="result-header"><div class="result-dot"></div><div class="result-title">✓ Análise Concluída — ${casaNome} · ${titleLiga} · ${hora}</div></div>${tabsSec}${panelsHtml}</div>`;

    btn.disabled=false;
    btn.className='btn-action btn-clear';
    btn.innerHTML='↺ Nova Análise';
    btn.onclick=()=>{ limparAnalise(); };

  } catch(error){
    rc.innerHTML=`<div class="result-container"><div class="result-header"><div class="result-dot" style="background:var(--red)"></div><div class="result-title" style="color:var(--red)">✖ Erro na Análise</div></div><div class="result-body"><div class="error-box"><strong>Erro:</strong> ${error.message}<br><br>Atualize a página e tente novamente.</div></div></div>`;
    btn.disabled=false;
    btn.className='btn-action btn-generate';
    btn.innerHTML='Gerar Análise';
    btn.onclick=gerarAnalise;
  }
}

function switchTab(idx){
  document.querySelectorAll('.liga-tab').forEach((t,i)=>t.classList.toggle('active',i===idx));
  document.querySelectorAll('.liga-panel').forEach((p,i)=>p.classList.toggle('active',i===idx));
}
