  <style>
    :root {
      --bg-primary: #0a0e1a;
      --bg-secondary: #141829;
      --bg-card: #1a1f2e;
      --bg-card-hover: #232d3f;
      --bg-top: #0d1c1f;
      --border: #2a3555;
      --border-accent: #1a4750;
      --accent: #00d9ff;
      --accent-dim: #0099cc;
      --accent-muted: rgba(0, 217, 255, 0.08);
      --text-primary: #e4e8f0;
      --text-secondary: #8b95a8;
      --text-accent: #00d9ff;
      --green: #00ff7f;
      --red: #ff4444;
      --orange: #ffa500;
      --purple: #b700ff;
      --cyan: #00e5ff;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: "DM Sans", sans-serif;
      background: linear-gradient(135deg, var(--bg-primary) 0%, #0f1422 50%, var(--bg-primary) 100%);
      background-attachment: fixed;
      color: var(--text-primary);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    #header { position: sticky; top: 0; z-index: 100; }

    .page-wrapper {
      max-width: 1600px;
      margin: 0 auto;
      padding: 28px 24px 60px;
    }

    /* ── AI GLOW EFFECT ── */
    .glow-accent {
      box-shadow: 0 0 20px rgba(0, 217, 255, 0.15), 0 0 40px rgba(0, 217, 255, 0.08);
      border: 1px solid rgba(0, 217, 255, 0.3);
    }

    .glow-success {
      box-shadow: 0 0 20px rgba(0, 255, 127, 0.15), 0 0 40px rgba(0, 255, 127, 0.08);
      border: 1px solid rgba(0, 255, 127, 0.3);
    }

    .glow-danger {
      box-shadow: 0 0 20px rgba(255, 68, 68, 0.15), 0 0 40px rgba(255, 68, 68, 0.08);
      border: 1px solid rgba(255, 68, 68, 0.3);
    }

    /* ── SECTION TITLE ── */
    .section-title {
      font-size: 0.65rem;
      font-family: "JetBrains Mono", monospace;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-title::before {
      content: "⟨";
      opacity: 0.6;
    }

    .section-title::after {
      content: "⟩";
      opacity: 0.6;
    }

    /* ── FILTER SECTION ── */
    .filter-section {
      background: linear-gradient(135deg, var(--bg-secondary) 0%, rgba(20, 24, 41, 0.5) 100%);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 28px;
      backdrop-filter: blur(10px);
    }

    .filter-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 20px;
    }

    .filter-group {
      display: flex;
      flex-direction: column;
    }

    .filter-label {
      font-size: 0.62rem;
      font-family: "JetBrains Mono", monospace;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 10px;
      font-weight: 600;
      opacity: 0.9;
    }

    select {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-primary);
      font-family: "DM Sans", sans-serif;
      font-size: 0.85rem;
      padding: 12px 14px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.25s;
      appearance: none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2300d9ff' stroke-width='2'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 8px center;
      background-size: 20px;
      padding-right: 36px;
    }

    select:hover {
      border-color: var(--accent);
      box-shadow: 0 0 15px rgba(0, 217, 255, 0.1);
    }

    select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 20px rgba(0, 217, 255, 0.2);
      background-color: var(--bg-card-hover);
    }

    select option {
      background: var(--bg-card);
      color: var(--text-primary);
    }

    .divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 20px 0;
    }

    .actions-bar {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn-action {
      flex: 1;
      min-width: 140px;
      padding: 14px 24px;
      border: 1px solid;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      font-family: "JetBrains Mono", monospace;
      cursor: pointer;
      transition: all 0.25s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .btn-clear {
      background: transparent;
      border-color: var(--border);
      color: var(--text-secondary);
    }
    .btn-clear:hover {
      border-color: var(--orange);
      color: var(--orange);
      box-shadow: 0 0 15px rgba(255, 165, 0, 0.1);
    }

    .btn-generate {
      background: linear-gradient(135deg, var(--accent) 0%, var(--cyan) 100%);
      color: var(--bg-primary);
      border-color: var(--accent);
      font-weight: 700;
    }
    .btn-generate:hover:not(:disabled) {
      box-shadow: 0 0 30px rgba(0, 217, 255, 0.4);
      transform: translateY(-2px);
    }
    .btn-generate:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(0, 217, 255, 0.3);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: inline-block;
      flex-shrink: 0;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── DASHBOARD HISTÓRICO ── */
    .history-section {
      margin-bottom: 28px;
    }

    .history-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 14px;
      max-height: 400px;
      overflow-y: auto;
      padding: 4px;
    }

    .history-grid::-webkit-scrollbar {
      width: 6px;
    }

    .history-grid::-webkit-scrollbar-track {
      background: transparent;
    }

    .history-grid::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }

    .history-card {
      background: linear-gradient(135deg, var(--bg-card) 0%, rgba(26, 31, 46, 0.6) 100%);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      cursor: pointer;
      transition: all 0.25s;
      position: relative;
      overflow: hidden;
    }

    .history-card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
      box-shadow: 0 8px 24px rgba(0, 217, 255, 0.12);
    }

    .history-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity: 0;
      transition: opacity 0.25s;
    }

    .history-card:hover::before {
      opacity: 1;
    }

    .hc-header {
      display: flex;
      justify-content: space-between;
      align-items: start;
      margin-bottom: 10px;
    }

    .hc-time {
      font-size: 0.62rem;
      font-family: "JetBrains Mono", monospace;
      color: var(--text-secondary);
      letter-spacing: 0.05em;
    }

    .hc-score {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--accent);
      font-family: "JetBrains Mono", monospace;
    }

    .hc-info {
      font-size: 0.7rem;
      color: var(--text-secondary);
      margin-bottom: 8px;
      line-height: 1.4;
    }

    .hc-badge {
      display: inline-block;
      font-size: 0.6rem;
      padding: 3px 8px;
      background: var(--accent-muted);
      color: var(--accent);
      border-radius: 4px;
      margin-right: 4px;
      margin-bottom: 4px;
      font-weight: 600;
    }

    /* ── RESULT SECTION ── */
    .result-container {
      background: linear-gradient(135deg, var(--bg-secondary) 0%, rgba(20, 24, 41, 0.5) 100%);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 28px;
      backdrop-filter: blur(10px);
    }

    .result-header {
      background: linear-gradient(90deg, var(--accent-muted) 0%, rgba(0, 217, 255, 0.05) 100%);
      border-bottom: 2px solid var(--accent);
      padding: 20px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .result-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
      box-shadow: 0 0 15px rgba(0, 217, 255, 0.6);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 15px rgba(0, 217, 255, 0.6); }
      50% { box-shadow: 0 0 25px rgba(0, 217, 255, 0.3); }
    }

    .result-title {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--accent);
      font-family: "JetBrains Mono", monospace;
      letter-spacing: 0.08em;
    }

    .liga-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 14px 24px;
      border-bottom: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.2);
    }

    .liga-tab {
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 0.73rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-secondary);
      font-family: "JetBrains Mono", monospace;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .liga-tab:hover {
      color: var(--accent);
      border-color: var(--accent);
    }
    .liga-tab.active {
      background: var(--accent-muted);
      color: var(--accent);
      border-color: var(--accent);
      box-shadow: 0 0 15px rgba(0, 217, 255, 0.2);
    }

    .liga-panel {
      display: none;
    }
    .liga-panel.active {
      display: block;
    }

    .result-body {
      padding: 24px;
    }

    .analysis-block {
      margin-bottom: 24px;
      padding-bottom: 24px;
      border-bottom: 1px dashed var(--border);
    }
    .analysis-block:last-child {
      margin-bottom: 0;
      padding-bottom: 0;
      border-bottom: none;
    }

    .block-title {
      font-size: 0.62rem;
      font-family: "JetBrains Mono", monospace;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 14px;
      font-weight: 600;
    }

    .score-row {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 10px;
      padding: 12px;
      background: var(--bg-card);
      border-radius: 8px;
      border-left: 3px solid var(--accent);
    }

    .score-badge {
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--accent);
      line-height: 1;
      font-family: "JetBrains Mono", monospace;
      min-width: 60px;
      text-align: center;
    }

    .score-bar {
      flex: 1;
      height: 6px;
      background: var(--bg-secondary);
      border-radius: 3px;
      overflow: hidden;
      min-width: 100px;
      border: 1px solid var(--border);
    }

    .score-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--cyan) 0%, var(--accent) 100%);
      border-radius: 3px;
      box-shadow: 0 0 10px rgba(0, 217, 255, 0.5);
    }

    .meta-line {
      font-size: 0.73rem;
      color: var(--text-secondary);
      margin-top: 6px;
      font-family: "JetBrains Mono", monospace;
      letter-spacing: 0.02em;
    }
    .meta-line strong {
      color: var(--accent);
      font-weight: 700;
    }

    .rec-box {
      border-radius: 8px;
      padding: 14px 16px;
      font-size: 0.78rem;
      font-weight: 500;
      line-height: 1.7;
      border-left: 3px solid;
      font-family: "DM Sans", sans-serif;
      backdrop-filter: blur(5px);
    }

    .rec-forte {
      background: rgba(0, 255, 127, 0.08);
      border-color: var(--green);
      color: var(--green);
    }

    .rec-normal {
      background: rgba(255, 165, 0, 0.08);
      border-color: var(--orange);
      color: var(--orange);
    }

    .rec-cautela {
      background: rgba(255, 165, 0, 0.08);
      border-color: var(--orange);
      color: var(--orange);
    }

    .rec-aguardar {
      background: rgba(255, 68, 68, 0.08);
      border-color: var(--red);
      color: var(--red);
    }

    .odd-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.74rem;
      margin-top: 12px;
      font-family: "JetBrains Mono", monospace;
    }

    .odd-table th {
      text-align: left;
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      padding: 10px 12px;
      border-bottom: 2px solid var(--accent);
      background: var(--bg-card);
    }

    .odd-table td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      color: var(--text-secondary);
    }

    .odd-table tr:last-child td {
      border-bottom: none;
    }

    .match-name {
      color: var(--text-primary);
      font-weight: 600;
    }

    .loading-indicator {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.8rem;
      color: var(--accent);
      padding: 16px 0;
      font-family: "JetBrains Mono", monospace;
      letter-spacing: 0.05em;
    }

    .error-box {
      background: rgba(255, 68, 68, 0.08);
      border: 1px solid var(--red);
      border-left: 3px solid var(--red);
      border-radius: 8px;
      padding: 14px 16px;
      color: var(--red);
      font-size: 0.78rem;
      line-height: 1.6;
      font-family: "DM Sans", sans-serif;
    }

    @media (max-width: 768px) {
      .page-wrapper { padding: 16px 12px 40px; }
      .filter-grid { grid-template-columns: 1fr; }
      .history-grid { grid-template-columns: 1fr; }
      .score-badge { font-size: 1.6rem; }
      .btn-action { min-width: 100px; font-size: 0.75rem; padding: 12px 16px; }
    }
  </style>
</head>

    ], 
    path:'estrela' 
  },

    name:'Bet365',

      {name:'Copa',value:'Copa'},

      {name:'Premier',value:'Premier'}
    ], 
    path:'bet365' 
  }
};

/* === HISTÓRICO DE ANÁLISES (LOCALSTORAGE) === */
const HISTORY_KEY = 'betstat_morfeus_history';
const MAX_HISTORY = 20;

function carregarHistorico() {
  try {
    return JSON.parse(localStorage.getItem(HISTORY_KEY)) || [];
  } catch {
    return [];
  }
}

function salvarNoHistorico(analise) {
  let hist = carregarHistorico();
  hist.unshift(analise);
  hist = hist.slice(0, MAX_HISTORY);
  localStorage.setItem(HISTORY_KEY, JSON.stringify(hist));
  renderizarHistorico();
}

function renderizarHistorico() {
  const hist = carregarHistorico();
  const grid = document.getElementById('history-grid');
  
  if (hist.length === 0) {
    grid.innerHTML = '<div style="grid-column:1/-1;padding:20px;text-align:center;color:var(--text-secondary);font-size:0.8rem;">Nenhuma análise realizada ainda.</div>';
    return;
  }

  grid.innerHTML = hist.map((h, idx) => `
    <div class="history-card" onclick="restaurarAnalise(${idx})">
      <div class="hc-header">
        <div class="hc-time">${h.timestamp}</div>
        <div class="hc-score">${h.score}</div>
      </div>
      <div class="hc-info">
        <strong>${h.casa}</strong> • ${h.liga}<br>
        ${h.mercado} • ${h.periodo}min
      </div>
      <div>
        <span class="hc-badge">${h.acuracia}%</span>
        <span class="hc-badge">Gales: ${h.gales}</span>
      </div>
    </div>
  `).join('');
}

function restaurarAnalise(idx) {
  const hist = carregarHistorico();
  if (hist[idx]) {
    const h = hist[idx];
    document.getElementById('casas-select').value = h.casa_key;
    atualizarLigas();
    setTimeout(() => {
      document.getElementById('liga-select').value = h.liga_key;
      document.getElementById('periodo-select').value = h.periodo;
      document.getElementById('gales-select').value = h.gales;
      document.getElementById('mercado-select').value = h.mercado_key;
    }, 100);
  }
}

function limparHistorico() {
  localStorage.removeItem(HISTORY_KEY);
  renderizarHistorico();
}

/* === CONFIGURAR LIGAS === */
function atualizarLigas() {
  const casa = document.getElementById('casas-select').value;
  const select = document.getElementById('liga-select');
  
  select.innerHTML = '';
  if (!casa || !casasConfig[casa]) {
    select.innerHTML = '<option value="">Selecione uma casa primeiro...</option>';
    return;
  }

  const ligas = casasConfig[casa].ligas;
  ligas.forEach(liga => {
    const opt = document.createElement('option');
    opt.value = typeof liga === 'object' ? liga.value : liga;
    opt.textContent = typeof liga === 'object' ? liga.name : liga;
    select.appendChild(opt);
  });
}

/* === CACHE API === */
const _apiCache = new Map();
const CACHE_TTL_MS = 3*60*1000;
async function fetchComCache(url) {
  const c = _apiCache.get(url);
  if (c && Date.now()-c.ts < CACHE_TTL_MS) return c.data;
  const data = await fetch(url).then(r=>r.json());
  _apiCache.set(url, {ts:Date.now(), data});
  return data;
}

/* === CÁLCULOS === */
function normalizeTeamName(s) { return (s||'').toLowerCase().trim().replace(/\s+/g,' ').replace(/[^a-z0-9\s]/g,''); }

function calcularRankingTimes(jogos,mv) {
  const r={};
  jogos.forEach(j=>{
    const nk1=normalizeTeamName(j.time_a), nk2=normalizeTeamName(j.time_b);
    if(!r[nk1])r[nk1]={v:0,d:0,p:0,e:0};
    if(!r[nk2])r[nk2]={v:0,d:0,p:0,e:0};
    const [g1,g2]=j.ft.split(' x ').map(Number);
    if(isNaN(g1)||isNaN(g2))return;
    r[nk1].v++;r[nk2].v++;
    if(mv==='casaVence'||mv==='foraVence'||mv==='empate'){
      if(g1>g2){r[nk1].d++;r[nk2].p++;}else if(g1<g2){r[nk2].d++;r[nk1].p++;}else{r[nk1].e++;r[nk2].e++;}
    }
  });
  return r;
}

function calcularStreak(jogos, mv) {
  let seq=[], lastRes='';
  jogos.forEach(j=>{
    const [g1,g2]=j[0].split(' x ').map(Number);
    if(isNaN(g1)||isNaN(g2))return;
    const ocorreu = (mv==='casaVence'&&g1>g2) || (mv==='foraVence'&&g1<g2) || (mv==='empate'&&g1===g2) || (mv==='ambasMarcam'&&g1>0&&g2>0) || (mv==='ambasNaoMarcam'&&(g1===0||g2===0)) || (mv.startsWith('over')&&(g1+g2)>parseFloat(mv.replace('over',''))) || (mv.startsWith('under')&&(g1+g2)<parseFloat(mv.replace('under',''))) || (mv.startsWith('exact')&&(g1+g2)===parseInt(mv.replace('exact','')));
    const res = ocorreu?'green':'red';
    if(res===lastRes){seq[seq.length-1]++;}else{seq.push(1);lastRes=res;}
  });
  if(!seq.length)return null;
  const tipo = lastRes;
  const contagem = seq[seq.length-1];
  return {tipo, contagem};
}

function calcularRankingOdds(dados,mv) {
  const exato={}, faixas={};
  (dados.oddsRaw||[]).forEach(o=>{
    let val;
    if(mv==='casaVence')val=parseFloat(o.casa_vence);
    else if(mv==='foraVence')val=parseFloat(o.fora_vence);
    else if(mv==='empate')val=parseFloat(o.empate);
    else if(mv==='ambasMarcam')val=parseFloat(o.ambas_marcam_sim);
    else if(mv==='ambasNaoMarcam')val=parseFloat(o.ambas_marcam_nao);
    if(!isNaN(val)){
      const k=val.toFixed(2);
      exato[k]=(exato[k]||0)+1;
    }
  });
  const top5Odds=new Set(Object.entries(exato).sort((a,b)=>b[1]-a[1]).slice(0,5).map(e=>e[0]));
  return{rankingExato:exato, rankingFaixas:faixas, top5Odds, top3Faixas:new Set()};
}

function renderAnalise(dados, opts) {
  if(!dados)return '<div style="color:var(--text-secondary)">Sem dados disponíveis.</div>';
  
  const {mercado, mercadoValue, ligaDisplay, casa, gales, periodo} = opts;
  let html='';
  
  const ranking = dados.ranking || {};
  const acertos = Object.values(ranking).reduce((s,t)=>s+t.d, 0);
  const total = Object.values(ranking).reduce((s,t)=>s+t.v, 0);
  const ma = total>0 ? Math.round((acertos/total)*100) : 0;
  
  const score = (ma >= 70 ? 85 : ma >= 50 ? 65 : 45);
  
  html += `<div class="analysis-block">
    <div class="block-title">📈 Score da Análise</div>
    <div class="score-row">
      <div class="score-badge">${score}</div>
      <div style="flex:1">
        <div class="score-bar"><div class="score-bar-fill" style="width:${score}%"></div></div>
      </div>
    </div>
    <div class="meta-line">Casa: <strong>${casa}</strong> | Liga: <strong>${ligaDisplay}</strong> | Período: <strong>${periodo}min</strong> | Gales: <strong>${gales}</strong></div>
  </div>`;
  
  html += `<div class="analysis-block">
    <div class="block-title">🎯 Acurácia do Padrão</div>
    <div class="score-row">
      <div class="score-badge">${ma}%</div>
      <div><strong style="color:var(--accent)">${acertos}</strong> acertos em <strong style="color:var(--accent)">${total}</strong> jogos</div>
    </div>
  </div>`;
  
  if(dados.proximos && dados.proximos.length>0) {
    const rows = dados.proximos.map(j=>{
      const ta=j.time_a||'—', tb=j.time_b||'—';
      return `<tr><td class="match-name">${ta} × ${tb}</td><td style="text-align:center">${j.horario||'—'}</td></tr>`;
    }).join('');
    html += `<div class="analysis-block"><div class="block-title">⏱ Próximos Jogos</div><table class="odd-table"><thead><tr><th>Partida</th><th>Horário</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }
  
  const streak = dados.streak;
  if(streak) {
    const icon = streak.tipo === 'green' ? '✅' : '❌';
    html += `<div class="analysis-block"><div class="block-title">📊 Sequência Atual</div><div class="meta-line">${icon} <strong>${streak.contagem}×</strong> ${streak.tipo.toUpperCase()}</div></div>`;
  }
  
  let recCls='rec-normal', recMsg='';
  if(score>=80) {
    recCls='rec-forte';
    recMsg=`✅ ENTRADA FORTE (Score ${score}/100)`;
  } else if(score>=65) {
    recCls='rec-normal';
    recMsg=`🟡 ENTRADA RECOMENDADA (Score ${score}/100)`;
  } else if(score>=50) {
    recCls='rec-cautela';
    recMsg=`🟠 ENTRADA COM CAUTELA (Score ${score}/100)`;
  } else {
    recCls='rec-aguardar';
    recMsg=`🔴 AGUARDAR (Score ${score}/100)`;
  }
  html += `<div class="analysis-block"><div class="block-title">⚡ Recomendação</div><div class="rec-box ${recCls}">${recMsg}</div></div>`;
  
  return html;
}

/* === API === */
async function buscarDadosAPI(casa, liga, numJogos) {
  const config = casasConfig[casa];
  if (!config) throw new Error(`Casa ${casa} não encontrada`);
  const d = { casa:config.name, liga, totalJogos:0, dadosCru:[] };
  try {
    const le=encodeURIComponent(liga), base='https://betstat.site', prefix=config.path?`/${config.path}`:'';
    const [res, prox, oddsRaw] = await Promise.all([
      fetchComCache(`${base}/resultados${prefix}/${le}`),
      fetchComCache(`${base}/proximos${prefix}/${le}`),
      fetchComCache(`${base}/odds${prefix}/${le}`).catch(()=>[])
    ]);
    res.slice(-numJogos).forEach(j=>{
      d.dadosCru.push([j[0],j[1],(j[2]||'').slice(11,16),j[3],j[4],parseInt(j[6]||0)]);
      d.totalJogos++;
    });
    d.proximos=prox.slice(0,6);
    d.oddsRaw=oddsRaw;
    return d;
  } catch(e){
    console.error(`Erro ao buscar ${casa}/${liga}:`,e);
    throw new Error(`Falha ao buscar dados: ${e.message}`);
  }
}

async function processarLiga(casa,liga,mv) {
  const numJogos = parseInt(document.getElementById('periodo-select').value);
  const dados=await buscarDadosAPI(casa,liga,numJogos);
  
  // Transformar dados do formato API para formato esperado pelas funções de cálculo
  const jogosFormatados = dados.dadosCru.map(j=>[`${j[0]} x ${j[1]}`, j[2], '', j[3], j[4], j[5]]);
  
  dados.ranking=calcularRankingTimes(dados.dadosCru.map(j=>({time_a:j[3],time_b:j[4],ft:`${j[0]} x ${j[1]}`})),mv);
  dados.streak=calcularStreak(jogosFormatados,mv);
  const{rankingExato,rankingFaixas,top5Odds,top3Faixas}=calcularRankingOdds(dados,mv);
  dados.rankingExato=rankingExato;
  dados.rankingFaixas=rankingFaixas;
  dados.top5Odds=top5Odds;
  dados.top3Faixas=top3Faixas;
  return dados;
}

/* === FUNÇÃO PRINCIPAL === */
async function gerarAnalise() {
  const casa = document.getElementById('casas-select').value;
  const liga = document.getElementById('liga-select').value;
  const mv = document.getElementById('mercado-select').value;
  const periodo = document.getElementById('periodo-select').value;
  const gales = document.getElementById('gales-select').value;

  if(!casa||!liga||!mv||!periodo){
    alert('Por favor, preencha todos os campos!');
    return;
  }

  const btn=document.getElementById('btn-gerar');
  const rc=document.getElementById('result-container');
  btn.disabled=true;
  btn.innerHTML='<span class="spinner"></span> Processando...';
  rc.innerHTML=`<div class="result-container"><div class="result-header"><div class="result-dot"></div><div class="result-title" id="rtt">◾ Coletando dados...</div></div><div class="result-body"><div class="loading-indicator"><span class="spinner"></span>Analisando ${casasConfig[casa].name} • ${liga}</div></div></div>`;

  function setS(msg){const el=document.getElementById('rtt');if(el)el.textContent=msg;}

  try {
    setS(`▶ Processando análise...`);
    const dados = await processarLiga(casa, liga, mv);

    const casaNome = casasConfig[casa].name;
    const ligaConfig = casasConfig[casa].ligas.find(l=>(typeof l==='object'?l.value:l)===liga);
    const ligaDisplay = typeof ligaConfig==='object'?ligaConfig.name:ligaConfig||liga;
    const mercadoConfig = document.getElementById('mercado-select').options[document.getElementById('mercado-select').selectedIndex];
    const mercadoDisplay = mercadoConfig.textContent;
    
    const agora=new Date();
    const timestamp = `${agora.getHours().toString().padStart(2,'0')}:${agora.getMinutes().toString().padStart(2,'0')}`;

    const html = renderAnalise(dados, {
      mercado:mercadoDisplay,
      mercadoValue:mv,
      ligaDisplay,
      casa:casaNome,
      gales,
      periodo
    });

    const ranking = dados.ranking || {};
    const acertos = Object.values(ranking).reduce((s,t)=>s+t.d, 0);
    const total = Object.values(ranking).reduce((s,t)=>s+t.v, 0);
    const acuracia = total>0 ? Math.round((acertos/total)*100) : 0;
    const score = (acuracia >= 70 ? 85 : acuracia >= 50 ? 65 : 45);

    // Salvar no histórico
    salvarNoHistorico({
      timestamp,
      casa: casaNome,
      casa_key: casa,
      liga: ligaDisplay,
      liga_key: liga,
      mercado: mercadoDisplay,
      mercado_key: mv,
      periodo,
      gales,
      score,
      acuracia
    });

    rc.innerHTML=`<div class="result-container"><div class="result-header"><div class="result-dot"></div><div class="result-title">✓ Análise Concluída — ${casaNome} • ${ligaDisplay} • ${timestamp}</div></div><div class="result-body">${html}</div></div>`;

    btn.disabled=false;
    btn.innerHTML='↺ Nova Análise';
    btn.onclick=()=>limparAnalise();

  } catch(error){
    rc.innerHTML=`<div class="result-container"><div class="result-header"><div class="result-dot" style="background:var(--red);box-shadow:0 0 15px rgba(255,68,68,0.6)"></div><div class="result-title" style="color:var(--red)">✖ Erro na Análise</div></div><div class="result-body"><div class="error-box"><strong>Erro:</strong> ${error.message}</div></div></div>`;
    btn.disabled=false;
    btn.innerHTML='▶ Gerar Análise';
    btn.onclick=gerarAnalise;
  }
}

function limparAnalise() {
  document.getElementById('casas-select').value = '';
  document.getElementById('liga-select').innerHTML = '<option value="">Selecione uma casa primeiro...</option>';
  document.getElementById('mercado-select').value = '';
  document.getElementById('result-container').innerHTML = '';
  const btn = document.getElementById('btn-gerar');
  btn.className = 'btn-action btn-generate';
  btn.innerHTML = '▶ Gerar Análise';
  btn.onclick = gerarAnalise;
  btn.disabled = false;
}
