<head>

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg-primary: #0a0e1a;
      --bg-secondary: #141829;
      --bg-card: #1a1f2e;
      --bg-card-hover: #232d3f;
      --bg-top: #0d1c1f;
      --border: #2a3555;
      --border-accent: #1a4750;
      --accent: #00d9ff;
      --accent-dim: #0099cc;
      --accent-muted: rgba(0, 217, 255, 0.08);
      --text-primary: #e4e8f0;
      --text-secondary: #8b95a8;
      --text-accent: #00d9ff;
      --green: #00ff7f;
      --red: #ff4444;
      --orange: #ffa500;
      --purple: #b700ff;
      --cyan: #00e5ff;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: "DM Sans", sans-serif;
      background: linear-gradient(135deg, var(--bg-primary) 0%, #0f1422 50%, var(--bg-primary) 100%);
      background-attachment: fixed;
      color: var(--text-primary);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    #header { position: sticky; top: 0; z-index: 100; }

    .page-wrapper {
      max-width: 1600px;
      margin: 0 auto;
      padding: 28px 24px 60px;
    }

    /* ── AI GLOW EFFECT ── */
    .glow-accent {
      box-shadow: 0 0 20px rgba(0, 217, 255, 0.15), 0 0 40px rgba(0, 217, 255, 0.08);
      border: 1px solid rgba(0, 217, 255, 0.3);
    }

    .glow-success {
      box-shadow: 0 0 20px rgba(0, 255, 127, 0.15), 0 0 40px rgba(0, 255, 127, 0.08);
      border: 1px solid rgba(0, 255, 127, 0.3);
    }

    .glow-danger {
      box-shadow: 0 0 20px rgba(255, 68, 68, 0.15), 0 0 40px rgba(255, 68, 68, 0.08);
      border: 1px solid rgba(255, 68, 68, 0.3);
    }

    /* ── SECTION TITLE ── */
    .section-title {
      font-size: 0.65rem;
      font-family: "JetBrains Mono", monospace;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-title::before {
      content: "⟨";
      opacity: 0.6;
    }

    .section-title::after {
      content: "⟩";
      opacity: 0.6;
    }

    /* ── FILTER SECTION ── */
    .filter-section {
      background: linear-gradient(135deg, var(--bg-secondary) 0%, rgba(20, 24, 41, 0.5) 100%);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 28px;
      backdrop-filter: blur(10px);
    }

    .filter-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 20px;
    }

    .filter-group {
      display: flex;
      flex-direction: column;
    }

    .filter-label {
      font-size: 0.62rem;
      font-family: "JetBrains Mono", monospace;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 10px;
      font-weight: 600;
      opacity: 0.9;
    }

    select {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-primary);
      font-family: "DM Sans", sans-serif;
      font-size: 0.85rem;
      padding: 12px 14px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.25s;
      appearance: none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2300d9ff' stroke-width='2'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 8px center;
      background-size: 20px;
      padding-right: 36px;
    }

    select:hover {
      border-color: var(--accent);
      box-shadow: 0 0 15px rgba(0, 217, 255, 0.1);
    }

    select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 20px rgba(0, 217, 255, 0.2);
      background-color: var(--bg-card-hover);
    }

    select option {
      background: var(--bg-card);
      color: var(--text-primary);
    }

    .divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 20px 0;
    }

    .actions-bar {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn-action {
      flex: 1;
      min-width: 140px;
      padding: 14px 24px;
      border: 1px solid;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      font-family: "JetBrains Mono", monospace;
      cursor: pointer;
      transition: all 0.25s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .btn-clear {
      background: transparent;
      border-color: var(--border);
      color: var(--text-secondary);
    }
    .btn-clear:hover {
      border-color: var(--orange);
      color: var(--orange);
      box-shadow: 0 0 15px rgba(255, 165, 0, 0.1);
    }

    .btn-generate {
      background: linear-gradient(135deg, var(--accent) 0%, var(--cyan) 100%);
      color: var(--bg-primary);
      border-color: var(--accent);
      font-weight: 700;
    }
    .btn-generate:hover:not(:disabled) {
      box-shadow: 0 0 30px rgba(0, 217, 255, 0.4);
      transform: translateY(-2px);
    }
    .btn-generate:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(0, 217, 255, 0.3);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: inline-block;
      flex-shrink: 0;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── DASHBOARD HISTÓRICO ── */
    .history-section {
      margin-bottom: 28px;
    }

    .history-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 14px;
      max-height: 400px;
      overflow-y: auto;
      padding: 4px;
    }

    .history-grid::-webkit-scrollbar {
      width: 6px;
    }

    .history-grid::-webkit-scrollbar-track {
      background: transparent;
    }

    .history-grid::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }

    .history-card {
      background: linear-gradient(135deg, var(--bg-card) 0%, rgba(26, 31, 46, 0.6) 100%);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      cursor: pointer;
      transition: all 0.25s;
      position: relative;
      overflow: hidden;
    }

    .history-card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
      box-shadow: 0 8px 24px rgba(0, 217, 255, 0.12);
    }

    .history-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity: 0;
      transition: opacity 0.25s;
    }

    .history-card:hover::before {
      opacity: 1;
    }

    .hc-header {
      display: flex;
      justify-content: space-between;
      align-items: start;
      margin-bottom: 10px;
    }

    .hc-time {
      font-size: 0.62rem;
      font-family: "JetBrains Mono", monospace;
      color: var(--text-secondary);
      letter-spacing: 0.05em;
    }

    .hc-score {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--accent);
      font-family: "JetBrains Mono", monospace;
    }

    .hc-info {
      font-size: 0.7rem;
      color: var(--text-secondary);
      margin-bottom: 8px;
      line-height: 1.4;
    }

    .hc-badge {
      display: inline-block;
      font-size: 0.6rem;
      padding: 3px 8px;
      background: var(--accent-muted);
      color: var(--accent);
      border-radius: 4px;
      margin-right: 4px;
      margin-bottom: 4px;
      font-weight: 600;
    }

    /* ── RESULT SECTION ── */
    .result-container {
      background: linear-gradient(135deg, var(--bg-secondary) 0%, rgba(20, 24, 41, 0.5) 100%);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 28px;
      backdrop-filter: blur(10px);
    }

    .result-header {
      background: linear-gradient(90deg, var(--accent-muted) 0%, rgba(0, 217, 255, 0.05) 100%);
      border-bottom: 2px solid var(--accent);
      padding: 20px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .result-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
      box-shadow: 0 0 15px rgba(0, 217, 255, 0.6);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 15px rgba(0, 217, 255, 0.6); }
      50% { box-shadow: 0 0 25px rgba(0, 217, 255, 0.3); }
    }

    .result-title {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--accent);
      font-family: "JetBrains Mono", monospace;
      letter-spacing: 0.08em;
    }

    .liga-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 14px 24px;
      border-bottom: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.2);
    }

    .liga-tab {
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 0.73rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-secondary);
      font-family: "JetBrains Mono", monospace;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .liga-tab:hover {
      color: var(--accent);
      border-color: var(--accent);
    }
    .liga-tab.active {
      background: var(--accent-muted);
      color: var(--accent);
      border-color: var(--accent);
      box-shadow: 0 0 15px rgba(0, 217, 255, 0.2);
    }

    .liga-panel {
      display: none;
    }
    .liga-panel.active {
      display: block;
    }

    .result-body {
      padding: 24px;
    }

    .analysis-block {
      margin-bottom: 24px;
      padding-bottom: 24px;
      border-bottom: 1px dashed var(--border);
    }
    .analysis-block:last-child {
      margin-bottom: 0;
      padding-bottom: 0;
      border-bottom: none;
    }

    .block-title {
      font-size: 0.62rem;
      font-family: "JetBrains Mono", monospace;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 14px;
      font-weight: 600;
    }

    .score-row {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 10px;
      padding: 12px;
      background: var(--bg-card);
      border-radius: 8px;
      border-left: 3px solid var(--accent);
    }

    .score-badge {
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--accent);
      line-height: 1;
      font-family: "JetBrains Mono", monospace;
      min-width: 60px;
      text-align: center;
    }

    .score-bar {
      flex: 1;
      height: 6px;
      background: var(--bg-secondary);
      border-radius: 3px;
      overflow: hidden;
      min-width: 100px;
      border: 1px solid var(--border);
    }

    .score-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--cyan) 0%, var(--accent) 100%);
      border-radius: 3px;
      box-shadow: 0 0 10px rgba(0, 217, 255, 0.5);
    }

    .meta-line {
      font-size: 0.73rem;
      color: var(--text-secondary);
      margin-top: 6px;
      font-family: "JetBrains Mono", monospace;
      letter-spacing: 0.02em;
    }
    .meta-line strong {
      color: var(--accent);
      font-weight: 700;
    }

    .rec-box {
      border-radius: 8px;
      padding: 14px 16px;
      font-size: 0.78rem;
      font-weight: 500;
      line-height: 1.7;
      border-left: 3px solid;
      font-family: "DM Sans", sans-serif;
      backdrop-filter: blur(5px);
    }

    .rec-forte {
      background: rgba(0, 255, 127, 0.08);
      border-color: var(--green);
      color: var(--green);
    }

    .rec-normal {
      background: rgba(255, 165, 0, 0.08);
      border-color: var(--orange);
      color: var(--orange);
    }

    .rec-cautela {
      background: rgba(255, 165, 0, 0.08);
      border-color: var(--orange);
      color: var(--orange);
    }

    .rec-aguardar {
      background: rgba(255, 68, 68, 0.08);
      border-color: var(--red);
      color: var(--red);
    }

    .odd-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.74rem;
      margin-top: 12px;
      font-family: "JetBrains Mono", monospace;
    }

    .odd-table th {
      text-align: left;
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      padding: 10px 12px;
      border-bottom: 2px solid var(--accent);
      background: var(--bg-card);
    }

    .odd-table td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      color: var(--text-secondary);
    }

    .odd-table tr:last-child td {
      border-bottom: none;
    }

    .match-name {
      color: var(--text-primary);
      font-weight: 600;
    }

    .loading-indicator {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.8rem;
      color: var(--accent);
      padding: 16px 0;
      font-family: "JetBrains Mono", monospace;
      letter-spacing: 0.05em;
    }

    .error-box {
      background: rgba(255, 68, 68, 0.08);
      border: 1px solid var(--red);
      border-left: 3px solid var(--red);
      border-radius: 8px;
      padding: 14px 16px;
      color: var(--red);
      font-size: 0.78rem;
      line-height: 1.6;
      font-family: "DM Sans", sans-serif;
    }

    @media (max-width: 768px) {
      .page-wrapper { padding: 16px 12px 40px; }
      .filter-grid { grid-template-columns: 1fr; }
      .history-grid { grid-template-columns: 1fr; }
      .score-badge { font-size: 1.6rem; }
      .btn-action { min-width: 100px; font-size: 0.75rem; padding: 12px 16px; }
    }
  </style>
</head>

<body>
  <div id="header"></div>

  <div class="page-wrapper">

    <!-- FILTER CARD -->
    <div class="filter-section">
      <div class="section-title">⚙ Configuração de Análise</div>

      <div class="filter-grid">
        <div class="filter-group">
          <label class="filter-label">Casa de Aposta</label>
          <select id="casas-select" onchange="atualizarLigas()">
            <option value="">Selecione...</option>
            <option value="betano">Betano</option>
            <option value="betsson">Betsson</option>
            <option value="kiron">Kiron</option>
            <option value="estrela">Estrelabet</option>
            <option value="bet365">Bet365</option>
          </select>
        </div>

        <div class="filter-group">
          <label class="filter-label">Liga</label>
          <select id="liga-select">
            <option value="">Selecione uma casa primeiro...</option>
          </select>
        </div>

        <div class="filter-group">
          <label class="filter-label">Período de Análise</label>
          <select id="periodo-select">
            <option value="120">6h</option>
            <option value="240">12h</option>
            <option value="480" selected>24h</option>
            <option value="960">48h</option>
            <option value="1440">72h</option>
          </select>
        </div>

        <div class="filter-group">
          <label class="filter-label">Gales (Martingale)</label>
          <select id="gales-select">
            <option value="0" selected>Nenhum</option>
            <option value="1">1 Gale</option>
            <option value="2">2 Gales</option>
            <option value="3">3 Gales</option>
            <option value="4">4 Gales</option>
            <option value="5">5 Gales</option>
          </select>
        </div>

        <div class="filter-group">
          <label class="filter-label">Mercado da Análise</label>
          <select id="mercado-select">
            <option value="">Selecione...</option>
            <option value="casaVence">Casa Vence</option>
            <option value="foraVence">Fora Vence</option>
            <option value="empate">Empate</option>
            <option value="ambasMarcam">Ambas Marcam Sim</option>
            <option value="ambasNaoMarcam">Ambas Não Marcam</option>
            <option value="over1.5">Over 1.5</option>
            <option value="over2.5">Over 2.5</option>
            <option value="over3.5">Over 3.5</option>
            <option value="under1.5">Under 1.5</option>
            <option value="under2.5">Under 2.5</option>
            <option value="under3.5">Under 3.5</option>
            <option value="over5">5+ Gols</option>
            <option value="exact1">1 Gol Exato</option>
            <option value="exact2">2 Gols Exatos</option>
            <option value="exact3">3 Gols Exatos</option>
            <option value="exact4">4 Gols Exatos</option>
          </select>
        </div>
      </div>

      <hr class="divider">

      <div class="actions-bar">
        <button class="btn-action btn-clear" onclick="limparAnalise()">✕ Limpar</button>
        <button class="btn-action btn-generate" id="btn-gerar" onclick="gerarAnalise()">▶ Gerar Análise</button>
      </div>
    </div>

    <!-- DASHBOARD HISTÓRICO -->
    <div class="history-section">
      <div class="section-title">📊 Histórico de Análises</div>
      <div class="history-grid" id="history-grid">
        <div style="grid-column:1/-1;padding:20px;text-align:center;color:var(--text-secondary);font-size:0.8rem;">Nenhuma análise realizada ainda. Gere sua primeira análise!</div>
      </div>
    </div>

    <!-- RESULTADO -->
    <div id="result-container"></div>
