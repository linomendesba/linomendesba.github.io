<style>
:root {
  --bg-primary: #111318;
  --bg-secondary: #181c23;
  --bg-card: #1e232d;
  --bg-card-hover: #242a36;
  --bg-top: #0d1c1f;
  --border: #2a3040;
  --border-accent: #1a4750;
  --accent: #177b8e;
  --accent-dim: #115c6b;
  --accent-muted: rgba(23, 123, 142, 0.14);
  --text-primary: #e4e8f0;
  --text-secondary: #7a8499;
  --text-accent: #177b8e;
  --green: #2ecc71;
  --red: #e74c3c;
  --orange: #e6a817;
  --red-bg: #1a0d0d;
  --green-bg: #0a1f16;
  --odd-color: #e6a817;
}

* { 
  margin: 0; 
  padding: 0; 
  box-sizing: border-box; 
}

body { 
  font-family: "DM Sans", sans-serif; 
  background-color: var(--bg-primary); 
  color: var(--text-primary); 
  min-height: 100vh; 
  -webkit-font-smoothing: antialiased; 
}

#header { 
  position: sticky; 
  top: 0; 
  z-index: 100; 
}

.page-wrapper {
  max-width: 1600px;
  margin: 0 auto;
  padding: 28px 24px 60px;
}

/* ── CARD ── */
.card { 
  background: var(--bg-secondary); 
  border: 1px solid var(--border); 
  border-radius: 10px; 
  padding: 20px 24px; 
  margin-bottom: 20px; 
}

/* ── CONFIG GRID ── */
.config-grid { 
  display: grid; 
  grid-template-columns: 1fr 1fr; 
  gap: 18px 24px; 
}
.config-grid .full { 
  grid-column: 1/-1; 
}

.field-label { 
  font-size: 0.7rem; 
  font-family: "DM Mono", monospace;
  font-weight: 600; 
  letter-spacing: 0.14em; 
  text-transform: uppercase; 
  color: var(--text-accent); 
  margin-bottom: 12px; 
}

.multi-hint { 
  font-size: 0.71rem; 
  color: var(--text-secondary); 
  margin-bottom: 8px; 
}

/* ── BOTÕES ── */
.btn-grid { 
  display: flex; 
  flex-wrap: wrap; 
  gap: 8px; 
}

.btn { 
  background: var(--bg-card); 
  color: var(--text-secondary); 
  border: 1px solid var(--border); 
  padding: 9px 18px; 
  border-radius: 8px; 
  font-size: 0.8rem; 
  font-weight: 500; 
  cursor: pointer; 
  transition: all 0.15s; 
  font-family: "DM Sans", sans-serif; 
  white-space: nowrap; 
}

.btn:hover { 
  color: var(--text-primary); 
  border-color: var(--accent-dim); 
}

.btn.active { 
  background: var(--accent-muted); 
  color: var(--accent); 
  border-color: var(--accent); 
  font-weight: 600; 
}

/* ── DIVIDER ── */
.divider { 
  border: none; 
  border-top: 1px solid var(--border); 
  margin: 18px 0; 
}

/* ── AÇÕES ── */
.actions { 
  display: flex; 
  gap: 8px; 
}

.action-btn { 
  flex: 1; 
  padding: 12px 20px; 
  border: none; 
  border-radius: 8px; 
  font-size: 0.875rem; 
  font-weight: 600; 
  cursor: pointer; 
  transition: all 0.15s; 
  font-family: "DM Sans", sans-serif; 
  display: flex; 
  align-items: center; 
  justify-content: center; 
  gap: 8px; 
}

.btn-clear { 
  background: transparent; 
  color: var(--text-secondary); 
  border: 1px solid var(--border); 
  flex: 0 0 auto; 
}

.btn-clear:hover { 
  background: var(--bg-card); 
  color: var(--text-primary); 
  border-color: var(--border-accent); 
}

.btn-generate { 
  background: var(--accent); 
  color: #fff; 
  flex: 1; 
}

.btn-generate:hover { 
  background: var(--accent-dim); 
}

.btn-generate:disabled { 
  opacity: 0.45; 
  cursor: not-allowed; 
}

.btn-nova { 
  background: var(--bg-card); 
  color: var(--accent); 
  border: 1px solid var(--border-accent); 
  flex: 1; 
}

.btn-nova:hover { 
  background: var(--accent-muted); 
}

/* ── SPINNER ── */
.spinner { 
  width: 13px; 
  height: 13px; 
  border: 2px solid rgba(23, 123, 142, 0.3); 
  border-top-color: var(--accent); 
  border-radius: 50%; 
  animation: spin 0.7s linear infinite; 
  display: inline-block; 
  flex-shrink: 0; 
}

@keyframes spin { 
  to { transform: rotate(360deg); } 
}

/* ── RESULT ── */
.result-card { 
  background: var(--bg-secondary); 
  border: 1px solid var(--border); 
  border-radius: 10px; 
  overflow: hidden; 
  margin-bottom: 20px; 
}

.result-header { 
  background: linear-gradient(135deg, var(--bg-card) 0%, var(--bg-top) 100%);
  border-bottom: 1px solid var(--border-accent); 
  padding: 16px 24px; 
  display: flex; 
  align-items: center; 
  gap: 12px; 
}

.result-dot { 
  width: 8px; 
  height: 8px; 
  border-radius: 50%; 
  background: var(--accent); 
  flex-shrink: 0; 
}

.result-title-text { 
  font-size: 0.88rem; 
  font-family: "DM Mono", monospace;
  font-weight: 600; 
  color: var(--accent); 
}

/* ── LIGA TABS ── */
.liga-tabs { 
  display: flex; 
  flex-wrap: wrap; 
  gap: 8px; 
  padding: 12px 24px; 
  border-bottom: 1px solid var(--border); 
}

.liga-tab { 
  padding: 9px 18px; 
  border-radius: 8px; 
  font-size: 0.8rem; 
  font-weight: 500; 
  cursor: pointer; 
  transition: all 0.15s; 
  border: 1px solid var(--border); 
  background: var(--bg-card); 
  color: var(--text-secondary); 
  font-family: "DM Sans", sans-serif; 
}

.liga-tab:hover { 
  color: var(--text-primary); 
  border-color: var(--accent-dim); 
}

.liga-tab.active { 
  background: var(--accent-muted); 
  color: var(--accent); 
  border-color: var(--accent); 
  font-weight: 600; 
}

.liga-panel { 
  display: none; 
}

.liga-panel.active { 
  display: block; 
}

/* ── RESULT BODY ── */
.result-body { 
  padding: 24px; 
}

/* ── BLOCKS ── */
.analysis-block { 
  margin-bottom: 20px; 
  padding-bottom: 20px; 
  border-bottom: 1px solid var(--border); 
}

.analysis-block:last-child { 
  margin-bottom: 0; 
  padding-bottom: 0; 
  border-bottom: none; 
}

.block-title { 
  font-size: 0.7rem; 
  font-family: "DM Mono", monospace;
  font-weight: 600; 
  letter-spacing: 0.14em; 
  text-transform: uppercase; 
  color: var(--text-accent); 
  margin-bottom: 12px; 
}

.analysis-meta { 
  display: flex; 
  flex-wrap: wrap; 
  gap: 12px 20px; 
  font-size: 0.79rem; 
  color: var(--text-secondary); 
}

.analysis-meta strong { 
  color: var(--text-primary); 
  font-weight: 500; 
}

.score-row { 
  display: flex; 
  align-items: center; 
  gap: 12px; 
  flex-wrap: wrap; 
}

.score-badge { 
  font-size: 1.55rem; 
  font-weight: 700; 
  color: var(--accent); 
  line-height: 1; 
}

.score-label { 
  font-size: 0.77rem; 
  font-weight: 700; 
  color: var(--accent); 
  text-transform: uppercase; 
  letter-spacing: 0.5px; 
}

.score-detail { 
  font-size: 0.74rem; 
  color: var(--text-secondary); 
  margin-top: 4px; 
}

.score-bar-track { 
  flex: 1; 
  min-width: 90px; 
  height: 5px; 
  background: var(--bg-card); 
  border-radius: 3px; 
  overflow: hidden; 
}

.score-bar-fill { 
  height: 100%; 
  background: var(--accent); 
  border-radius: 3px; 
}

.streak-row { 
  display: flex; 
  align-items: center; 
  gap: 8px; 
  font-size: 0.84rem; 
}

.streak-dot { 
  width: 8px; 
  height: 8px; 
  border-radius: 50%; 
  flex-shrink: 0; 
}

.s-green { 
  background: var(--green); 
}

.s-red { 
  background: var(--red); 
}

.streak-alert { 
  font-size: 0.74rem; 
  color: var(--orange); 
  margin-top: 4px; 
}

.times-grid { 
  display: flex; 
  flex-wrap: wrap; 
  gap: 8px; 
}

.time-chip { 
  background: var(--bg-card); 
  border: 1px solid var(--border); 
  border-radius: 4px; 
  padding: 6px 10px; 
  font-size: 0.75rem; 
  color: var(--text-secondary); 
}

.time-chip strong { 
  color: var(--text-primary); 
  font-weight: 500; 
}

.stat-line { 
  font-size: 0.79rem; 
  color: var(--text-secondary); 
  margin-top: 8px; 
}

.stat-line strong { 
  color: var(--text-primary); 
}

.pattern-list { 
  display: flex; 
  flex-direction: column; 
  gap: 8px; 
}

.pattern-item { 
  background: var(--bg-card); 
  border: 1px solid var(--border); 
  border-radius: 7px; 
  padding: 10px 14px; 
}

.pattern-name { 
  font-size: 0.79rem; 
  font-weight: 500; 
  color: var(--text-primary); 
  margin-bottom: 6px; 
  word-break: break-word; 
}

.pattern-stats { 
  display: flex; 
  flex-wrap: wrap; 
  gap: 8px 14px; 
  font-size: 0.71rem; 
  color: var(--text-secondary); 
}

.pct-ex { 
  color: var(--accent); 
  font-weight: 700; 
}

.pattern-num { 
  font-size: 0.88rem; 
  font-weight: 700; 
  color: var(--orange); 
}

/* ── OPORTUNIDADES ── */
.opp-list { 
  display: flex; 
  flex-direction: column; 
  gap: 10px; 
}

.opp-item { 
  display: flex; 
  align-items: center; 
  gap: 12px; 
  flex-wrap: wrap;
  background: var(--bg-card); 
  border: 1px solid var(--border); 
  border-radius: 8px; 
  padding: 10px 14px;
  font-size: 0.75rem;
}

.opp-item.principal { 
  border-color: var(--border-accent); 
  background: var(--bg-top);
}

.opp-role { 
  background: var(--bg-secondary); 
  padding: 3px 8px; 
  border-radius: 4px; 
  color: var(--text-secondary); 
  font-weight: 500; 
  font-size: 0.68rem;
}

.opp-role.pr { 
  background: var(--accent-muted); 
  color: var(--accent); 
  font-weight: 600;
}

.opp-time { 
  font-family: "DM Mono", monospace;
  color: var(--accent); 
  font-weight: 600; 
}

.opp-match { 
  color: var(--text-primary); 
  font-weight: 500; 
}

.opp-odd { 
  font-family: "DM Mono", monospace;
  color: var(--orange); 
  font-weight: 700; 
}

.opp-tag { 
  font-size: 0.68rem; 
  color: var(--accent); 
  padding: 2px 6px; 
  background: var(--accent-muted); 
  border-radius: 3px; 
  font-weight: 600;
}

.opp-just { 
  font-size: 0.71rem; 
  color: var(--text-secondary); 
  margin-top: 8px; 
  padding-top: 8px; 
  border-top: 1px dashed var(--border);
}

/* ── PRÓXIMOS COM ODD ── */
.odds-table-wrap { 
  overflow-x: auto; 
}

.next-table { 
  width: 100%; 
  border-collapse: collapse; 
  font-size: 0.79rem; 
}

.next-table thead { 
  border-bottom: 1px solid var(--border); 
}

.next-table th { 
  padding: 8px 12px; 
  text-align: left; 
  color: var(--text-secondary); 
  font-weight: 600; 
  text-transform: uppercase; 
  font-size: 0.68rem;
  letter-spacing: 0.06em;
}

.next-table td { 
  padding: 8px 12px; 
  border-bottom: 1px dashed var(--border); 
  color: var(--text-primary); 
}

.next-table tbody tr:last-child td { 
  border-bottom: none; 
}

.match-name { 
  font-weight: 500; 
  color: var(--text-primary); 
}

/* ── MARTINGALE ── */
.mart-text { 
  font-size: 0.81rem; 
  color: var(--text-secondary); 
  line-height: 1.6;
}

/* ── RECOMENDAÇÃO ── */
.rec-box { 
  padding: 12px 16px; 
  border-radius: 8px; 
  font-size: 0.81rem; 
  line-height: 1.6; 
  border: 1px solid var(--border); 
  background: var(--bg-card);
}

.rec-forte { 
  border-color: var(--green); 
  color: var(--green); 
  background: rgba(46, 204, 113, 0.08);
}

.rec-normal { 
  border-color: var(--accent); 
  color: var(--accent); 
  background: var(--accent-muted);
}

.rec-cautela { 
  border-color: var(--orange); 
  color: var(--orange); 
  background: rgba(230, 168, 23, 0.08);
}

.rec-aguardar { 
  border-color: var(--red); 
  color: var(--red); 
  background: rgba(231, 76, 60, 0.08);
}

/* ── ERROR BOX ── */
.error-box { 
  padding: 12px 16px; 
  background: rgba(231, 76, 60, 0.08); 
  border: 1px solid var(--red); 
  border-radius: 8px; 
  color: var(--text-secondary); 
  font-size: 0.81rem;
}

.error-box strong { 
  color: var(--red); 
}

/* ── LOADING BOX ── */
.loading-box { 
  display: flex; 
  align-items: center; 
  gap: 8px; 
  color: var(--text-secondary); 
  font-size: 0.81rem;
}

/* ── RESPONSIVE ── */
@media (max-width: 768px) {
  .page-wrapper {
    padding: 20px 16px 40px;
  }

  .config-grid { 
    grid-template-columns: 1fr; 
    gap: 12px;
  }

  .card { 
    padding: 16px 20px; 
  }

  .action-btn { 
    padding: 10px 16px; 
    font-size: 0.8rem;
  }

  .analysis-meta { 
    gap: 8px 16px; 
  }
}
</style>

</head>
<body>

<div id="header"></div>

<div class="page-wrapper">
  <!-- SEÇÃO DE CONFIGURAÇÃO -->
  <div class="card">
    <div class="config-grid">
      <!-- Casa -->
      <div>
        <label class="field-label">Casa</label>
        <select id="casas-group" class="btn" style="width:100%">
          <option value="">Selecione...</option>
          <option value="betano">Betano</option>
          <option value="bet365">Bet365</option>
          <option value="kiron">Kiron</option>
        </select>
      </div>

      <!-- Mercado -->
      <div>
        <label class="field-label">Mercado</label>
        <select id="mercados-group" class="btn" style="width:100%">
          <option value="">Selecione...</option>
          <option value="u0_5">Under 0.5</option>
          <option value="u1_5">Under 1.5</option>
          <option value="u2_5">Under 2.5</option>
          <option value="o0_5">Over 0.5</option>
          <option value="o1_5">Over 1.5</option>
          <option value="o2_5">Over 2.5</option>
        </select>
      </div>

      <!-- Liga(s) -->
      <div class="full">
        <label class="field-label">Liga(s)</label>
        <div class="multi-hint">Selecione uma ou mais</div>
        <div id="liga-checkboxes" class="btn-grid"></div>
      </div>

      <!-- Período de Análise -->
      <div>
        <label class="field-label">Período de Análise</label>
        <select id="periodo-group" class="btn" style="width:100%">
          <option value="20">Últimos 20 jogos</option>
          <option value="30">Últimos 30 jogos</option>
          <option value="50">Últimos 50 jogos</option>
          <option value="100">Últimos 100 jogos</option>
        </select>
      </div>

      <!-- Martingale -->
      <div>
        <label class="field-label">Cobertura Martingale</label>
        <select id="martingale-group" class="btn" style="width:100%">
          <option value="0">Nenhum</option>
          <option value="1">1 Cobertura</option>
          <option value="2">2 Coberturas</option>
          <option value="3">3 Coberturas</option>
        </select>
      </div>
    </div>

    <div class="divider"></div>

    <div class="actions">
      <button class="action-btn btn-clear" onclick="limparFiltros()">Limpar</button>
      <button class="action-btn btn-generate" id="btn-gerar" onclick="gerarAnalise()">Gerar Análise</button>
    </div>
  </div>

  <!-- RESULTADOS -->
  <div id="result-container" style="display:none;"></div>
</div>

<script>
  const casasConfig={betano:{name:'Betano',ligas:['Series A','Series B','Libertadores']},bet365:{name:'Bet365',ligas:['Premier','Championship','Euro']},kiron:{name:'Kiron',ligas:['Dinamarca','Suécia','Noruega','Holanda']}};
  const marketLabels={u0_5:'Under 0.5',u1_5:'Under 1.5',u2_5:'Under 2.5',o0_5:'Over 0.5',o1_5:'Over 1.5',o2_5:'Over 2.5'};
  
  function getSelectedValue(selectId){return document.getElementById(selectId)?.value||'';}
  function getSelectedText(selectId){return document.getElementById(selectId)?.options[document.getElementById(selectId).selectedIndex]?.text||'';}
  function getSelectedLigas(){const checks=document.querySelectorAll('#liga-checkboxes input[type="checkbox"]:checked');return Array.from(checks).map(c=>c.value);}
  
  function populateLigasSelect(){
    const casa=getSelectedValue('casas-group');
    const container=document.getElementById('liga-checkboxes');
    container.innerHTML='';
    if(casa&&casasConfig[casa]){
      casasConfig[casa].ligas.forEach(liga=>{
        const label=document.createElement('label');
        label.style.cssText='display:flex;align-items:center;gap:8px;cursor:pointer;padding:6px 10px;border-radius:6px;background:var(--bg-card);border:1px solid var(--border);transition:all 0.15s;flex:0 1 auto';
        const input=document.createElement('input');
        input.type='checkbox';
        input.value=liga;
        input.onchange=()=>{label.style.background=input.checked?'var(--accent-muted)':'var(--bg-card)';label.style.borderColor=input.checked?'var(--accent)':'var(--border)';};
        label.appendChild(input);
        label.appendChild(document.createTextNode(liga));
        container.appendChild(label);
      });
    }
  }

  document.getElementById('casas-group').addEventListener('change',populateLigasSelect);

  function limparFiltros(){
    document.getElementById('casas-group').value='';
    document.getElementById('mercados-group').value='';
    document.getElementById('periodo-group').value='20';
    document.getElementById('martingale-group').value='0';
    populateLigasSelect();
    document.getElementById('result-container').style.display='none';
  }

  function salvarConfig(){
    const config={
      casa:getSelectedValue('casas-group'),
      mercado:getSelectedValue('mercados-group'),
      ligas:getSelectedLigas(),
      periodo:getSelectedValue('periodo-group'),
      martingale:getSelectedValue('martingale-group')
    };
    localStorage.setItem('morfeus-config',JSON.stringify(config));
  }

  function restaurarConfig(){
    const saved=localStorage.getItem('morfeus-config');
    if(saved){
      const config=JSON.parse(saved);
      document.getElementById('casas-group').value=config.casa||'';
      document.getElementById('mercados-group').value=config.mercado||'';
      document.getElementById('periodo-group').value=config.periodo||'20';
      document.getElementById('martingale-group').value=config.martingale||'0';
      populateLigasSelect();
      if(config.ligas){
        config.ligas.forEach(liga=>{
          const check=document.querySelector(`#liga-checkboxes input[value="${liga}"]`);
          if(check){check.checked=true;check.onchange();}
        });
      }
    }
  }

  // Simular dados da API (substitua com sua API real)
  async function buscarDadosAPI(casa,liga,periodo){
    // Dados de exemplo
    return{
      dadosCru:[[2,1,'12:30','Time A','Time B'],[1,0,'14:00','Time C','Time D']],
      ranking:{},
      padroesEncontrados:{},
      totalJogos:2
    };
  }

  async function analyzeInWorker(dados,opts){
    // Análise de exemplo
    return{resultados:[]};
  }

  function calcularRankingTimes(jogos,mercado){return{};}
  function calcularStreak(dados,mercado){return null;}
  function calcularRankingOdds(dados,mercado){return{rankingExato:[],rankingFaixas:[],top5Odds:new Set(),top3Faixas:[]};}
  function calculateMarketAnalysis(dados,sm,total,ls,cob){return{top5:[]};}
  function mapMercado(mv){return mv;}

  async function gerarAnalise(){
    const casa=getSelectedValue('casas-group');
    const ligas=getSelectedLigas();
    const mv=getSelectedValue('mercados-group');
    const mt=getSelectedText('mercados-group');
    const periodo=getSelectedValue('periodo-group');

    if(!casa||ligas.length===0||!mv||!periodo){
      alert('Por favor, selecione Casa, Liga(s), Mercado e Período de Análise.');
      return;
    }

    salvarConfig();
    const btn=document.getElementById('btn-gerar');
    const rc=document.getElementById('result-container');
    btn.disabled=true;
    btn.innerHTML='<span class="spinner"></span> Processando...';
    rc.style.display='block';
    rc.innerHTML=`<div class="result-card"><div class="result-header"><div class="result-dot"></div><div class="result-title-text">Processando…</div></div><div class="result-body"><div class="loading-box"><span class="spinner"></span> Coletando dados de ${ligas.length} liga(s)…</div></div></div>`;

    try{
      const agora=new Date(),hora=`${String(agora.getHours()).padStart(2,'0')}:${String(agora.getMinutes()).padStart(2,'0')}`;
      let tabsHtml='',panelsHtml='';
      
      ligas.forEach((liga,idx)=>{
        const isFirst=idx===0;
        const casaNome=casasConfig[casa].name;
        tabsHtml+=`<button class="liga-tab${isFirst?' active':''}" onclick="switchTab(${idx})">${liga}</button>`;
        const html=`<div class="analysis-block"><div class="block-title">Análise</div><p style="color:var(--text-secondary);font-size:0.81rem">Análise de ${liga} — ${casaNome} — ${hora}</p></div>`;
        panelsHtml+=`<div class="liga-panel${isFirst?' active':''}">${html}</div>`;
      });

      const tabsSec=ligas.length>1?`<div class="liga-tabs">${tabsHtml}</div>`:'';
      rc.innerHTML=`<div class="result-card"><div class="result-header"><div class="result-dot"></div><div class="result-title-text">✓ Análise Concluída</div></div>${tabsSec}<div class="result-body">${panelsHtml}</div></div>`;

      btn.disabled=false;
      btn.className='action-btn btn-nova';
      btn.innerHTML='↺ Nova Análise';
      btn.onclick=novaAnalise;
    }catch(error){
      rc.innerHTML=`<div class="result-card"><div class="result-header"><div class="result-dot" style="background:var(--red)"></div><div class="result-title-text" style="color:var(--red)">✖ Erro</div></div><div class="result-body"><div class="error-box"><strong>Erro:</strong> ${error.message}</div></div></div>`;
      btn.disabled=false;
      btn.className='action-btn btn-generate';
      btn.innerHTML='Gerar Análise';
      btn.onclick=gerarAnalise;
    }
  }

  function switchTab(idx){
    document.querySelectorAll('.liga-tab').forEach((t,i)=>t.classList.toggle('active',i===idx));
    document.querySelectorAll('.liga-panel').forEach((p,i)=>p.classList.toggle('active',i===idx));
  }

  function novaAnalise(){
    document.getElementById('result-container').style.display='none';
    const btn=document.getElementById('btn-gerar');
    btn.className='action-btn btn-generate';
    btn.innerHTML='Gerar Análise';
    btn.onclick=gerarAnalise;
    btn.disabled=false;
  }

  document.addEventListener('DOMContentLoaded',restaurarConfig);
</script>

<script>
  fetch('header.html').then(r=>r.text()).then(d=>{document.getElementById('header').innerHTML=d;});
</script>
<script src="redirecionar.js"></script>
<script src="app.utils.min.js"></script>
</body>
</html>
