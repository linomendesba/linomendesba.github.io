    <style>
      .ligas-container { display: flex; flex-direction: column; gap: 22px; margin: 18px 0 60px; }
      .liga-card {
        border: 1px solid rgba(255,255,255,0.10);
        border-radius: 10px;
        overflow: hidden;
        background: rgba(255,255,255,0.02);
      }
      .liga-card-iframe { width: 100%; border: none; display: block; }
      .seletor-casa select { min-width: 200px; }
    </style>

  <body>

    <div id="header"></div>

    <br><br>

    <div id="errorMessage" class="error-message" style="display: none;"></div>

    <div class="seletor-container">
      <div class="seletor-casa">
        <select id="seletorCasa"></select>
      </div>
    </div>

    <div id="ligasContainer" class="ligas-container"></div>

    <script>
      // ═══════════════════════════════════════════════════════════════════
      // CASAS — copiado 1:1 do CASAS do buscadores.html (mesmo "res" usado
      // nas rotas /resultados|odds|proximos/ do backend). Se uma casa/liga
      // for adicionada ou renomeada lá, replicar aqui também.
      // ═══════════════════════════════════════════════════════════════════
      const CASAS = {
        betano: {
          label: 'Betano',
          ligas: [
            { label: 'Taça Glória Eterna',  res: encodeURIComponent('Taça Glória Eterna') },
            { label: 'Copa América',        res: encodeURIComponent('Copa América') },
            { label: 'Euro',                res: encodeURIComponent('Euro') },
            { label: 'Campeonato Italiano', res: encodeURIComponent('Campeonato Italiano') },
            { label: 'Copa das Estrelas',   res: encodeURIComponent('Copa das Estrelas') },
            { label: 'Brasileirão Betano',  res: encodeURIComponent('Brasileirão Betano') },
            { label: 'Mundial',             res: encodeURIComponent('Mundial') },
          ],
        },
        bet365: {
          label: 'Bet365',
          ligas: [
            { label: 'Copa',    res: 'bet365/Copa' },
            { label: 'Euro',    res: 'bet365/Euro' },
            { label: 'Super',   res: 'bet365/Super' },
            { label: 'Premier', res: 'bet365/Premier' },
          ],
        },
        betsson: {
          label: 'Betsson',
          ligas: [
            { label: 'Espanha',    res: 'betsson/Espanha' },
            { label: 'Inglaterra', res: 'betsson/Inglaterra' },
            { label: 'Brasil',     res: 'betsson/Brasil' },
          ],
        },
        kiron: {
          label: 'Kiron',
          ligas: [
            { label: 'Liga Inglaterra', res: 'kiron/England' },
            { label: 'Liga Itália',     res: 'kiron/Italy' },
            { label: 'Liga Espanha',    res: 'kiron/Spain' },
          ],
        },
        estrela: {
          label: 'EstrelaBet',
          ligas: [
            { label: 'Copa do Mundo',      res: 'estrela/Copa%20do%20Mundo' },
            { label: 'Ligas dos Campeões', res: 'estrela/Ligas%20dos%20Campe%C3%B5es' },
            { label: 'América Latina',     res: 'estrela/Am%C3%A9rica%20Latina' },
          ],
        },
      };

      const CASA_STORAGE_KEY = "multligas_casaSelecionada";

      function popularSeletorCasa() {
        const sel = document.getElementById("seletorCasa");
        sel.innerHTML = Object.entries(CASAS).map(
          ([key, c]) => `<option value="${key}">${c.label}</option>`
        ).join("");
        const salva = localStorage.getItem(CASA_STORAGE_KEY);
        if (salva && CASAS[salva]) sel.value = salva;
      }

      // Mede a altura REAL do conteúdo olhando a posição de fim (bottom) dos
      // elementos filhos diretos do body, em vez de scrollHeight.
      // Por quê: scrollHeight respeita qualquer height/min-height forçada
      // via CSS (ex.: algo em % ou vh no mult.css) — e como a gente MESMO
      // seta a altura do iframe a cada medição, um elemento com altura em
      // "%"/"vh" passa a se basear no valor que a gente acabou de setar,
      // criando um loop: mede → seta um pouco maior → esse "maior" vira a
      // nova base do %/vh → mede de novo maior ainda → cresce pra sempre.
      // getBoundingClientRect() dá a posição real renderizada do elemento,
      // que não é afetada por essa realimentação, então corta o loop.
      function medirAlturaConteudo(doc) {
        const body = doc.body;
        if (!body) return 0;
        const bodyTop = body.getBoundingClientRect().top;
        let maxBottom = 0;
        Array.from(body.children).forEach(el => {
          const rect = el.getBoundingClientRect();
          if (rect.bottom > maxBottom) maxBottom = rect.bottom;
        });
        return Math.ceil(maxBottom - bodyTop);
      }

      // Ajusta a altura do iframe pro conteúdo real da tabela dentro dele
      // (mesmo domínio, então dá pra ler contentDocument direto, sem postMessage).
      function ajustarAlturaIframe(iframe) {
        try {
          const doc = iframe.contentDocument || iframe.contentWindow.document;
          const altura = medirAlturaConteudo(doc);
          if (altura > 0) iframe.style.height = (altura + 24) + "px";
        } catch (e) {
          iframe.style.height = "900px"; // fallback se por algum motivo não der pra ler o iframe
        }
      }

      // Observa mudanças no conteúdo do iframe (dados atualizando, filtros
      // sendo trocados, popover de "+ Mercados" abrindo) pra re-ajustar a
      // altura na hora, sem esperar o polling. Debounce curto pra não medir
      // no meio de uma leva de mutações (ex.: tabela inteira sendo
      // reconstruída linha por linha) e não gerar chamadas em excesso.
      const _timersAltura = new WeakMap();
      function agendarAjusteAltura(iframe) {
        clearTimeout(_timersAltura.get(iframe));
        _timersAltura.set(iframe, setTimeout(() => ajustarAlturaIframe(iframe), 150));
      }

      function observarIframe(iframe) {
        try {
          const doc = iframe.contentDocument || iframe.contentWindow.document;
          const obs = new MutationObserver(() => agendarAjusteAltura(iframe));
          obs.observe(doc.body, { childList: true, subtree: true, attributes: true });
        } catch (e) {}
      }

      function montarLigasDaCasa(casaKey) {
        const cont = document.getElementById("ligasContainer");
        cont.innerHTML = "";
        const casa = CASAS[casaKey];
        if (!casa) return;

        casa.ligas.forEach(liga => {
          const card = document.createElement("div");
          card.className = "liga-card";

          const iframe = document.createElement("iframe");
          iframe.className = "liga-card-iframe";
          iframe.scrolling = "no";
          iframe.style.height = "400px"; // altura provisória até a 1ª medição
          iframe.src = `mult-liga-tabela.html?casa=${encodeURIComponent(casaKey)}`
                     + `&res=${encodeURIComponent(liga.res)}`
                     + `&label=${encodeURIComponent(liga.label)}`;

          iframe.addEventListener("load", () => {
            ajustarAlturaIframe(iframe);
            observarIframe(iframe);
          });

          card.appendChild(iframe);
          cont.appendChild(card);
        });
      }

      // Polling leve de reforço (cobre casos que a MutationObserver não
      // pegue, ex.: mudanças de layout sem mutação de DOM/atributo).
      function ajustarTodasAlturas() {
        document.querySelectorAll(".liga-card-iframe").forEach(ajustarAlturaIframe);
      }
      setInterval(ajustarTodasAlturas, 6000);

      popularSeletorCasa();
      const seletorCasaEl = document.getElementById("seletorCasa");
      montarLigasDaCasa(seletorCasaEl.value);

      seletorCasaEl.addEventListener("change", () => {
        localStorage.setItem(CASA_STORAGE_KEY, seletorCasaEl.value);
        montarLigasDaCasa(seletorCasaEl.value);
      });
    </script>

    <script src="header-loader.js"></script>
    <script src="redirecionar.js"></script>
  </body>
</html>
