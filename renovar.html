<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="img/favicon.ico" type="image/x-icon" />
    <title>BetStat | Renovar assinatura</title>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-primary: #111318;
            --bg-secondary: #181c23;
            --bg-card: #1e232d;
            --border: #2a3040;
            --accent: #177b8e;
            --accent-dim: #115c6b;
            --text-primary: #e4e8f0;
            --text-secondary: #7a8499;
            --red: #e74c3c;
            --green: #22c55e;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: radial-gradient(circle at 50% 35%, rgba(23, 123, 142, 0.16) 0%, transparent 55%), var(--bg-primary);
            font-family: 'DM Sans', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-primary);
            padding: 24px 0;
        }

        .box-container {
            background-color: var(--bg-secondary);
            padding: 40px;
            border-radius: 10px;
            border: 1px solid var(--border);
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        .logo { display: block; max-width: 160px; margin: 0 auto 20px; }

        h2 { font-size: 20px; font-weight: 600; margin-bottom: 6px; text-align: center; }
        .subtitle { font-size: 13px; color: var(--text-secondary); text-align: center; margin-bottom: 24px; }

        .input-group { margin-bottom: 16px; }
        .input-group label { display: block; font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; }
        .input-group input {
            width: 100%; padding: 11px 12px; background: var(--bg-card);
            border: 1px solid var(--border); border-radius: 8px; color: var(--text-primary);
            font-family: 'DM Sans', sans-serif; font-size: 14px; outline: none;
        }
        .input-group input:focus { border-color: var(--accent); }

        .btn-primary {
            width: 100%; padding: 12px; background: var(--accent); color: #fff; border: none;
            border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 4px;
        }
        .btn-primary:hover { background: var(--accent-dim); }
        .btn-primary:disabled { opacity: .6; cursor: not-allowed; }

        .btn-link {
            width: 100%; background: none; border: none; color: var(--text-secondary);
            font-size: 13px; margin-top: 14px; cursor: pointer; text-decoration: underline;
        }

        .error-msg {
            display: none; background: rgba(231,76,60,0.12); border: 1px solid rgba(231,76,60,0.3);
            color: var(--red); font-size: 13px; padding: 10px 12px; border-radius: 8px; margin-bottom: 16px;
        }

        #tela-pagamento { display: none; text-align: center; }
        #tela-pagamento img { width: 220px; height: 220px; border-radius: 10px; background: #fff; padding: 8px; margin: 10px auto 16px; display: block; }
        .pix-copia {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px;
            padding: 10px 12px; font-family: 'DM Mono', monospace; font-size: 11px;
            color: var(--text-secondary); word-break: break-all; margin-bottom: 14px; max-height: 70px; overflow-y: auto;
        }
        .status-aguardando {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            font-size: 13px; color: var(--text-secondary); margin-top: 10px;
        }
        .spinner {
            width: 14px; height: 14px; border: 2px solid var(--border);
            border-top-color: var(--accent); border-radius: 50%; animation: girar 0.8s linear infinite;
        }
        @keyframes girar { to { transform: rotate(360deg); } }
        .status-ok { color: var(--green); font-size: 14px; font-weight: 600; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="box-container">
        <img src="img/logo3.png" alt="BetStat" class="logo">

        <div id="tela-form">
            <h2>Renovar assinatura</h2>
            <p class="subtitle">Sua assinatura venceu. Pague o PIX abaixo pra reativar o acesso — seu login e senha continuam os mesmos.</p>

            <div class="error-msg" id="erro"></div>

            <div class="input-group">
                <label>E-mail cadastrado</label>
                <input type="email" id="email" placeholder="Seu e-mail">
            </div>

            <button class="btn-primary" id="btn-renovar" onclick="renovar()">Gerar PIX de renovação</button>
            <button class="btn-link" onclick="window.location.href='auth.html'">Voltar para o login</button>
        </div>

        <div id="tela-pagamento">
            <h2>Pague com PIX</h2>
            <p class="subtitle" id="valor-info"></p>
            <img id="pix-qr" src="" alt="QR Code PIX">
            <label style="text-align:left;display:block;">PIX copia e cola</label>
            <div class="pix-copia" id="pix-copia"></div>
            <button class="btn-primary" onclick="copiarPix()">Copiar código PIX</button>
            <div class="status-aguardando" id="status-aguardando">
                <div class="spinner"></div> Aguardando confirmação do pagamento...
            </div>
            <div class="status-ok" id="status-ok" style="display:none;">✅ Pagamento confirmado! Redirecionando para o login...</div>
        </div>
    </div>

    <script>
        const API_URL = 'https://betstat.site/admin';

        let refId = null;
        let pollTimer = null;

        function mostrarErro(msg) {
            const el = document.getElementById('erro');
            el.textContent = msg;
            el.style.display = 'block';
        }
        function esconderErro() {
            document.getElementById('erro').style.display = 'none';
        }


        (function preencherEmailDaUrl() {
            const params = new URLSearchParams(window.location.search);
            const email = params.get('email');
            if (email) document.getElementById('email').value = email;
        })();

        async function renovar() {
            esconderErro();
            const email = document.getElementById('email').value.trim();
            if (!email) return mostrarErro('Informe o e-mail cadastrado.');

            const btn = document.getElementById('btn-renovar');
            btn.disabled = true;
            btn.textContent = 'Gerando cobrança...';

            try {
                const resp = await fetch(API_URL + '/renovar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await resp.json();
                if (!resp.ok) throw new Error(data.error || 'Erro ao gerar cobrança de renovação.');

                refId = data.ref_id;
                document.getElementById('valor-info').textContent =
                    'Renovação mensal — R$ ' + Number(data.value).toFixed(2);
                document.getElementById('pix-qr').src = 'data:image/png;base64,' + data.pix.imagem;
                document.getElementById('pix-copia').textContent = data.pix.payload;

                document.getElementById('tela-form').style.display = 'none';
                document.getElementById('tela-pagamento').style.display = 'block';

                pollTimer = setInterval(verificarPagamento, 4000);
            } catch (err) {
                mostrarErro(err.message || 'Erro inesperado. Tente novamente.');
                btn.disabled = false;
                btn.textContent = 'Gerar PIX de renovação';
            }
        }

        async function verificarPagamento() {
            try {
                const resp = await fetch(API_URL + '/status-renovacao/' + refId);
                const data = await resp.json();
                if (data.status === 'done') {
                    clearInterval(pollTimer);
                    document.getElementById('status-aguardando').style.display = 'none';
                    document.getElementById('status-ok').style.display = 'block';
                    setTimeout(() => { window.location.href = 'auth.html'; }, 2000);
                }
            } catch (_) { /* próximo poll tenta de novo */ }
        }

        function copiarPix() {
            const texto = document.getElementById('pix-copia').textContent;
            navigator.clipboard.writeText(texto);
        }
    </script>
</body>
</html>
