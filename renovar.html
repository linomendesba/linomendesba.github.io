<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="img/favicon.ico" type="image/x-icon" />
    <title>BetStat | Renovar assinatura</title>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-primary: #111318; --bg-secondary: #181c23; --bg-card: #1e232d;
            --border: #2a3040; --accent: #177b8e; --accent-dim: #115c6b;
            --text-primary: #e4e8f0; --text-secondary: #7a8499;
            --red: #e74c3c; --green: #22c55e; --yellow: #eab308;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: radial-gradient(circle at 50% 35%, rgba(23, 123, 142, 0.16) 0%, transparent 55%), var(--bg-primary);
            font-family: 'DM Sans', sans-serif; display: flex; justify-content: center; align-items: center;
            min-height: 100vh; color: var(--text-primary); padding: 24px 0;
        }
        .box-container {
            background-color: var(--bg-secondary); padding: 40px; border-radius: 10px;
            border: 1px solid var(--border); width: 100%; max-width: 400px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4); text-align: center;
        }
        .logo { height: 55px; margin: 0 auto 20px; display: block; filter: drop-shadow(0 0 10px rgba(23, 123, 142, 0.25)); }
        h2 { font-size: 20px; margin-bottom: 8px; font-weight: 600; }
        .status-linha { font-size: 13px; color: var(--text-secondary); margin-bottom: 4px; }
        .venc-dias { font-size: 32px; font-weight: 700; font-family: 'DM Mono', monospace; margin: 14px 0 4px; }
        .venc-dias.ok { color: var(--green); }
        .venc-dias.alerta { color: var(--yellow); }
        .venc-dias.vencido { color: var(--red); }
        button {
            width: 100%; padding: 12px; border-radius: 8px; font-family: 'DM Sans', sans-serif;
            font-size: 15px; font-weight: 600; cursor: pointer; border: none; margin-top: 16px;
            transition: opacity 0.2s, background-color 0.2s;
        }
        .btn-primary { background-color: var(--accent); color: #fff; }
        .btn-primary:hover { background-color: var(--accent-dim); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        .aviso {
            background: rgba(234,179,8,0.1); border: 1px solid rgba(234,179,8,0.3);
            color: var(--yellow); font-size: 13px; padding: 10px 14px; border-radius: 8px; margin-top: 14px;
        }
        #tela-pagamento { display: none; margin-top: 10px; }
        #tela-pagamento img { width: 200px; height: 200px; border-radius: 10px; background: #fff; padding: 8px; margin: 10px auto; display: block; }
        .pix-copia {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px;
            padding: 10px 12px; font-family: 'DM Mono', monospace; font-size: 11px;
            color: var(--text-secondary); word-break: break-all; margin-bottom: 10px; max-height: 70px; overflow-y: auto;
        }
        .status-aguardando { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 13px; color: var(--text-secondary); margin-top: 10px; }
        .spinner { width: 14px; height: 14px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: girar 0.8s linear infinite; }
        @keyframes girar { to { transform: rotate(360deg); } }
        .status-ok { color: var(--green); font-size: 14px; font-weight: 600; margin-top: 10px; }
    </style>

            <button class="btn-primary" onclick="copiarPix()">Copiar código PIX</button>
            <div class="status-aguardando" id="status-aguardando">
