<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="img/favicon.ico" type="image/x-icon" />
    <title>BetStat | Renovar assinatura</title>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-primary: #111318; --bg-secondary: #181c23; --bg-card: #1e232d;
            --border: #2a3040; --accent: #177b8e; --accent-dim: #115c6b;
            --text-primary: #e4e8f0; --text-secondary: #7a8499;
            --red: #e74c3c; --green: #22c55e; --yellow: #eab308;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: radial-gradient(circle at 50% 35%, rgba(23, 123, 142, 0.16) 0%, transparent 55%), var(--bg-primary);
            font-family: 'DM Sans', sans-serif; display: flex; justify-content: center; align-items: center;
            min-height: 100vh; color: var(--text-primary); padding: 24px 0;
        }
        .box-container {
            background-color: var(--bg-secondary); padding: 40px; border-radius: 10px;
            border: 1px solid var(--border); width: 100%; max-width: 400px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4); text-align: center;
        }
        .logo { height: 55px; margin: 0 auto 20px; display: block; filter: drop-shadow(0 0 10px rgba(23, 123, 142, 0.25)); }
        h2 { font-size: 20px; margin-bottom: 8px; font-weight: 600; }
        .status-linha { font-size: 13px; color: var(--text-secondary); margin-bottom: 4px; }
        .venc-dias { font-size: 32px; font-weight: 700; font-family: 'DM Mono', monospace; margin: 14px 0 4px; }
        .venc-dias.ok { color: var(--green); }
        .venc-dias.alerta { color: var(--yellow); }
        .venc-dias.vencido { color: var(--red); }
        button {
            width: 100%; padding: 12px; border-radius: 8px; font-family: 'DM Sans', sans-serif;
            font-size: 15px; font-weight: 600; cursor: pointer; border: none; margin-top: 16px;
            transition: opacity 0.2s, background-color 0.2s;
        }
        .btn-primary { background-color: var(--accent); color: #fff; }
        .btn-primary:hover { background-color: var(--accent-dim); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        .aviso {
            background: rgba(234,179,8,0.1); border: 1px solid rgba(234,179,8,0.3);
            color: var(--yellow); font-size: 13px; padding: 10px 14px; border-radius: 8px; margin-top: 14px;
        }
        #tela-pagamento { display: none; margin-top: 10px; }
        #tela-pagamento img { width: 200px; height: 200px; border-radius: 10px; background: #fff; padding: 8px; margin: 10px auto; display: block; }
        .pix-copia {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px;
            padding: 10px 12px; font-family: 'DM Mono', monospace; font-size: 11px;
            color: var(--text-secondary); word-break: break-all; margin-bottom: 10px; max-height: 70px; overflow-y: auto;
        }
        .status-aguardando { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 13px; color: var(--text-secondary); margin-top: 10px; }
        .spinner { width: 14px; height: 14px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: girar 0.8s linear infinite; }
        @keyframes girar { to { transform: rotate(360deg); } }
        .status-ok { color: var(--green); font-size: 14px; font-weight: 600; margin-top: 10px; }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.0.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.0.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDmLGMBnUa2YOdP0b-zlZepXjm-zlV477A",
            authDomain: "linoautenticador.firebaseapp.com",
            projectId: "linoautenticador",
            storageBucket: "linoautenticador.firebasestorage.app",
            messagingSenderId: "946057648829",
            appId: "1:946057648829:web:ac5c2b1ba66e651f9d75d4",
            measurementId: "G-4WT805FFHQ"
        };

        const app  = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        window.API_URL = 'https://betstat.site/admin';

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = 'auth.html';
                return;
            }
            window.__idToken = await user.getIdToken();
            window.carregarStatus();
        });

        window.pegarTokenAtualizado = async () => {
            window.__idToken = await auth.currentUser.getIdToken(true);
            return window.__idToken;
        };
    </script>
</head>
<body>

    <div class="box-container">
        <img src="img/logo3.png" alt="BetStat" class="logo">
        <h2>Sua assinatura</h2>

        <div id="tela-status">
            <p class="status-linha" id="nome-cliente">Carregando...</p>
            <div class="venc-dias" id="dias-restantes">–</div>
            <p class="status-linha" id="venc-data"></p>

            <div class="aviso" id="aviso-bloqueado" style="display:none;">
                Sua assinatura venceu. Renove agora para reativar o acesso.
            </div>

            <div id="campo-cpf" style="display:none; text-align:left; margin-top:14px;">
                <label style="display:block; font-size:11px; color:var(--text-secondary); margin-bottom:6px;">Precisamos do seu CPF (só na primeira renovação)</label>
                <input type="text" id="cpf-input" placeholder="000.000.000-00" maxlength="14"
                       style="width:100%; padding:10px 14px; background:var(--bg-card); border:1px solid var(--border); border-radius:8px; color:var(--text-primary); font-family:'DM Mono', monospace; font-size:13px; outline:none;">
            </div>

            <button class="btn-primary" id="btn-renovar" onclick="iniciarRenovacao()" style="display:none;">Renovar por 1 mês</button>
        </div>

        <div id="tela-pagamento">
            <p class="status-linha">Pague com PIX para confirmar a renovação</p>
            <img id="pix-qr" src="" alt="QR Code PIX">
            <div class="pix-copia" id="pix-copia"></div>
            <button class="btn-primary" onclick="copiarPix()">Copiar código PIX</button>
            <div class="status-aguardando" id="status-aguardando">
                <div class="spinner"></div> Aguardando confirmação do pagamento...
            </div>
            <div class="status-ok" id="status-ok" style="display:none;">✅ Renovado com sucesso! Redirecionando...</div>
        </div>
    </div>

    <script>
        let ultimoDias = null;
        let pollTimer = null;

        async function carregarStatus() {
            try {
                const resp = await fetch(`${window.API_URL}/meu-status`, {
                    headers: { 'Authorization': 'Bearer ' + window.__idToken }
                });
                const data = await resp.json();
                if (!resp.ok) throw new Error(data.error || 'Erro ao carregar status.');

                ultimoDias = data.dias;
                document.getElementById('nome-cliente').textContent = data.name || data.email;
                document.getElementById('venc-data').textContent = data.venc ? `Vencimento: ${data.venc.split('-').reverse().join('/')}` : '';

                const el = document.getElementById('dias-restantes');
                if (data.dias === null) {
                    el.textContent = '–';
                } else if (data.dias < 0) {
                    el.textContent = `Venceu há ${Math.abs(data.dias)} dia(s)`;
                    el.className = 'venc-dias vencido';
                    document.getElementById('aviso-bloqueado').style.display = 'block';
                } else {
                    el.textContent = `${data.dias} dia(s)`;
                    el.className = data.dias <= 3 ? 'venc-dias alerta' : 'venc-dias ok';
                }

                document.getElementById('btn-renovar').style.display = data.pode_renovar ? 'block' : 'none';
                document.getElementById('campo-cpf').style.display = (data.pode_renovar && !data.cpf) ? 'block' : 'none';
            } catch (e) {
                document.getElementById('nome-cliente').textContent = 'Erro: ' + e.message;
            }
        }
        window.carregarStatus = carregarStatus;

        async function iniciarRenovacao() {
            const btn = document.getElementById('btn-renovar');
            const cpfDigitado = document.getElementById('cpf-input').value.replace(/\D/g, '');

            if (document.getElementById('campo-cpf').style.display !== 'none' && cpfDigitado.length !== 11) {
                alert('Informe um CPF válido para continuar.');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Gerando cobrança...';
            try {
                const token = await window.pegarTokenAtualizado();
                const resp = await fetch(`${window.API_URL}/renovar`, {
                    method: 'POST',
                    headers: {
                        'Authorization': 'Bearer ' + token,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ cpf: cpfDigitado || undefined })
                });
                const data = await resp.json();
                if (!resp.ok) throw new Error(data.message || data.error || 'Erro ao gerar renovação.');

                document.getElementById('pix-qr').src = 'data:image/png;base64,' + data.pix.imagem;
                document.getElementById('pix-copia').textContent = data.pix.payload;
                document.getElementById('tela-status').style.display = 'none';
                document.getElementById('tela-pagamento').style.display = 'block';

                pollTimer = setInterval(verificarRenovacao, 4000);
            } catch (e) {
                alert(e.message);
                btn.disabled = false;
                btn.textContent = 'Renovar por 1 mês';
            }
        }
        window.iniciarRenovacao = iniciarRenovacao;

        async function verificarRenovacao() {
            try {
                const token = await window.pegarTokenAtualizado();
                const resp = await fetch(`${window.API_URL}/meu-status`, {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                const data = await resp.json();
                if (!resp.ok) return;
                if (data.dias !== null && ultimoDias !== null && data.dias > ultimoDias && !data.pending_charge_id) {
                    clearInterval(pollTimer);
                    document.getElementById('status-aguardando').style.display = 'none';
                    document.getElementById('status-ok').style.display = 'block';
                    setTimeout(() => { window.location.href = 'home.html'; }, 2000);
                }
            } catch (e) { /* tenta de novo no próximo ciclo */ }
        }

        function copiarPix() {
            navigator.clipboard.writeText(document.getElementById('pix-copia').textContent);
        }
    </script>
</body>
</html>
