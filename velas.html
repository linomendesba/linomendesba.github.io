<script src="lightweight-charts.standalone.production.js"></script>
<script>
(function(){
    "use strict";

// ---------- CASAS / LIGAS DISPONÍVEIS ----------
    const CASAS = {
        bet365: {
            nome: 'Bet365',
            ligas: {
                'Copa':    'https://betstat.site/resultados/bet365/Copa',
                'Euro':    'https://betstat.site/resultados/bet365/Euro',
                'Super':   'https://betstat.site/resultados/bet365/Super',
                'Premier': 'https://betstat.site/resultados/bet365/Premier'
            }
        },
        betano: {
            nome: 'Betano',
            ligas: {
                'World':                                  'https://betstat.site/resultados/Mundial',
                'Copa América':                           'https://betstat.site/resultados/Copa%20Am%C3%A9rica',
                'Clássicos da América (Taça Glória Eterna)': 'https://betstat.site/resultados/Ta%C3%A7a%20Gl%C3%B3ria%20eterna',
                'Euro':                                   'https://betstat.site/resultados/Euro',
                'Campeonato Italiano':                    'https://betstat.site/resultados/Campeonato%20Italiano',
                'Copa das Estrelas':                      'https://betstat.site/resultados/Copa%20das%20estrelas',
                'Brasileirão Betano':                     'https://betstat.site/resultados/Brasileir%C3%A3o%20Betano'
            }
        },
        kiron: {
            nome: 'Kiron',
            ligas: {
                'England League': 'https://betstat.site/resultados/kiron/England',
                'Italy League':   'https://betstat.site/resultados/kiron/Italy',
                'Spain League':   'https://betstat.site/resultados/kiron/Spain'
            }
        },
        estrela: {
            nome: 'EstrelaBet',
            ligas: {
                'Copa do Mundo':        'https://betstat.site/resultados/estrela/Copa%20do%20Mundo',
                'Ligas dos Campeões':   'https://betstat.site/resultados/estrela/Ligas%20dos%20Campe%C3%B5es',
                'América Latina':      'https://betstat.site/resultados/estrela/Am%C3%A9rica%20Latina'
            }
        },
        betsson: {
            nome: 'Betsson',
            ligas: {
                'Espanha':     'https://betstat.site/resultados/betsson/Espanha',
                'Inglaterra':  'https://betstat.site/resultados/betsson/Inglaterra',
                'Brasil':      'https://betstat.site/resultados/betsson/Brasil'
            }
        }
    };

    let casaAtual = 'betano';
    let ligaAtual = 'Clássicos da América (Taça Glória Eterna)';
    let LIGA = ligaAtual;
    let URL_RESULTADOS = CASAS[casaAtual].ligas[ligaAtual];
    let STATE_KEY = 'betstat:velas:estado:v1:' + casaAtual + ':' + ligaAtual;

    const statusEl = document.getElementById('status');
    const log = (msg) => { statusEl.innerHTML = msg; console.log('[velas]', msg.replace(/<[^>]+>/g, '')); };
    const $ = (id) => document.getElementById(id);

    function popularSelectorCasa(){
        const sel = $('casaSelector');
        sel.innerHTML = Object.entries(CASAS).map(([key, cfg]) => `<option value="${key}">${cfg.nome}</option>`).join('');
        sel.value = casaAtual;
    }

    function popularSelectorLiga(){
        const sel = $('ligaSelector');
        const ligas = CASAS[casaAtual].ligas;
        sel.innerHTML = Object.keys(ligas).map(nome => `<option value="${nome}">${nome}</option>`).join('');
        sel.value = ligaAtual in ligas ? ligaAtual : Object.keys(ligas)[0];
    }

    function trocarFonteDados(){
        LIGA = ligaAtual;
        URL_RESULTADOS = CASAS[casaAtual].ligas[ligaAtual];
        STATE_KEY = 'betstat:velas:estado:v1:' + casaAtual + ':' + ligaAtual;
        try { sessionStorage.setItem('ligaAtual', casaAtual + ':' + ligaAtual); } catch {}
        document.getElementById('graficoSub').textContent = `${CASAS[casaAtual].nome} — ${LIGA}`;

        // reseta pra buscar do zero na nova fonte
        rawDataCache = null;
        visibleRange = null;
        applySavedState();
        syncLegendUI();
        window.GraficoTradingTools?.reloadIfLigaChanged?.();

        log('buscando dados de ' + LIGA + '...');
        fetch(URL_RESULTADOS + '?timestamp=' + Date.now())
            .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
            .then(data => {
                rawDataCache = Array.isArray(data) ? data : (data.rows || data.resultados || []);
                if (!rawDataCache.length){
                    log('⚠️ resposta chegou mas veio vazia.');
                    return;
                }
                render();
            })
            .catch(err => {
                log('❌ erro buscando dados: ' + err.message);
                console.error('[velas] erro fetch:', err);
            });
    }

    try { sessionStorage.setItem('ligaAtual', casaAtual + ':' + ligaAtual); } catch {}
    document.getElementById('graficoSub').textContent = `${CASAS[casaAtual].nome} — ${LIGA}`;

    function parseHtParts(htStr){
        if (!htStr || htStr === 'OUT') return null;
        if (htStr.includes(' x ')){
            const p = htStr.split(' x ').map(Number);
            if (p.length === 2 && !isNaN(p[0]) && !isNaN(p[1])) return p;
        }
        return null;
    }

    // ---------- INDICADORES (mesma lógica do painel analítico: MA, RSI, MACD) ----------
    const IND_CFG = { periodoMA1: 9, periodoMA2: 21, rsiPeriodo: 14, macdRapida: 9, macdLenta: 21, macdSinal: 8 };

    function calcMA(pts, p) {
        return pts.map((_, i) => {
            const s = pts.slice(Math.max(0, i - p + 1), i + 1);
            return s.reduce((a, b) => a + b, 0) / s.length;
        });
    }
    function calcRSI(pts, per = 14) {
        const g = [], p = [];
        for (let i = 1; i < pts.length; i++) {
            const d = pts[i] - pts[i - 1];
            g.push(d > 0 ? d : 0);
            p.push(d < 0 ? Math.abs(d) : 0);
        }
        const r = [];
        for (let i = per; i < g.length; i++) {
            const mg = g.slice(i - per, i).reduce((a, b) => a + b, 0) / per;
            const mp = p.slice(i - per, i).reduce((a, b) => a + b, 0) / per;
            r.push(100 - 100 / (1 + mg / (mp || 1)));
        }
        return Array(per).fill(null).concat(r);
    }
    function calcEMA(d, p) {
        const k = 2 / (p + 1), e = [d[0]];
        for (let i = 1; i < d.length; i++) e.push(d[i] * k + e[i - 1] * (1 - k));
        return e;
    }
    function calcMACD(d, r, l, s) {
        const er = calcEMA(d, r), el = calcEMA(d, l);
        const macd = er.map((v, i) => v - el[i]);
        const sig = calcEMA(macd, s);
        return { macd, sig, hist: macd.map((v, i) => v - sig[i]) };
    }

    const indicadores = { mm: false, rsi: false, macd: false };
    let maSeries1 = null, maSeries2 = null;
    let rsiChart = null, rsiSeries = null;
    let macdChart = null, macdLineSeries = null, macdSignalSeries = null, macdHistSeries = null;
    let syncingIndPanels = false;

    function garantirSeriesMA(){
        if (!chart) return;
        if (!maSeries1) maSeries1 = chart.addLineSeries({ color: '#22c55e', lineWidth: 2, priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false });
        if (!maSeries2) maSeries2 = chart.addLineSeries({ color: '#f59e0b', lineWidth: 2, priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false });
    }

    function criarPainelRSI(){
        const el = $('rsiPanelContainer');
        if (!el || !window.LightweightCharts || rsiChart) return;
        rsiChart = window.LightweightCharts.createChart(el, {
            layout: { background: { color: '#111318' }, textColor: '#cbd5e1' },
            grid: { vertLines: { color: 'rgba(255,255,255,.045)' }, horzLines: { color: 'rgba(255,255,255,.045)' } },
            rightPriceScale: { borderVisible: false },
            timeScale: { borderColor: 'rgba(124,92,246,.28)', timeVisible: false, secondsVisible: false, tickMarkFormatter: t => pontosAtuais[t]?.labelTempo || '' },
            crosshair: { mode: window.LightweightCharts.CrosshairMode.Normal },
            handleScroll: { mouseWheel: true, pressedMouseMove: true, horzTouchDrag: true, vertTouchDrag: false },
            handleScale: { axisPressedMouseMove: true, mouseWheel: true, pinch: true }
        });
        rsiSeries = rsiChart.addLineSeries({ color: '#38bdf8', lineWidth: 2, priceLineVisible: false, lastValueVisible: true, autoscaleInfoProvider: () => ({ priceRange: { minValue: 0, maxValue: 100 } }) });
        rsiSeries.createPriceLine({ price: 70, color: 'rgba(239,68,68,.55)', lineWidth: 1, lineStyle: window.LightweightCharts.LineStyle.Dashed, axisLabelVisible: true, title: '70' });
        rsiSeries.createPriceLine({ price: 30, color: 'rgba(34,197,94,.55)', lineWidth: 1, lineStyle: window.LightweightCharts.LineStyle.Dashed, axisLabelVisible: true, title: '30' });
        rsiChart.timeScale().subscribeVisibleLogicalRangeChange(range => sincronizarPaineis(range, rsiChart));
    }

    function criarPainelMACD(){
        const el = $('macdPanelContainer');
        if (!el || !window.LightweightCharts || macdChart) return;
        macdChart = window.LightweightCharts.createChart(el, {
            layout: { background: { color: '#111318' }, textColor: '#cbd5e1' },
            grid: { vertLines: { color: 'rgba(255,255,255,.045)' }, horzLines: { color: 'rgba(255,255,255,.045)' } },
            rightPriceScale: { borderVisible: false },
            timeScale: { borderColor: 'rgba(124,92,246,.28)', timeVisible: false, secondsVisible: false, tickMarkFormatter: t => pontosAtuais[t]?.labelTempo || '' },
            crosshair: { mode: window.LightweightCharts.CrosshairMode.Normal },
            handleScroll: { mouseWheel: true, pressedMouseMove: true, horzTouchDrag: true, vertTouchDrag: false },
            handleScale: { axisPressedMouseMove: true, mouseWheel: true, pinch: true }
        });
        macdHistSeries = macdChart.addHistogramSeries({ priceLineVisible: false, lastValueVisible: false });
        macdLineSeries = macdChart.addLineSeries({ color: '#7c5cff', lineWidth: 2, priceLineVisible: false, lastValueVisible: false });
        macdSignalSeries = macdChart.addLineSeries({ color: '#f59e0b', lineWidth: 2, priceLineVisible: false, lastValueVisible: false });
        macdChart.timeScale().subscribeVisibleLogicalRangeChange(range => sincronizarPaineis(range, macdChart));
    }

    function sincronizarPaineis(range, origem){
        if (!range || syncingIndPanels) return;
        syncingIndPanels = true;
        [chart, rsiChart, macdChart].forEach(c => { if (c && c !== origem) c.timeScale().setVisibleLogicalRange(range); });
        syncingIndPanels = false;
    }

    function atualizarIndicadores(){
        const keyAtivo = Object.keys(mercados).find(k => mercados[k].ativo);
        const candles = (keyAtivo && candlePorMercado[keyAtivo]) || [];
        const closes = candles.map(c => c.close);
        const times = candles.map(c => c.time);

        if (indicadores.mm && maSeries1 && maSeries2 && closes.length){
            const ma1 = calcMA(closes, IND_CFG.periodoMA1);
            const ma2 = calcMA(closes, IND_CFG.periodoMA2);
            maSeries1.setData(times.map((t, i) => ({ time: t, value: ma1[i] })));
            maSeries2.setData(times.map((t, i) => ({ time: t, value: ma2[i] })));
        } else {
            maSeries1?.setData([]);
            maSeries2?.setData([]);
        }

        if (indicadores.rsi && rsiSeries && closes.length){
            const rsi = calcRSI(closes, IND_CFG.rsiPeriodo);
            rsiSeries.setData(times.map((t, i) => ({ time: t, value: rsi[i] })).filter(p => p.value !== null));
        }

        if (indicadores.macd && macdLineSeries && closes.length){
            const { macd, sig, hist } = calcMACD(closes, IND_CFG.macdRapida, IND_CFG.macdLenta, IND_CFG.macdSinal);
            macdLineSeries.setData(times.map((t, i) => ({ time: t, value: macd[i] })));
            macdSignalSeries.setData(times.map((t, i) => ({ time: t, value: sig[i] })));
            macdHistSeries.setData(times.map((t, i) => ({ time: t, value: hist[i], color: hist[i] >= 0 ? 'rgba(34,197,94,.65)' : 'rgba(239,68,68,.65)' })));
        }

        const range = chart?.timeScale()?.getVisibleLogicalRange?.();
        if (range) sincronizarPaineis(range, chart);
    }

    function resizePainelIndicador(painelChart, containerId){
        const el = $(containerId);
        if (!painelChart || !el) return;
        const rect = el.getBoundingClientRect();
        if (rect.width < 10 || rect.height < 10) return;
        painelChart.applyOptions({ width: Math.floor(rect.width), height: Math.floor(rect.height) });
    }

    function aplicarVisibilidadePaineis(){
        $('rsiPanelWrap').style.display = indicadores.rsi ? '' : 'none';
        $('macdPanelWrap').style.display = indicadores.macd ? '' : 'none';
        requestAnimationFrame(() => {
            resizePainelIndicador(rsiChart, 'rsiPanelContainer');
            resizePainelIndicador(macdChart, 'macdPanelContainer');
        });
    }

    // ---------- ESTADO DOS MERCADOS ----------
    const mercados = {
        totalGols: { nome: 'Total Gols (FT)', cor: '#7c5cff', ativo: true }
    };

    let chart = null;
    let visibleRange = null;

    const candleSeries = {};

    let velasNumPoints = 60;
    let pontosAtuais = {};
    let candlePorMercado = {};
    let ultimoValorPorMercado = {};
    let rawDataCache = null;

    // ---------- PERSISTÊNCIA (localStorage) ----------
    function saveState(){
        try {
            const range = chart?.timeScale?.().getVisibleLogicalRange?.() || visibleRange;
            localStorage.setItem(STATE_KEY, JSON.stringify({
                range, velasNumPoints,
                mercados: Object.fromEntries(Object.entries(mercados).map(([k, v]) => [k, !!v.ativo])),
                indicadores
            }));
        } catch {}
    }

    function loadState(){
        try {
            const raw = localStorage.getItem(STATE_KEY);
            return raw ? JSON.parse(raw) : null;
        } catch { return null; }
    }

    function applySavedState(){
        const st = loadState();
        if (!st) return;
        if (st.velasNumPoints) velasNumPoints = st.velasNumPoints;
        if (st.mercados) Object.keys(mercados).forEach(k => { if (k in st.mercados) mercados[k].ativo = !!st.mercados[k]; });
        if (st.range && Number.isFinite(st.range.from) && Number.isFinite(st.range.to)) visibleRange = st.range;
        if (st.indicadores) Object.assign(indicadores, st.indicadores);

        // sanitiza estado antigo (versões anteriores permitiam FT+HT juntos) — mantém só 1 ativo
        const ativos = Object.keys(mercados).filter(k => mercados[k].ativo);
        if (ativos.length !== 1) {
            const escolhido = ativos[0] || 'totalGols';
            Object.keys(mercados).forEach(k => { mercados[k].ativo = (k === escolhido); });
        }

        $('velasPointsSelector').value = String(velasNumPoints);
    }

    // ---------- CONSTRÓI SÉRIES — Total Gols (FT/HT), lógica real do grafico-principal-novo do Caramelo ----------
    // Compara blocos de 20 jogos posição a posição: tamanho do candle = diferença real de gols
    // entre o jogo atual e o jogo na mesma posição do bloco anterior.
    function buildSeriesData(rawData){
        const sorted = [...rawData].sort((a, b) => {
            const dA = new Date(a.data), dB = new Date(b.data);
            if (dA.getTime() !== dB.getTime()) return dA - dB;
            if (a.hora !== b.hora) return a.hora - b.hora;
            return a.minuto - b.minuto;
        });
        const sliced = sorted.slice(-velasNumPoints); // cronológico, mais antigo → mais novo
        const usadosDesc = sliced.slice().reverse();  // mais novo → mais antigo (formato usado pelo Caramelo)

        const candles = {};
        Object.keys(mercados).forEach(k => { candles[k] = []; ultimoValorPorMercado[k] = 0; });
        pontosAtuais = {};

        const BLOCO = 20; // tamanho do bloco de comparação, igual ao grafico-principal-novo
        const totalBlocos = Math.floor(usadosDesc.length / BLOCO);

        if (totalBlocos < 2){
            candlePorMercado = candles;
            log(`⚠️ selecione pelo menos 40 jogos (esse gráfico compara blocos de ${BLOCO} jogos, precisa de no mínimo 2 blocos).`);
            return;
        }

        const blocos = [];
        for (let i = 0; i < totalBlocos; i++) blocos.push(usadosDesc.slice(i * BLOCO, i * BLOCO + BLOCO));

        const blocoBase = blocos[blocos.length - 1]; // bloco mais antigo = ponto de partida da curva

        // sequência de jogos de referência — igual pra todos os mercados, usada no tooltip
        const refs = [blocoBase[BLOCO - 1] || blocoBase[blocoBase.length - 1] || null];
        for (let b = totalBlocos - 2; b >= 0; b--) {
            for (let i = BLOCO - 1; i >= 0; i--) refs.push(blocos[b][i] || null);
        }

        function totalGolsFt(m){
            let ft = [0, 0];
            if (m?.ft && m.ft.includes(' x ')) ft = m.ft.split(' x ').map(Number);
            return (Number.isFinite(ft[0]) && Number.isFinite(ft[1])) ? (ft[0] + ft[1]) : 0;
        }

        Object.keys(mercados).forEach(key => {
            const mediaGols = blocoBase.length
                ? blocoBase.reduce((s, m) => s + totalGolsFt(m), 0) / blocoBase.length
                : 0;

            const pontos = [mediaGols * 20];
            const cores = ['flat'];

            for (let b = totalBlocos - 2; b >= 0; b--) {
                for (let i = BLOCO - 1; i >= 0; i--) {
                    const atual = blocos[b][i];
                    const ref   = blocos[b + 1][i];

                    if (!atual || !ref) { pontos.push(pontos[pontos.length - 1]); cores.push('flat'); continue; }

                    const deltaGols = totalGolsFt(atual) - totalGolsFt(ref);
                    pontos.push(pontos[pontos.length - 1] + deltaGols);
                    cores.push(deltaGols > 0 ? '#4CAF50' : deltaGols < 0 ? '#FF3B30' : 'flat');
                }
            }

            pontos.forEach((close, idx) => {
                const time = idx + 1;
                const open = idx > 0 ? pontos[idx - 1] : close;
                const corpo = close - open;
                const pavio = Math.max(0.35, Math.abs(corpo) * 0.35);

                const item = {
                    time, open, close,
                    high: Math.max(open, close) + pavio,
                    low:  Math.min(open, close) - pavio
                };
                const cor = cores[idx];
                if (cor && cor !== 'flat') { item.color = cor; item.borderColor = cor; item.wickColor = cor; }
                candles[key].push(item);
            });

            ultimoValorPorMercado[key] = pontos[pontos.length - 1] ?? 0;
        });

        refs.forEach((m, idx) => {
            if (!m) return;
            pontosAtuais[idx + 1] = {
                labelTempo: `${String(m.hora).padStart(2, '0')}:${String(m.minuto).padStart(2, '0')}`,
                jogo: `${m.time_a || ''} x ${m.time_b || ''}`,
                ft: m.ft || '-',
                ht: m.ht || '-'
            };
        });

        candlePorMercado = candles;
    }

    // ---------- CHART (mesma config do Caramelo) ----------
    function addCandleSeriesFn(key, cfg){
        const options = {
            upColor: cfg.cor, downColor: '#ef4444',
            borderUpColor: cfg.cor, borderDownColor: '#ef4444',
            wickUpColor: cfg.cor, wickDownColor: '#ef4444',
            priceLineVisible: false, lastValueVisible: false
        };
        if (chart.addSeries && window.LightweightCharts.CandlestickSeries){
            return chart.addSeries(window.LightweightCharts.CandlestickSeries, options);
        }
        return chart.addCandlestickSeries(options);
    }

    function createChart(){
        const el = $('graficoTradingContainer');
        if (!el || !window.LightweightCharts) return false;
        if (chart) return true;

        chart = window.LightweightCharts.createChart(el, {
            layout: { background: { color: '#111318' }, textColor: '#cbd5e1' },
            localization: { timeFormatter: t => pontosAtuais[t]?.labelTempo || String(t) },
            grid: {
                vertLines: { color: 'rgba(255,255,255,.045)' },
                horzLines: { color: 'rgba(255,255,255,.045)' }
            },
            rightPriceScale: { borderVisible: false },
            timeScale: {
                borderColor: 'rgba(124,92,246,.28)',
                timeVisible: false,
                secondsVisible: false,
                rightOffset: 1,
                barSpacing: 22,
                rightBarStaysOnScroll: true,
                tickMarkFormatter: t => pontosAtuais[t]?.labelTempo || ''
            },
            crosshair: { mode: window.LightweightCharts.CrosshairMode.Normal },
            handleScroll: { mouseWheel: true, pressedMouseMove: true, horzTouchDrag: true, vertTouchDrag: false },
            handleScale:  { axisPressedMouseMove: true, mouseWheel: true, pinch: true }
        });

        Object.entries(mercados).forEach(([key, cfg]) => {
            candleSeries[key] = addCandleSeriesFn(key, cfg);
        });

        chart.timeScale().subscribeVisibleLogicalRangeChange((range) => {
            if (range) { visibleRange = range; saveState(); sincronizarPaineis(range, chart); }
            window.GraficoTradingTools?.redraw?.();
        });

        chart.subscribeCrosshairMove(renderTooltip);
        garantirSeriesMA();
        return true;
    }

    function renderSeries(){
        Object.keys(mercados).forEach(key => {
            const ativo = !!mercados[key].ativo;
            candleSeries[key]?.setData(ativo ? (candlePorMercado[key] || []) : []);
        });
    }

    function resizeChart(){
        const el = $('graficoTradingContainer');
        if (!chart || !el) return;
        const rect = el.getBoundingClientRect();
        if (rect.width < 10 || rect.height < 10) return;
        chart.applyOptions({ width: Math.floor(rect.width), height: Math.floor(rect.height) });
        resizePainelIndicador(rsiChart, 'rsiPanelContainer');
        resizePainelIndicador(macdChart, 'macdPanelContainer');
        window.GraficoTradingTools?.resize?.();
        window.GraficoTradingTools?.redraw?.();
    }

    function zoomGrafico(factor){
        if (!chart) return;
        const timeScale = chart.timeScale();
        const range = timeScale.getVisibleLogicalRange();
        if (!range) return;
        const center = (range.from + range.to) / 2;
        const width = (range.to - range.from) * factor;
        timeScale.setVisibleLogicalRange({ from: center - width / 2, to: center + width / 2 });
        window.GraficoTradingTools?.redraw?.();
    }

    // ---------- TOOLTIP ----------
    function getTooltipEl(){
        let el = document.getElementById('gtTooltip');
        if (!el){
            el = document.createElement('div');
            el.id = 'gtTooltip';
            el.className = 'gt-tooltip';
            $('graficoTradingContainer')?.appendChild(el);
        }
        return el;
    }

    function renderTooltip(param){
        const el = getTooltipEl();
        const container = $('graficoTradingContainer');
        if (!param || !param.point || !container || param.time == null){
            el.style.display = 'none';
            return;
        }
        const info = pontosAtuais[param.time];
        if (!info){ el.style.display = 'none'; return; }

        el.innerHTML = `
            <div class="gt-tooltip-title">${info.jogo}</div>
            <div class="gt-tooltip-sub">HT: ${info.ht}</div>
            <div class="gt-tooltip-odd">FT: ${info.ft}</div>
            <div class="gt-tooltip-time">${info.labelTempo}</div>
        `;

        const rect = container.getBoundingClientRect();
        const tooltipW = 230, tooltipH = 92;
        let left = param.point.x + 14, top = param.point.y + 14;
        if (left + tooltipW > rect.width) left = param.point.x - tooltipW - 14;
        if (top + tooltipH > rect.height) top = param.point.y - tooltipH - 14;
        el.style.left = `${Math.max(8, left)}px`;
        el.style.top  = `${Math.max(8, top)}px`;
        el.style.display = 'block';
    }

    // ---------- RENDER PRINCIPAL ----------
    function render(){
        if (!rawDataCache) return;
        if (!createChart()) return;

        const beforeRange = chart.timeScale().getVisibleLogicalRange();
        buildSeriesData(rawDataCache);
        renderSeries();
        atualizarIndicadores();

        if (beforeRange) chart.timeScale().setVisibleLogicalRange(beforeRange);
        else if (visibleRange) chart.timeScale().setVisibleLogicalRange(visibleRange);
        else chart.timeScale().scrollToRealTime();

        saveState();
        log(`<b>${rawDataCache.length}</b> jogos carregados de <b>${LIGA}</b> — mostrando <b>${Math.min(velasNumPoints, rawDataCache.length)}</b>`);

        requestAnimationFrame(() => {
            resizeChart();
            window.GraficoTradingTools?.reloadIfLigaChanged?.();
            window.GraficoTradingTools?.redraw?.();
        });
    }

    function syncLegendUI(){
        document.querySelectorAll('[data-gt-market]').forEach(btn => {
            const key = btn.dataset.gtMarket;
            btn.classList.toggle('selected', !!mercados[key]?.ativo);
        });
    }

    // ---------- EVENTOS ----------
    document.querySelectorAll('[data-gt-market]').forEach(btn => {
        btn.addEventListener('click', () => {
            const key = btn.dataset.gtMarket;
            if (!mercados[key]) return;
            // seleção única — FT e HT não fazem sentido juntos (escalas de gols diferentes)
            Object.keys(mercados).forEach(k => { mercados[k].ativo = (k === key); });
            syncLegendUI();
            saveState();
            render();
        });
    });

    $('btnGraficoZoomIn').addEventListener('click', () => zoomGrafico(0.78));
    $('btnGraficoZoomOut').addEventListener('click', () => zoomGrafico(1.28));

    $('velasPointsSelector').addEventListener('change', e => {
        velasNumPoints = parseInt(e.target.value, 10);
        saveState();
        render();
    });

    $('casaSelector').addEventListener('change', e => {
        casaAtual = e.target.value;
        popularSelectorLiga();
        ligaAtual = $('ligaSelector').value;
        trocarFonteDados();
    });

    $('ligaSelector').addEventListener('change', e => {
        ligaAtual = e.target.value;
        trocarFonteDados();
    });

    document.querySelectorAll('[data-gt-tool]').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('[data-gt-tool]').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            window.GraficoTradingTools?.setTool?.(btn.dataset.gtTool || 'select');
        });
    });

    $('btnGraficoCurrentLine').addEventListener('click', () => {
        window.GraficoTradingTools?.addCurrentLine?.();
    });

    $('btnToggleMM').addEventListener('click', () => {
        indicadores.mm = !indicadores.mm;
        $('btnToggleMM').classList.toggle('active', indicadores.mm);
        if (indicadores.mm) garantirSeriesMA();
        atualizarIndicadores();
        saveState();
    });

    $('btnToggleRSI').addEventListener('click', () => {
        indicadores.rsi = !indicadores.rsi;
        $('btnToggleRSI').classList.toggle('active', indicadores.rsi);
        if (indicadores.rsi) criarPainelRSI();
        aplicarVisibilidadePaineis();
        atualizarIndicadores();
        saveState();
    });

    $('btnToggleMACD').addEventListener('click', () => {
        indicadores.macd = !indicadores.macd;
        $('btnToggleMACD').classList.toggle('active', indicadores.macd);
        if (indicadores.macd) criarPainelMACD();
        aplicarVisibilidadePaineis();
        atualizarIndicadores();
        saveState();
    });

    window.addEventListener('resize', resizeChart);

    window.addEventListener('gt:toolchange', (ev) => {
        document.querySelectorAll('[data-gt-tool]').forEach(b => b.classList.toggle('active', b.dataset.gtTool === (ev.detail?.tool || 'select')));
    });

    if (window.ResizeObserver){
        new ResizeObserver(() => resizeChart()).observe($('graficoTradingContainer'));
    }

    // ---------- API PÚBLICA PARA A ferramenta de desenho (grafico-trading-tools.js) ----------
    window.GraficoTradingCore = {
        getChart: () => chart,
        getSeries: () => candleSeries,
        getCandleSeries: () => candleSeries,
        getActiveMarket: () => Object.keys(mercados).find(k => mercados[k].ativo) || 'totalGols',
        getMarketColor: (key) => mercados[key]?.cor || '#60a5fa',
        getLastValue: (key) => ultimoValorPorMercado[key || (Object.keys(mercados).find(k => mercados[k].ativo) || 'totalGols')] ?? 0,
        redrawTools: () => window.GraficoTradingTools?.redraw?.()
    };

    // ---------- BOOT ----------
    popularSelectorCasa();
    popularSelectorLiga();
    applySavedState();
    syncLegendUI();

    $('btnToggleMM').classList.toggle('active', indicadores.mm);
    $('btnToggleRSI').classList.toggle('active', indicadores.rsi);
    $('btnToggleMACD').classList.toggle('active', indicadores.macd);
    if (indicadores.rsi) criarPainelRSI();
    if (indicadores.macd) criarPainelMACD();
    aplicarVisibilidadePaineis();

    log('buscando dados de ' + LIGA + '...');
    fetch(URL_RESULTADOS + '?timestamp=' + Date.now())
        .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
        .then(data => {
            rawDataCache = Array.isArray(data) ? data : (data.rows || data.resultados || []);
            if (!rawDataCache.length){
                log('⚠️ resposta chegou mas veio vazia. Veja o console (F12) pra ver o JSON bruto.');
                console.log('[velas] resposta bruta:', data);
                return;
            }
            render();
            requestAnimationFrame(() => window.GraficoTradingTools?.onOpen?.());
        })
        .catch(err => {
            log('❌ erro buscando dados: ' + err.message + ' — veja o console (F12)');
            console.error('[velas] erro fetch:', err);
        });

    setInterval(() => {
        fetch(URL_RESULTADOS + '?timestamp=' + Date.now())
            .then(r => r.json())
            .then(data => {
                rawDataCache = Array.isArray(data) ? data : (data.rows || data.resultados || []);
                render();
            })
            .catch(() => {});
    }, 5000);
})();
</script>

  fetch('header.html').then(r=>r.text()).then(d=>{document.getElementById('header').innerHTML=d;});
